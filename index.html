                  <input
                    type="text"
                    placeholder="e.g. Dr. Arthur Miller"
                    value={providerName}
                    onChange={(e) => setProviderName(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                  />
                </div>
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Clinic Name</label>
                  <input
                    type="text"
                    placeholder="e.g. Bayside Medical"
                    value={clinicName}
                    onChange={(e) => setClinicName(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                  />
                </div>
              </div>

              {/* Reason for Visit */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                  Reason for Visit <span className="text-rose-400">*</span>
                </label>
                <textarea
                  rows={2}
                  required
                  placeholder="e.g. Cough for 2 weeks, routine 6-month cleaning, annual checkup..."
                  value={reason}
                  onChange={(e) => setReason(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                />
              </div>

              {/* What the Doctor / Vet Said */}
              <div>
                <label className="block font-bold text-blue-400 mb-1">
                  What the Doctor / Vet Said (Advice & Findings)
                </label>
                <textarea
                  rows={3}
                  placeholder="Record diagnosis, dietary suggestions, instructions, home care tips..."
                  value={doctorAdvice}
                  onChange={(e) => setDoctorAdvice(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${
                    isDark ? 'bg-blue-950/20 border-blue-900/50 text-blue-100 placeholder-zinc-500' : 'bg-blue-50/50 border-blue-200 text-blue-900'
                  }`}
                />
              </div>

              {/* Prescriptions & Medications Given */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                  Prescriptions & Medications Given
                </label>
                <input
                  type="text"
                  placeholder="e.g. Amoxicillin 250mg 3x daily for 7 days, NexGard Spectra"
                  value={prescriptions}
                  onChange={(e) => setPrescriptions(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                />
              </div>

              {/* Follow Up */}
              <div className="flex items-center space-x-3 pt-1">
                <input
                  type="checkbox"
                  id="followUpCheck"
                  checked={followUpNeeded}
                  onChange={(e) => setFollowUpNeeded(e.target.checked)}
                  className="rounded text-blue-600 focus:ring-0"
                />
                <label htmlFor="followUpCheck" className="font-bold text-xs cursor-pointer">
                  Follow-up visit required?
                </label>
              </div>

              {followUpNeeded && (
                <div className={`p-3 rounded-2xl border space-y-2 ${isDark ? 'bg-amber-950/20 border-amber-800/40' : 'bg-amber-50 border-amber-200'}`}>
                  <div className="flex items-center justify-between">
                    <label className={`block font-bold ${isDark ? 'text-amber-300' : 'text-amber-900'}`}>
                      Follow-up Review Date <span className="text-rose-400">*</span>
                    </label>
                    <span className="text-[10px] font-semibold text-amber-500">Auto-schedules Upcoming Visit</span>
                  </div>

                  {/* Preset buttons relative to visit date */}
                  <div className="flex flex-wrap items-center gap-1.5">
                    <span className={`text-[10px] font-bold ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>Presets from visit:</span>
                    {[
                      { label: '1 Week', type: 'days', val: 7 },
                      { label: '1 Month', type: 'months', val: 1 },
                      { label: '6 Months', type: 'months', val: 6 },
                      { label: '1 Year', type: 'years', val: 1 }
                    ].map(preset => (
                      <button
                        key={preset.label}
                        type="button"
                        onClick={() => handleFollowUpPreset(preset.type, preset.val)}
                        className={`px-2.5 py-1 rounded-lg text-[10px] font-bold border transition-all active:scale-95 ${
                          isDark
                            ? 'bg-zinc-900 hover:bg-zinc-800 border-zinc-700 text-amber-300 hover:border-amber-400'
                            : 'bg-white hover:bg-amber-100 border-amber-300 text-amber-900 shadow-xs'
                        }`}
                      >
                        +{preset.label}
                      </button>
                    ))}
                  </div>

                  <input
                    type="date"
                    value={followUpDate}
                    onChange={(e) => setFollowUpDate(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  />
                </div>
              )}

              {/* Attachment Upload */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                  Attach Screenshot / Referral / Receipt
                </label>
                <input
                  type="file"
                  accept="image/*"
                  multiple
                  onChange={handleFileUpload}
                  className={`w-full text-xs p-2 rounded-xl border file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 ${
                    isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-300' : 'bg-slate-50 border-slate-200 text-slate-700'
                  }`}
                />
                {attachments.length > 0 && (
                  <div className="flex flex-wrap gap-2 mt-2">
                    {attachments.map((att, i) => (
                      <div key={i} className="relative group w-16 h-16 rounded-lg overflow-hidden border border-zinc-700">
                        <img src={att.url} alt="upload" className="w-full h-full object-cover" />
                        <button
                          type="button"
                          onClick={() => setAttachments(prev => prev.filter((_, idx) => idx !== i))}
                          className="absolute top-0.5 right-0.5 bg-black/75 text-white rounded-full p-0.5"
                        >
                          <Icon name="x" size={11} />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="pt-3 border-t border-zinc-800 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-4 py-2 rounded-xl font-bold ${isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-200 text-slate-700'}`}
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-500 shadow-md transition-all active:scale-98"
                >
                  {isEditing ? 'Update Visit Log' : 'Save Visit Log'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // CREATE / EDIT CLINIC MODAL
    // ==========================================
    function CreateClinicModal({ isDark, currentUser, initialData, onClose, onSave }) {
      const isEditing = Boolean(initialData && initialData.id);

      const [name, setName] = useState(initialData?.name || '');
      const [category, setCategory] = useState(initialData?.category || 'GP');
      const [phone, setPhone] = useState(initialData?.phone || '');
      const [emergencyPhone, setEmergencyPhone] = useState(initialData?.emergencyPhone || '');
      const [address, setAddress] = useState(initialData?.address || '');
      const [website, setWebsite] = useState(initialData?.website || '');
      const [hours, setHours] = useState(initialData?.hours || '');
      const [doctorsInput, setDoctorsInput] = useState(initialData?.doctors ? initialData.doctors.join(', ') : '');
      const [preferred, setPreferred] = useState(initialData ? Boolean(initialData.preferred) : true);
      const [notes, setNotes] = useState(initialData?.notes || '');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;

        const doctorsArray = doctorsInput
          .split(',')
          .map(d => d.trim())
          .filter(Boolean);

        onSave({
          id: isEditing ? initialData.id : 'c_' + Date.now(),
          name: name.trim(),
          category,
          phone: phone.trim(),
          emergencyPhone: emergencyPhone.trim(),
          address: address.trim(),
          website: website.trim(),
          hours: hours.trim(),
          doctors: doctorsArray,
          notes: notes.trim(),
          preferred,
          createdBy: initialData?.createdBy || currentUser.id,
          familyGroupId: initialData?.familyGroupId !== undefined ? initialData.familyGroupId : (currentUser.familyGroupId || null)
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm">
          <div className={`w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 border shadow-2xl ${
            isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
          }`}>
            <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
              <h2 className="font-bold text-base">{isEditing ? 'Edit Clinic or Practice' : 'Add Clinic or Practice'}</h2>
              <button onClick={onClose} className={`p-1.5 rounded-full ${isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-100 text-slate-500'}`}>
                <Icon name="x" size={17} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 pt-3 text-xs">
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                  Clinic / Hospital Name <span className="text-rose-400">*</span>
                </label>
                <input
                  type="text"
                  required
                  placeholder="e.g. City Central Veterinary Clinic"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Specialty Type</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                  >
                    <option value="GP">🩺 GP / Family Medical</option>
                    <option value="Vet">🐾 Veterinarian (Vet)</option>
                    <option value="Dentist">🦷 Dentist</option>
                    <option value="Optometrist">👓 Optometrist</option>
                    <option value="Physio">🏃 Physiotherapist</option>
                    <option value="Specialist">🔬 Specialist Clinic</option>
                  </select>
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Main Phone</label>
                  <input
                    type="tel"
                    placeholder="(555) 000-0000"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Emergency / After Hours</label>
                  <input
                    type="tel"
                    placeholder="Optional ER phone line"
                    value={emergencyPhone}
                    onChange={(e) => setEmergencyPhone(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                  />
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Website / Booking URL</label>
                  <input
                    type="url"
                    placeholder="https://..."
                    value={website}
                    onChange={(e) => setWebsite(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                  />
                </div>
              </div>

              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Full Street Address</label>
                <input
                  type="text"
                  placeholder="123 Health Ave, Suite 4B (for Maps navigation)"
                  value={address}
                  onChange={(e) => setAddress(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                />
              </div>

              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Known Doctors / Vets (comma separated)</label>
                <input
                  type="text"
                  placeholder="e.g. Dr. Smith, Dr. Taylor, Dr. Chloe"
                  value={doctorsInput}
                  onChange={(e) => setDoctorsInput(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                />
              </div>

              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Operating Hours</label>
                <input
                  type="text"
                  placeholder="e.g. Mon-Fri 8am-6pm, Sat 9am-1pm"
                  value={hours}
                  onChange={(e) => setHours(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                />
              </div>

              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Helpful Clinic Notes</label>
                <textarea
                  rows={2}
                  placeholder="Parking tips, bulk billing, pet leash policies, insurance info..."
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                />
              </div>

              <div className="flex items-center space-x-2 pt-1">
                <input
                  type="checkbox"
                  id="prefClinicCheck"
                  checked={preferred}
                  onChange={(e) => setPreferred(e.target.checked)}
                  className="rounded text-amber-500 focus:ring-0"
                />
                <label htmlFor="prefClinicCheck" className="font-bold text-xs cursor-pointer flex items-center space-x-1">
                  <span>⭐ Mark as Preferred / Family Favorite Clinic</span>
                </label>
              </div>

              <div className="pt-3 border-t border-zinc-800 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-4 py-2 rounded-xl font-bold ${isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-200 text-slate-700'}`}
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-500 shadow-md transition-all active:scale-98"
                >
                  {isEditing ? 'Update Clinic' : 'Save Clinic'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // CREATE / EDIT MEMBER MODAL
    // ==========================================
    function CreateMemberModal({ isDark, currentUser, initialData, onClose, onSave }) {
      const isEditing = Boolean(initialData && initialData.id);

      const [type, setType] = useState(initialData?.type || 'human');
      const [name, setName] = useState(initialData?.name || '');
      const [avatar, setAvatar] = useState(initialData?.avatar || '👩');
      
      // Common fields
      const [dob, setDob] = useState(initialData?.dob || '');
      const [allergiesInput, setAllergiesInput] = useState(initialData?.allergies ? initialData.allergies.join(', ') : '');
      const [conditions, setConditions] = useState(initialData?.conditions || '');
      const [insurancePolicy, setInsurancePolicy] = useState(initialData?.insurancePolicy || '');

      // Human-specific fields
      const [role, setRole] = useState(initialData?.role || 'Mother');
      const [bloodType, setBloodType] = useState(initialData?.bloodType || 'O+');
      const [emergencyContact, setEmergencyContact] = useState(initialData?.emergencyContact || '');
      const [emergencyPhone, setEmergencyPhone] = useState(initialData?.emergencyPhone || '');

      // Pet-specific fields
      const [species, setSpecies] = useState(initialData?.species || 'Dog');
      const [breed, setBreed] = useState(initialData?.breed || '');
      const [gender, setGender] = useState(initialData?.gender || 'Male');
      const [isDesexed, setIsDesexed] = useState(initialData ? Boolean(initialData.isDesexed) : true);
      const [microchip, setMicrochip] = useState(initialData?.microchip || '');
      const [weight, setWeight] = useState(initialData?.weight || '');

      const humanAvatars = ['👩', '👨', '👧', '👦', '👶', '👵', '👴', '🧑'];
      const petAvatars = ['🐶', '🐱', '🐰', '🦜', '🐹', '🐴', '🐾', '🐠'];

      const handleTypeToggle = (newType) => {
        setType(newType);
        if (!isEditing) {
          if (newType === 'pet') {
            setAvatar('🐶');
          } else {
            setAvatar('👩');
          }
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;

        const allergies = allergiesInput
          .split(',')
          .map(a => a.trim())
          .filter(Boolean);

        const savedMember = {
          id: isEditing ? initialData.id : 'm_' + Date.now(),
          name: name.trim(),
          type,
          avatar,
          dob,
          allergies,
          conditions: conditions.trim(),
          insurancePolicy: insurancePolicy.trim(),
          role: type === 'human' ? role.trim() : '',
          bloodType: type === 'human' ? bloodType : '',
          emergencyContact: type === 'human' ? emergencyContact.trim() : '',
          emergencyPhone: type === 'human' ? emergencyPhone.trim() : '',
          species: type === 'pet' ? species.trim() : '',
          breed: type === 'pet' ? breed.trim() : '',
          gender: type === 'pet' ? gender : '',
          isDesexed: type === 'pet' ? isDesexed : false,
          microchip: type === 'pet' ? microchip.trim() : '',
          weight: type === 'pet' ? weight.trim() : '',
          createdBy: initialData?.createdBy || currentUser.id,
          familyGroupId: initialData?.familyGroupId !== undefined ? initialData.familyGroupId : (currentUser.familyGroupId || null)
        };

        onSave(savedMember);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm animate-in fade-in">
          <div className={`w-full max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 border shadow-2xl ${
            isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
          }`}>
            <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
              <h2 className="font-bold text-base">{isEditing ? 'Edit Profile' : 'Add Family Member or Pet'}</h2>
              <button onClick={onClose} className={`p-1.5 rounded-full ${isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-100 text-slate-500'}`}>
                <Icon name="x" size={17} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 pt-3 text-xs">
              {/* Type Toggle */}
              <div className="grid grid-cols-2 gap-2">
                <button
                  type="button"
                  onClick={() => handleTypeToggle('human')}
                  className={`py-2.5 rounded-xl font-bold border transition-all ${
                    type === 'human'
                      ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                      : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-50 border-slate-200'
                  }`}
                >
                  👤 Human Member
                </button>
                <button
                  type="button"
                  onClick={() => handleTypeToggle('pet')}
                  className={`py-2.5 rounded-xl font-bold border transition-all ${
                    type === 'pet'
                      ? 'bg-amber-500 text-black border-amber-500 shadow-sm'
                      : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-50 border-slate-200'
                  }`}
                >
                  🐾 Family Pet
                </button>
              </div>

              {/* Quick Avatar Picker */}
              <div>
                <label className={`block font-bold mb-1.5 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Select Avatar Icon</label>
                <div className="flex items-center space-x-1.5 overflow-x-auto no-scrollbar pb-1">
                  {(type === 'pet' ? petAvatars : humanAvatars).map(icon => (
                    <button
                      key={icon}
                      type="button"
                      onClick={() => setAvatar(icon)}
                      className={`text-xl p-2 rounded-xl border transition-all shrink-0 ${
                        avatar === icon
                          ? 'bg-blue-600/20 border-blue-500 scale-105'
                          : isDark ? 'bg-zinc-950 border-zinc-800 hover:border-zinc-700' : 'bg-slate-50 border-slate-200'
                      }`}
                    >
                      {icon}
                    </button>
                  ))}
                  <input
                    type="text"
                    maxLength={4}
                    value={avatar}
                    onChange={(e) => setAvatar(e.target.value)}
                    className={`w-12 p-2 rounded-xl border text-center text-lg outline-none shrink-0 ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                    title="Custom Emoji"
                  />
                </div>
              </div>

              {/* Name & Date of Birth */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                    {type === 'pet' ? 'Pet Name' : 'Full Name'} <span className="text-rose-400">*</span>
                  </label>
                  <input
                    type="text"
                    required
                    placeholder={type === 'pet' ? 'e.g. Milo' : 'e.g. Emma Miller'}
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                  />
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                    {type === 'pet' ? 'Date of Birth / Adoption' : 'Date of Birth'}
                  </label>
                  <input
                    type="date"
                    value={dob}
                    onChange={(e) => setDob(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                  />
                </div>
              </div>

              {type === 'human' ? (
                <>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Family Role / Relation</label>
                      <select
                        value={role}
                        onChange={(e) => setRole(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                      >
                        <option value="Self">Self</option>
                        <option value="Mother">Mother</option>
                        <option value="Father">Father</option>
                        <option value="Daughter">Daughter</option>
                        <option value="Son">Son</option>
                        <option value="Partner">Partner / Spouse</option>
                        <option value="Grandparent">Grandparent</option>
                        <option value="Other">Other Family Member</option>
                      </select>
                    </div>

                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Blood Type</label>
                      <select
                        value={bloodType}
                        onChange={(e) => setBloodType(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                      >
                        <option value="Unknown">Unknown</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                      Medicare / Health Insurance Policy Number
                    </label>
                    <input
                      type="text"
                      placeholder="e.g. Medicare # 2491 82910 1 / Bupa # 889012"
                      value={insurancePolicy}
                      onChange={(e) => setInsurancePolicy(e.target.value)}
                      className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Emergency Contact Name</label>
                      <input
                        type="text"
                        placeholder="e.g. David Miller"
                        value={emergencyContact}
                        onChange={(e) => setEmergencyContact(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                      />
                    </div>
                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Emergency Phone</label>
                      <input
                        type="tel"
                        placeholder="(555) 123-4567"
                        value={emergencyPhone}
                        onChange={(e) => setEmergencyPhone(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                      />
                    </div>
                  </div>
                </>
              ) : (
                <>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Species</label>
                      <select
                        value={species}
                        onChange={(e) => setSpecies(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                      >
                        <option value="Dog">🐶 Dog</option>
                        <option value="Cat">🐱 Cat</option>
                        <option value="Rabbit">🐰 Rabbit</option>
                        <option value="Bird">🦜 Bird</option>
                        <option value="Guinea Pig">🐹 Guinea Pig</option>
                        <option value="Horse">🐴 Horse</option>
                        <option value="Other">🐾 Other</option>
                      </select>
                    </div>
                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Breed</label>
                      <input
                        type="text"
                        placeholder="e.g. Golden Retriever, Ragdoll"
                        value={breed}
                        onChange={(e) => setBreed(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Gender</label>
                      <select
                        value={gender}
                        onChange={(e) => setGender(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                      >
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                      </select>
                    </div>

                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Current Weight</label>
                      <input
                        type="text"
                        placeholder="e.g. 28 kg"
                        value={weight}
                        onChange={(e) => setWeight(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                      />
                    </div>

                    <div className="flex flex-col justify-end pb-1.5 pl-1">
                      <label className="flex items-center space-x-2 cursor-pointer font-bold">
                        <input
                          type="checkbox"
                          checked={isDesexed}
                          onChange={(e) => setIsDesexed(e.target.checked)}
                          className="rounded text-amber-500 focus:ring-0"
                        />
                        <span>Desexed</span>
                      </label>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>15-Digit Microchip #</label>
                      <input
                        type="text"
                        placeholder="98514100..."
                        value={microchip}
                        onChange={(e) => setMicrochip(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-mono ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                      />
                    </div>

                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Pet Insurance Policy</label>
                      <input
                        type="text"
                        placeholder="e.g. PetSure # 99120"
                        value={insurancePolicy}
                        onChange={(e) => setInsurancePolicy(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                      />
                    </div>
                  </div>
                </>
              )}

              {/* Allergies & Medical Warnings */}
              <div>
                <label className={`block font-bold mb-1 text-rose-400`}>
                  Known Allergies & Drug Sensitivities (comma separated)
                </label>
                <input
                  type="text"
                  placeholder={type === 'pet' ? 'e.g. Chicken protein, Flea collars, Bee stings' : 'e.g. Penicillin, Peanuts, Latex, Pollen'}
                  value={allergiesInput}
                  onChange={(e) => setAllergiesInput(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                />
              </div>

              {/* Pre-existing Conditions / Special Care Notes */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                  {type === 'pet' ? 'Chronic Conditions & Dietary / Care Notes' : 'Pre-Existing Conditions & Medical Notes'}
                </label>
                <textarea
                  rows={2}
                  placeholder={type === 'pet' ? 'e.g. Sensitive stomach, grain-free diet, anxious at vet' : 'e.g. Mild asthma (carries Ventolin), wears glasses'}
                  value={conditions}
                  onChange={(e) => setConditions(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                />
              </div>

              <div className="pt-3 border-t border-zinc-800 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-4 py-2 rounded-xl font-bold ${isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-200 text-slate-700'}`}
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-500 shadow-md transition-all active:scale-98"
                >
                  {isEditing ? 'Update Profile' : (type === 'pet' ? 'Save Pet Profile' : 'Save Member')}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
