                            <img src={att.url} alt={att.name} className="w-full h-28 object-cover group-hover:scale-105 transition-transform" />
                            <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                              <span className="text-white"><Icon name="zoomIn" size={20} /></span>
                            </div>
                            <span className="absolute bottom-1 left-1 right-1 bg-black/75 text-white text-[9px] px-1.5 py-0.5 rounded truncate">
                              {att.name}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <div className="pt-3 border-t border-zinc-800 flex items-center justify-between">
                  <button
                    onClick={() => deleteAppointment(selectedApptDetail.id)}
                    className="px-3 py-1.5 rounded-xl text-xs font-bold text-rose-400 hover:bg-rose-500/10 flex items-center space-x-1"
                  >
                    <Icon name="trash2" size={14} />
                    <span>Delete</span>
                  </button>

                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => {
                        setEditingAppt(selectedApptDetail);
                        setSelectedApptDetail(null);
                        setIsApptModalOpen(true);
                      }}
                      className={`px-4 py-2 rounded-xl text-xs font-bold border flex items-center space-x-1.5 ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-zinc-100 hover:bg-zinc-700' : 'bg-slate-100 border-slate-300 text-slate-800 hover:bg-slate-200'
                      }`}
                    >
                      <Icon name="edit" size={13} />
                      <span>Edit Visit</span>
                    </button>

                    <button
                      onClick={() => setSelectedApptDetail(null)}
                      className="px-5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white hover:bg-blue-500"
                    >
                      Done
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Lightbox for Enlarged Attachment Images */}
          {lightboxImage && (
            <div
              onClick={() => setLightboxImage(null)}
              className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4 backdrop-blur-md cursor-pointer"
            >
              <button className="absolute top-5 right-5 text-white/80 hover:text-white p-2">
                <Icon name="x" size={26} />
              </button>
              <img src={lightboxImage} alt="Enlarged attachment" className="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl" />
            </div>
          )}

          {isGroupModalOpen && (
            <FamilyGroupModal
              isDark={isDark}
              theme={theme}
              setTheme={setTheme}
              currentUser={currentUser}
              currentGroup={currentFamilyGroup}
              familyGroups={familyGroups}
              allUsers={users}
              onClose={() => setIsGroupModalOpen(false)}
              onLockNow={() => {
                setIsGroupModalOpen(false);
                setIsAppLocked(true);
              }}
              onSwitchUser={(user) => {
                setCurrentUserId(user.id);
                setIsGroupModalOpen(false);
                setIsAppLocked(true);
              }}
              onSignOut={() => {
                setCurrentUserId(null);
                setIsGroupModalOpen(false);
              }}
              onUpdatePin={(newPin) => {
                setUsers(prev => prev.map(u => u.id === currentUser.id ? { ...u, pin: newPin } : u));
              }}
              onCreateGroup={(groupName, inviteCode) => {
                const newGroupId = 'FAM_' + Date.now();
                const newGroup = { id: newGroupId, name: groupName, inviteCode: inviteCode.toUpperCase(), createdBy: currentUser.id };
                setFamilyGroups(prev => [...prev, newGroup]);
                setUsers(prev => prev.map(u => u.id === currentUser.id ? { ...u, familyGroupId: newGroupId } : u));
              }}
              onUpdateGroupName={(groupId, newName) => {
                setFamilyGroups(prev => prev.map(g => g.id === groupId ? { ...g, name: newName } : g));
              }}
              onJoinGroup={(code) => {
                const matched = familyGroups.find(g => g.inviteCode.toUpperCase() === code.trim().toUpperCase());
                if (!matched) return { success: false, message: 'Invalid Invite Code. Please check with your family.' };
                setUsers(prev => prev.map(u => u.id === currentUser.id ? { ...u, familyGroupId: matched.id } : u));
                return { success: true, groupName: matched.name };
              }}
              onLeaveGroup={() => {
                setUsers(prev => prev.map(u => u.id === currentUser.id ? { ...u, familyGroupId: null } : u));
              }}
            />
          )}

          {isApptModalOpen && (
            <CreateAppointmentModal
              isDark={isDark}
              members={userVisibleMembers}
              clinics={userVisibleClinics}
              currentUser={currentUser}
              initialData={editingAppt}
              onClose={() => {
                setIsApptModalOpen(false);
                setEditingAppt(null);
              }}
              onSave={(savedAppt, autoFollowUp) => {
                if (savedAppt.id && appointments.some(a => a.id === savedAppt.id)) {
                  setAppointments(prev => prev.map(a => a.id === savedAppt.id ? savedAppt : a));
                  if (autoFollowUp) {
                    setAppointments(prev => [autoFollowUp, ...prev]);
                  }
                } else {
                  if (autoFollowUp) {
                    setAppointments(prev => [savedAppt, autoFollowUp, ...prev]);
                  } else {
                    setAppointments(prev => [savedAppt, ...prev]);
                  }
                }
                setIsApptModalOpen(false);
                setEditingAppt(null);
              }}
            />
          )}

          {isClinicModalOpen && (
            <CreateClinicModal
              isDark={isDark}
              currentUser={currentUser}
              initialData={editingClinic}
              onClose={() => {
                setIsClinicModalOpen(false);
                setEditingClinic(null);
              }}
              onSave={(c) => {
                if (c.id && clinics.some(item => item.id === c.id)) {
                  setClinics(prev => prev.map(item => item.id === c.id ? c : item));
                } else {
                  setClinics(prev => [c, ...prev]);
                }
                setIsClinicModalOpen(false);
                setEditingClinic(null);
              }}
            />
          )}

          {isMemberModalOpen && (
            <CreateMemberModal
              isDark={isDark}
              currentUser={currentUser}
              initialData={editingMember}
              onClose={() => {
                setIsMemberModalOpen(false);
                setEditingMember(null);
              }}
              onSave={(m) => {
                if (m.id && members.some(item => item.id === m.id)) {
                  setMembers(prev => prev.map(item => item.id === m.id ? m : item));
                } else {
                  setMembers(prev => [...prev, m]);
                }
                setIsMemberModalOpen(false);
                setEditingMember(null);
              }}
            />
          )}

          {/* Bottom Glass Navigation Bar */}
          <nav className={`fixed bottom-0 left-0 right-0 z-40 backdrop-blur-xl border-t transition-colors no-print ${
            isDark ? 'bg-black/85 border-zinc-800' : 'bg-white/90 border-slate-200'
          }`}>
            <div className="max-w-xl mx-auto px-6 py-2 flex items-center justify-around">
              <button
                onClick={() => setActiveTab('appointments')}
                className={`flex flex-col items-center space-y-1 transition-colors ${
                  activeTab === 'appointments' ? 'text-blue-500 font-bold' : isDark ? 'text-zinc-500 hover:text-zinc-300' : 'text-slate-400'
                }`}
              >
                <Icon name="calendar" size={19} />
                <span className="text-[10px]">Visits</span>
              </button>

              <button
                onClick={() => setActiveTab('clinics')}
                className={`flex flex-col items-center space-y-1 transition-colors ${
                  activeTab === 'clinics' ? 'text-blue-500 font-bold' : isDark ? 'text-zinc-500 hover:text-zinc-300' : 'text-slate-400'
                }`}
              >
                <Icon name="building" size={19} />
                <span className="text-[10px]">Clinics</span>
              </button>

              <button
                onClick={() => setActiveTab('summary')}
                className={`flex flex-col items-center space-y-1 transition-colors ${
                  activeTab === 'summary' ? 'text-blue-500 font-bold' : isDark ? 'text-zinc-500 hover:text-zinc-300' : 'text-slate-400'
                }`}
              >
                <Icon name="fileText" size={19} />
                <span className="text-[10px]">Summary</span>
              </button>

              <button
                onClick={() => setActiveTab('members')}
                className={`flex flex-col items-center space-y-1 transition-colors ${
                  activeTab === 'members' ? 'text-blue-500 font-bold' : isDark ? 'text-zinc-500 hover:text-zinc-300' : 'text-slate-400'
                }`}
              >
                <Icon name="users" size={19} />
                <span className="text-[10px]">Family & Pets</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    // =====================================================
    // AUTHENTICATION SCREEN (SIGN IN & CREATE ACCOUNT)
    // =====================================================
    function AuthScreen({ isDark, users, familyGroups, onLogin, onCreateUser }) {
      const [authMode, setAuthMode] = useState('signin'); // 'signin' | 'signup'
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPin, setLoginPin] = useState('');

      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [avatar, setAvatar] = useState('👩');
      const [pin, setPin] = useState('');
      const [confirmPin, setConfirmPin] = useState('');
      const [inviteCode, setInviteCode] = useState('');
      const [newGroupName, setNewGroupName] = useState('');
      const [groupChoice, setGroupChoice] = useState('solo');
      const [errorMsg, setErrorMsg] = useState('');

      const handleEmailSignIn = (e) => {
        e.preventDefault();
        setErrorMsg('');

        const cleanEmail = loginEmail.trim().toLowerCase();
        if (!cleanEmail || !loginPin) {
          setErrorMsg('Please enter both your email address and 4-digit PIN.');
          return;
        }

        const matchedUser = users.find(u => u.email.toLowerCase() === cleanEmail);
        if (!matchedUser) {
          setErrorMsg('No account found with that email. Please check the email or create a new account.');
          return;
        }

        if (matchedUser.pin !== loginPin) {
          setErrorMsg('Incorrect 4-digit PIN for this account.');
          return;
        }

        onLogin(matchedUser);
      };

      const handleSignUpSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (!name.trim()) {
          setErrorMsg('Please enter your full name.');
          return;
        }

        const cleanEmail = email.trim().toLowerCase();
        if (!cleanEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
          setErrorMsg('A valid email address is mandatory so you can sign back into your account.');
          return;
        }

        if (users.some(u => u.email.toLowerCase() === cleanEmail)) {
          setErrorMsg('An account with this email already exists. Please use the Sign In tab instead.');
          return;
        }

        if (!pin || pin.length !== 4 || !/^\d{4}$/.test(pin)) {
          setErrorMsg('Please set a 4-digit numeric PIN code.');
          return;
        }

        if (pin !== confirmPin) {
          setErrorMsg('PIN codes do not match.');
          return;
        }

        let assignedGroupId = null;
        let createdGroup = null;

        if (groupChoice === 'join') {
          const trimmedCode = inviteCode.trim().toUpperCase();
          const matched = familyGroups.find(g => g.inviteCode.toUpperCase() === trimmedCode);
          if (!matched) {
            setErrorMsg('Invalid Invite Code. Please check with your family or choose Solo mode.');
            return;
          }
          assignedGroupId = matched.id;
        } else if (groupChoice === 'create') {
          if (!newGroupName.trim()) {
            setErrorMsg('Please give your family group a name.');
            return;
          }
          const newGId = 'FAM_' + Date.now();
          const code = (name.slice(0, 3) + Math.floor(1000 + Math.random() * 9000)).toUpperCase();
          createdGroup = { id: newGId, name: newGroupName.trim(), inviteCode: code, createdBy: 'u_' + Date.now() };
          assignedGroupId = newGId;
        }

        const newUser = {
          id: createdGroup ? createdGroup.createdBy : 'u_' + Date.now(),
          name: name.trim(),
          email: cleanEmail,
          avatar,
          pin,
          familyGroupId: assignedGroupId
        };

        onCreateUser(newUser, createdGroup);
      };

      return (
        <div className={`min-h-screen flex items-center justify-center p-4 ${isDark ? 'bg-black text-zinc-100' : 'bg-slate-100 text-slate-900'}`}>
          <div className={`w-full max-w-md p-6 rounded-3xl border shadow-2xl ${isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-slate-200'}`}>
            <div className="text-center mb-5">
              <div className="w-14 h-14 mx-auto mb-3 rounded-2xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-3xl">🩺</div>
              <h1 className="text-xl font-black tracking-tight">CareTracker</h1>
              <p className={`text-xs mt-1 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                Private Family & Pet Health Diary
              </p>
            </div>

            {/* Mode Switcher: Sign In vs Create Account */}
            <div className={`p-1 rounded-2xl border grid grid-cols-2 mb-5 ${isDark ? 'bg-zinc-950 border-zinc-800' : 'bg-slate-100 border-slate-200'}`}>
              <button
                type="button"
                onClick={() => { setAuthMode('signin'); setErrorMsg(''); }}
                className={`py-2 rounded-xl text-xs font-bold transition-all ${
                  authMode === 'signin'
                    ? 'bg-blue-600 text-white shadow-sm'
                    : isDark ? 'text-zinc-400 hover:text-zinc-200' : 'text-slate-600'
                }`}
              >
                Sign In
              </button>
              <button
                type="button"
                onClick={() => { setAuthMode('signup'); setErrorMsg(''); }}
                className={`py-2 rounded-xl text-xs font-bold transition-all ${
                  authMode === 'signup'
                    ? 'bg-blue-600 text-white shadow-sm'
                    : isDark ? 'text-zinc-400 hover:text-zinc-200' : 'text-slate-600'
                }`}
              >
                Create Account
              </button>
            </div>

            {errorMsg && (
              <div className="mb-4 p-2.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
                <Icon name="alertCircle" size={14} className="shrink-0" />
                <span>{errorMsg}</span>
              </div>
            )}

            {authMode === 'signin' ? (
              <form onSubmit={handleEmailSignIn} className="space-y-4 text-xs">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                    Registered Email Address <span className="text-rose-400">*</span>
                  </label>
                  <input
                    type="email"
                    required
                    placeholder="you@example.com"
                    value={loginEmail}
                    onChange={(e) => setLoginEmail(e.target.value)}
                    className={`w-full p-3 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200 focus:border-blue-500' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  />
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                    4-Digit Security PIN <span className="text-rose-400">*</span>
                  </label>
                  <input
                    type="password"
                    maxLength={4}
                    required
                    placeholder="••••"
                    value={loginPin}
                    onChange={(e) => setLoginPin(e.target.value.replace(/\D/g, ''))}
                    className={`w-full p-3 rounded-xl border text-center font-mono text-lg tracking-widest outline-none font-bold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100 focus:border-blue-500' : 'bg-white border-slate-200 text-slate-900'
                    }`}
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-md transition-all active:scale-98"
                >
                  Sign In to Account
                </button>

                {users.length > 0 && (
                  <div className="pt-3 border-t border-zinc-800/80">
                    <span className={`block text-[10px] font-bold uppercase tracking-wider mb-2 ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                      Saved Accounts on this Device:
                    </span>
                    <div className="space-y-1.5">
                      {users.map(u => (
                        <button
                          key={u.id}
                          type="button"
                          onClick={() => setLoginEmail(u.email)}
                          className={`w-full p-2.5 rounded-xl border flex items-center justify-between text-left transition-all ${
                            isDark ? 'bg-zinc-950 border-zinc-800 hover:border-blue-500' : 'bg-slate-50 border-slate-200 hover:border-blue-500'
                          }`}
                        >
                          <div className="flex items-center space-x-2.5">
                            <span className="text-lg">{u.avatar}</span>
                            <div>
                              <span className="font-bold text-xs block">{u.name}</span>
                              <span className={`text-[10px] ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>{u.email}</span>
                            </div>
                          </div>
                          <span className="text-[10px] text-blue-400 font-bold">Select</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </form>
            ) : (
              <form onSubmit={handleSignUpSubmit} className="space-y-3.5 text-xs">
                <div className="grid grid-cols-4 gap-2">
                  <div className="col-span-3">
                    <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                      Full Name <span className="text-rose-400">*</span>
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Sarah Miller"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                    />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Avatar</label>
                    <input
                      type="text"
                      value={avatar}
                      onChange={(e) => setAvatar(e.target.value)}
                      className={`w-full p-2.5 rounded-xl border text-center text-lg outline-none ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                    />
                  </div>
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                    Email Address (Mandatory) <span className="text-rose-400">*</span>
                  </label>
                  <input
                    type="email"
                    required
                    placeholder="you@example.com"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200'}`}
                  />
                </div>

                <div className="grid grid-cols-2 gap-2 p-3 rounded-2xl border border-blue-500/30 bg-blue-500/5">
                  <div>
                    <label className="block font-bold mb-1 text-blue-400">4-Digit PIN <span className="text-rose-400">*</span></label>
                    <input
                      type="password"
                      maxLength={4}
                      required
                      placeholder="••••"
                      value={pin}
                      onChange={(e) => setPin(e.target.value.replace(/\D/g, ''))}
                      className={`w-full p-2 rounded-xl border text-center font-mono text-base tracking-widest outline-none font-bold ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200'}`}
                    />
                  </div>
                  <div>
                    <label className="block font-bold mb-1 text-blue-400">Confirm PIN <span className="text-rose-400">*</span></label>
                    <input
                      type="password"
                      maxLength={4}
                      required
                      placeholder="••••"
                      value={confirmPin}
                      onChange={(e) => setConfirmPin(e.target.value.replace(/\D/g, ''))}
                      className={`w-full p-2 rounded-xl border text-center font-mono text-base tracking-widest outline-none font-bold ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200'}`}
                    />
                  </div>
                </div>

                <div>
                  <label className={`block font-bold mb-1.5 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Sharing Setup</label>
                  <div className="grid grid-cols-3 gap-2">
                    <button
                      type="button"
                      onClick={() => setGroupChoice('solo')}
                      className={`p-2 rounded-xl border font-bold text-center ${groupChoice === 'solo' ? 'bg-blue-600 text-white border-blue-600' : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-50 border-slate-200'}`}
                    >
                      Solo
                    </button>
                    <button
                      type="button"
                      onClick={() => setGroupChoice('join')}
                      className={`p-2 rounded-xl border font-bold text-center ${groupChoice === 'join' ? 'bg-blue-600 text-white border-blue-600' : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-50 border-slate-200'}`}
                    >
                      Join Group
                    </button>
                    <button
                      type="button"
                      onClick={() => setGroupChoice('create')}
                      className={`p-2 rounded-xl border font-bold text-center ${groupChoice === 'create' ? 'bg-blue-600 text-white border-blue-600' : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-50 border-slate-200'}`}
                    >
                      New Group
                    </button>
                  </div>
                </div>

                {groupChoice === 'join' && (
                  <input
                    type="text"
                    placeholder="Enter Family Invite Code"
                    value={inviteCode}
                    onChange={(e) => setInviteCode(e.target.value.toUpperCase())}
                    className={`w-full p-2.5 rounded-xl border outline-none font-mono uppercase tracking-widest font-bold ${isDark ? 'bg-zinc-950 border-zinc-800 text-white' : 'bg-white border-slate-200'}`}
                  />
                )}

                {groupChoice === 'create' && (
                  <input
                    type="text"
                    placeholder="Family Group Name"
                    value={newGroupName}
                    onChange={(e) => setNewGroupName(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-bold ${isDark ? 'bg-zinc-950 border-zinc-800 text-white' : 'bg-white border-slate-200'}`}
                  />
                )}

                <button type="submit" className="w-full py-3 rounded-2xl font-bold bg-blue-600 text-white hover:bg-blue-500 shadow-md">
                  Create Account & Open App
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    // =====================================================
    // 4-DIGIT PIN LOCK SCREEN
    // =====================================================
    function PinLockScreen({ isDark, currentUser, onUnlock, onSwitchAccount }) {
      const [enteredPin, setEnteredPin] = useState('');
      const [errorShake, setErrorShake] = useState(false);
      const correctPin = currentUser.pin || '1234';

      const handleDigit = (digit) => {
        if (enteredPin.length < 4) {
          const next = enteredPin + digit;
          setEnteredPin(next);

          if (next.length === 4) {
            if (next === correctPin) {
              setTimeout(() => onUnlock(), 150);
            } else {
              setErrorShake(true);
              setTimeout(() => {
                setEnteredPin('');
                setErrorShake(false);
              }, 600);
            }
          }
        }
      };

      const handleDelete = () => setEnteredPin(prev => prev.slice(0, -1));

      return (
        <div className={`min-h-screen flex flex-col items-center justify-between py-12 px-6 select-none ${
          isDark ? 'bg-black text-zinc-100' : 'bg-slate-100 text-slate-900'
        }`}>
          <div className="flex flex-col items-center text-center mt-6">
            <div className="w-16 h-16 rounded-3xl bg-blue-500/10 text-blue-500 flex items-center justify-center mb-3">
              <Icon name="lock" size={30} />
            </div>
            <div className="flex items-center space-x-2">
              <span className="text-xl">{currentUser.avatar}</span>
              <h2 className="text-lg font-black tracking-tight">{currentUser.name}</h2>
            </div>
            <p className={`text-xs mt-1 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
              Enter 4-digit Passcode to unlock
            </p>

            <div className={`flex items-center space-x-5 mt-6 ${errorShake ? 'animate-bounce' : ''}`}>
              {[0, 1, 2, 3].map(idx => (
                <div
                  key={idx}
                  className={`w-3.5 h-3.5 rounded-full transition-all duration-150 ${
                    enteredPin.length > idx
                      ? errorShake ? 'bg-rose-500 scale-125' : 'bg-blue-500 scale-110'
                      : isDark ? 'border-2 border-zinc-700 bg-zinc-900' : 'border-2 border-slate-300 bg-white'
                  }`}
                />
              ))}
            </div>

            {errorShake && <p className="text-xs text-rose-500 font-bold mt-3">Incorrect Passcode. Try again.</p>}
          </div>

          <div className="w-full max-w-[270px] my-auto">
            <div className="grid grid-cols-3 gap-4 text-center">
              {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                <button
                  key={num}
                  type="button"
                  onClick={() => handleDigit(String(num))}
                  className={`aspect-square rounded-full font-semibold text-2xl flex items-center justify-center border transition-all active:scale-90 active:bg-blue-600 active:text-white ${
                    isDark ? 'bg-zinc-900/90 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-800 shadow-xs'
                  }`}
                >
                  {num}
                </button>
              ))}

              <button
                type="button"
                onClick={onSwitchAccount}
                className={`aspect-square rounded-full text-[11px] font-bold flex items-center justify-center ${
                  isDark ? 'text-zinc-400 hover:text-white' : 'text-slate-500'
                }`}
              >
                Switch User
              </button>

              <button
                type="button"
                onClick={() => handleDigit('0')}
                className={`aspect-square rounded-full font-semibold text-2xl flex items-center justify-center border transition-all active:scale-90 active:bg-blue-600 active:text-white ${
                  isDark ? 'bg-zinc-900/90 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-800 shadow-xs'
                }`}
              >
                0
              </button>

              <button
                type="button"
                onClick={handleDelete}
                className={`aspect-square rounded-full flex items-center justify-center ${
                  isDark ? 'text-zinc-400 hover:text-white' : 'text-slate-600'
                }`}
              >
                <Icon name="delete" size={22} />
              </button>
            </div>
          </div>

          <div className="pb-4" />
        </div>
      );
    }

    // =====================================================
    // USER SETTINGS, LOCK, THEME, FAMILY GROUP & PIN HUB
    // =====================================================
    function FamilyGroupModal({
      isDark,
      theme,
      setTheme,
      currentUser,
      currentGroup,
      familyGroups,
      allUsers,
      onClose,
      onLockNow,
      onSwitchUser,
      onSignOut,
      onUpdatePin,
      onCreateGroup,
      onUpdateGroupName,
      onJoinGroup,
      onLeaveGroup
    }) {
      const [activeSubTab, setActiveSubTab] = useState('group');
      const [inputCode, setInputCode] = useState('');
      const [newGroupName, setNewGroupName] = useState('');
      const [statusMessage, setStatusMessage] = useState(null);
      const [copiedCode, setCopiedCode] = useState(false);

      // Edit Active Group Name state
      const [isEditingGroupName, setIsEditingGroupName] = useState(false);
      const [editedGroupName, setEditedGroupName] = useState('');

      // Security PIN state
      const [currentPinInput, setCurrentPinInput] = useState('');
      const [newPinInput, setNewPinInput] = useState('');
      const [confirmNewPinInput, setConfirmNewPinInput] = useState('');

      const groupMembers = useMemo(() => {
        if (!currentGroup) return [];
        return allUsers.filter(u => u.familyGroupId === currentGroup.id);
      }, [allUsers, currentGroup]);

      const handlePinChangeSubmit = (e) => {
        e.preventDefault();
        setStatusMessage(null);

        const actualPin = currentUser.pin || '1234';
        if (currentPinInput !== actualPin) {
          setStatusMessage({ type: 'error', text: 'Current PIN is incorrect.' });
          return;
        }
        if (!newPinInput || newPinInput.length !== 4 || !/^\d{4}$/.test(newPinInput)) {
          setStatusMessage({ type: 'error', text: 'New PIN must be exactly 4 digits.' });
          return;
        }
        if (newPinInput !== confirmNewPinInput) {
          setStatusMessage({ type: 'error', text: 'New PINs do not match.' });
          return;
        }

        onUpdatePin(newPinInput);
        setStatusMessage({ type: 'success', text: 'Security PIN successfully updated!' });
        setCurrentPinInput('');
        setNewPinInput('');
        setConfirmNewPinInput('');
      };

      const handleJoin = (e) => {
        e.preventDefault();
        if (!inputCode.trim()) return;
        const res = onJoinGroup(inputCode);
        if (!res.success) {
          setStatusMessage({ type: 'error', text: res.message });
        } else {
          setStatusMessage({ type: 'success', text: `Successfully joined ${res.groupName}!` });
          setInputCode('');
        }
      };

      const handleCreate = (e) => {
        e.preventDefault();
        if (!newGroupName.trim()) return;
        const code = (currentUser.name.slice(0, 3) + Math.floor(1000 + Math.random() * 9000)).toUpperCase();
        onCreateGroup(newGroupName, code);
        setStatusMessage({ type: 'success', text: `Created ${newGroupName} with invite code: ${code}` });
        setNewGroupName('');
      };

      const handleSaveEditedGroupName = () => {
        if (!editedGroupName.trim() || !currentGroup) return;
        onUpdateGroupName(currentGroup.id, editedGroupName.trim());
        setIsEditingGroupName(false);
        setStatusMessage({ type: 'success', text: 'Family group name updated!' });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm">
          <div className={`w-full max-w-md max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 border shadow-2xl ${
            isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
          }`}>
            {/* Header */}
            <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
              <div className="flex items-center space-x-2.5">
                <span className="text-2xl">{currentUser.avatar}</span>
                <div>
                  <h2 className="font-bold text-base">{currentUser.name}</h2>
                  <p className={`text-[11px] ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>{currentUser.email}</p>
                </div>
              </div>
              <button onClick={onClose} className={`p-1.5 rounded-full ${isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-100 text-slate-500'}`}>
                <Icon name="x" size={17} />
              </button>
            </div>

            {/* Quick App Controls: Lock App & Light/Dark Theme */}
            <div className="grid grid-cols-2 gap-2 my-3">
              <button
                type="button"
                onClick={onLockNow}
                className={`p-2.5 rounded-2xl border flex items-center justify-center space-x-2 text-xs font-bold transition-all active:scale-98 ${
                  isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200 hover:border-blue-500' : 'bg-slate-50 border-slate-200 text-slate-800 hover:border-blue-500'
                }`}
              >
                <Icon name="lock" size={15} className="text-blue-400" />
                <span>Lock App</span>
              </button>

              <button
                type="button"
                onClick={() => setTheme(isDark ? 'light' : 'dark')}
                className={`p-2.5 rounded-2xl border flex items-center justify-center space-x-2 text-xs font-bold transition-all active:scale-98 ${
                  isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200 hover:border-amber-500' : 'bg-slate-50 border-slate-200 text-slate-800 hover:border-amber-500'
                }`}
              >
                <Icon name={isDark ? 'sun' : 'moon'} size={15} className={isDark ? 'text-yellow-400' : 'text-slate-700'} />
                <span>{isDark ? 'Light Mode' : 'Dark Mode'}</span>
              </button>
            </div>

            {/* Segmented Sub-tabs */}
            <div className="flex items-center space-x-1.5 my-3">
              <button
                onClick={() => { setActiveSubTab('group'); setStatusMessage(null); }}
                className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all ${
                  activeSubTab === 'group'
                    ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                    : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-100 border-slate-200 text-slate-700'
                }`}
              >
                Family Group
              </button>
              <button
                onClick={() => { setActiveSubTab('security'); setStatusMessage(null); }}
                className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1 ${
                  activeSubTab === 'security'
                    ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                    : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-100 border-slate-200 text-slate-700'
                }`}
              >
                <Icon name="lock" size={12} />
                <span>PIN Code</span>
              </button>
              <button
                onClick={() => { setActiveSubTab('switch'); setStatusMessage(null); }}
                className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all ${
                  activeSubTab === 'switch'
                    ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                    : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-100 border-slate-200 text-slate-700'
                }`}
              >
                Switch User
              </button>
            </div>

            {statusMessage && (
              <div className={`p-2.5 rounded-xl text-xs mb-3 flex items-center space-x-1.5 ${
                statusMessage.type === 'error' ? 'bg-rose-500/15 text-rose-400 border border-rose-500/30' : 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30'
              }`}>
                <Icon name="alertCircle" size={13} className="shrink-0" />
                <span>{statusMessage.text}</span>
              </div>
            )}

            {/* TAB A: FAMILY GROUP */}
            {activeSubTab === 'group' && (
              <div className="space-y-4 text-xs">
                {currentGroup ? (
                  <div className={`p-4 rounded-2xl border ${isDark ? 'bg-zinc-950/70 border-zinc-800' : 'bg-slate-50 border-slate-200'}`}>
                    <div className="flex items-start justify-between">
                      <div className="flex-1 pr-2">
                        <span className="text-[10px] uppercase font-bold text-emerald-400 tracking-wider">Active Group</span>
                        {!isEditingGroupName ? (
                          <div className="flex items-center space-x-2 mt-0.5">
                            <h3 className="font-bold text-sm tracking-tight">{currentGroup.name}</h3>
                            <button
                              type="button"
                              onClick={() => {
                                setEditedGroupName(currentGroup.name);
                                setIsEditingGroupName(true);
                                setStatusMessage(null);
                              }}
                              className={`p-1 rounded-lg transition-colors ${isDark ? 'text-zinc-400 hover:text-blue-400 hover:bg-zinc-800' : 'text-slate-400 hover:text-blue-600 hover:bg-slate-200'}`}
                              title="Edit Family Name"
                            >
                              <Icon name="edit" size={13} />
                            </button>
                          </div>
                        ) : (
                          <div className="flex items-center space-x-1.5 mt-1">
                            <input
                              type="text"
                              value={editedGroupName}
                              onChange={(e) => setEditedGroupName(e.target.value)}
                              className={`flex-1 px-2.5 py-1 rounded-lg border text-xs font-bold outline-none ${
                                isDark ? 'bg-zinc-900 border-blue-500 text-white' : 'bg-white border-blue-500 text-slate-900'
                              }`}
                              autoFocus
                            />
                            <button
                              type="button"
                              onClick={handleSaveEditedGroupName}
                              className="px-2.5 py-1 rounded-lg bg-blue-600 text-white font-bold text-[11px] hover:bg-blue-500"
                            >
                              Save
                            </button>
                            <button
                              type="button"
                              onClick={() => setIsEditingGroupName(false)}
                              className={`px-2 py-1 rounded-lg font-bold text-[11px] ${isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-200 text-slate-600'}`}
                            >
                              Cancel
                            </button>
                          </div>
                        )}
                      </div>
                      <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 font-bold shrink-0">
                        Connected
                      </span>
                    </div>

                    <div className={`mt-3 p-3 rounded-xl border flex items-center justify-between ${
                      isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-slate-200'
                    }`}>
                      <div>
                        <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                          Shareable Invite Code
                        </span>
                        <span className="font-mono text-base font-black tracking-widest text-blue-400">
                          {currentGroup.inviteCode}
                        </span>
                      </div>
                      <button
                        onClick={() => {
                          copyTextToClipboard(currentGroup.inviteCode);
                          setCopiedCode(true);
                          setTimeout(() => setCopiedCode(false), 2000);
                        }}
                        className={`px-3 py-1.5 rounded-xl font-bold flex items-center space-x-1 text-xs border ${
                          copiedCode
                            ? 'bg-emerald-600 text-white border-emerald-600'
                            : isDark ? 'bg-zinc-800 border-zinc-700 text-zinc-200' : 'bg-slate-100 border-slate-200 text-slate-700'
                        }`}
                      >
                        <Icon name={copiedCode ? 'check' : 'copy'} size={13} />
                        <span>{copiedCode ? 'Copied' : 'Copy'}</span>
                      </button>
                    </div>

                    <div className="mt-3">
                      <span className={`block text-[10px] font-bold uppercase tracking-wider mb-1.5 ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                        Active Members in this Group ({groupMembers.length})
                      </span>
                      <div className="space-y-1.5">
                        {groupMembers.map(u => (
                          <div key={u.id} className="flex items-center justify-between py-1">
                            <div className="flex items-center space-x-2">
                              <span>{u.avatar}</span>
                              <span className="font-semibold">{u.name}</span>
                              {u.id === currentUser.id && <span className="text-[10px] text-blue-400 font-bold">(You)</span>}
                            </div>
                            <span className={`text-[10px] ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>{u.email}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="mt-4 pt-3 border-t border-zinc-800 flex justify-end">
                      <button
                        type="button"
                        onClick={() => onLeaveGroup()}
                        className="text-xs font-bold text-rose-400 hover:underline"
                      >
                        Leave Family Group
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className={`p-3 rounded-2xl border ${isDark ? 'bg-zinc-950/70 border-zinc-800' : 'bg-slate-50 border-slate-200'}`}>
                      <h3 className="font-bold text-xs mb-1">You are in Private Solo Mode</h3>
                      <p className={`text-[11px] leading-relaxed ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                        You only see records you personally entered. To sync and share with your partner or family, join their group with an invite code or create a new group below.
                      </p>
                    </div>

                    <form onSubmit={handleJoin} className={`p-3 rounded-2xl border space-y-2 ${isDark ? 'bg-zinc-950/70 border-zinc-800' : 'bg-slate-50 border-slate-200'}`}>
                      <label className="block font-bold text-xs text-blue-400">Join with Family Invite Code</label>
                      <div className="flex items-center space-x-2">
                        <input
                          type="text"
                          placeholder="Enter Invite Code"
                          value={inputCode}
                          onChange={(e) => setInputCode(e.target.value.toUpperCase())}
                          className={`flex-1 p-2 rounded-xl border outline-none font-mono uppercase font-bold text-xs ${
                            isDark ? 'bg-zinc-900 border-zinc-700 text-white' : 'bg-white border-slate-200 text-slate-800'
                          }`}
                        />
                        <button type="submit" className="px-4 py-2 rounded-xl font-bold bg-blue-600 text-white text-xs hover:bg-blue-500">
                          Join
                        </button>
                      </div>
                    </form>

                    <form onSubmit={handleCreate} className={`p-3 rounded-2xl border space-y-2 ${isDark ? 'bg-zinc-950/70 border-zinc-800' : 'bg-slate-50 border-slate-200'}`}>
                      <label className="block font-bold text-xs text-emerald-400">Create a New Family Group</label>
                      <div className="flex items-center space-x-2">
                        <input
                          type="text"
                          placeholder="e.g. The Smith Family"
                          value={newGroupName}
                          onChange={(e) => setNewGroupName(e.target.value)}
                          className={`flex-1 p-2 rounded-xl border outline-none font-bold text-xs ${
                            isDark ? 'bg-zinc-900 border-zinc-700 text-white' : 'bg-white border-slate-200 text-slate-800'
                          }`}
                        />
                        <button type="submit" className="px-4 py-2 rounded-xl font-bold bg-emerald-600 text-white text-xs hover:bg-emerald-500">
                          Create
                        </button>
                      </div>
                    </form>
                  </div>
                )}
              </div>
            )}

            {/* TAB B: SECURITY & PIN CODE */}
            {activeSubTab === 'security' && (
              <form onSubmit={handlePinChangeSubmit} className="space-y-3.5 text-xs">
                <div className={`p-3 rounded-2xl border ${isDark ? 'bg-zinc-950/60 border-zinc-800 text-zinc-300' : 'bg-blue-50/70 border-blue-200 text-blue-900'}`}>
                  <div className="flex items-center space-x-2 mb-1">
                    <Icon name="lock" size={14} className="text-blue-500" />
                    <span className="font-bold">4-Digit Security Passcode</span>
                  </div>
                  <p className={`text-[11px] leading-relaxed ${isDark ? 'text-zinc-400' : 'text-slate-600'}`}>
                    Change the 4-digit PIN used to unlock your diary on your iPhone.
                  </p>
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Current 4-Digit PIN</label>
                  <input
                    type="password"
                    maxLength={4}
                    placeholder="••••"
                    value={currentPinInput}
                    onChange={(e) => setCurrentPinInput(e.target.value.replace(/\D/g, ''))}
                    className={`w-full p-2.5 rounded-xl border font-mono text-center tracking-widest text-base font-bold outline-none ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
                    }`}
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>New PIN</label>
                    <input
                      type="password"
                      maxLength={4}
                      placeholder="••••"
                      value={newPinInput}
                      onChange={(e) => setNewPinInput(e.target.value.replace(/\D/g, ''))}
                      className={`w-full p-2.5 rounded-xl border font-mono text-center tracking-widest text-base font-bold outline-none ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
                      }`}
                    />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Confirm New PIN</label>
                    <input
                      type="password"
                      maxLength={4}
                      placeholder="••••"
                      value={confirmNewPinInput}
                      onChange={(e) => setConfirmNewPinInput(e.target.value.replace(/\D/g, ''))}
                      className={`w-full p-2.5 rounded-xl border font-mono text-center tracking-widest text-base font-bold outline-none ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
                      }`}
                    />
                  </div>
                </div>

                <div className="pt-2 flex justify-end">
                  <button type="submit" className="px-5 py-2 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-500 shadow-md">
                    Update Passcode
                  </button>
                </div>
              </form>
            )}

            {/* TAB C: SWITCH USER (NO PINS EXPOSED) */}
            {activeSubTab === 'switch' && (
              <div className="space-y-2 text-xs">
                <span className={`block text-[10px] font-bold uppercase tracking-wider mb-1 ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                  Registered Users on this Device:
                </span>
                {allUsers.map(u => {
                  const grp = familyGroups.find(g => g.id === u.familyGroupId);
                  const isSelected = u.id === currentUser.id;
                  return (
                    <button
                      key={u.id}
                      onClick={() => onSwitchUser(u)}
                      className={`w-full p-2.5 rounded-xl border flex items-center justify-between text-left transition-all ${
                        isSelected
                          ? 'bg-blue-600 text-white border-blue-600'
                          : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-300 hover:border-zinc-700' : 'bg-slate-50 border-slate-200 text-slate-700'
                      }`}
                    >
                      <div className="flex items-center space-x-2.5">
                        <span className="text-xl">{u.avatar}</span>
                        <div>
                          <span className="font-bold block">{u.name}</span>
                          <span className={`text-[10px] ${isSelected ? 'text-blue-100' : isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                            {grp ? grp.name : 'Solo (Private)'}
                          </span>
                        </div>
                      </div>
                      {isSelected && <Icon name="check" size={16} />}
                    </button>
                  );
                })}
              </div>
            )}

            {/* Footer */}
            <div className="mt-5 pt-3 border-t border-zinc-800 flex items-center justify-between">
              <button
                onClick={onSignOut}
                className="px-3 py-1.5 rounded-xl font-bold text-xs text-rose-400 hover:bg-rose-500/10 flex items-center space-x-1"
              >
                <Icon name="logOut" size={13} />
                <span>Sign Out</span>
              </button>

              <button
                onClick={onClose}
                className="px-5 py-2 rounded-xl font-bold bg-blue-600 text-white text-xs hover:bg-blue-500"
              >
                Done
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // CREATE / EDIT APPOINTMENT MODAL
    // ==========================================
    function CreateAppointmentModal({ isDark, members, clinics, currentUser, initialData, onClose, onSave }) {
      const isEditing = Boolean(initialData && initialData.id);

      const [memberId, setMemberId] = useState(initialData?.memberId || members[0]?.id || '');
      const [providerType, setProviderType] = useState(initialData?.providerType || 'GP');
      const [selectedClinicId, setSelectedClinicId] = useState('');
      const [providerName, setProviderName] = useState(initialData?.providerName || '');
      const [clinicName, setClinicName] = useState(initialData?.clinicName || '');
      const [clinicPhone, setClinicPhone] = useState(initialData?.clinicPhone || '');
      
      // Split Date and Time state
      const [selectedDate, setSelectedDate] = useState(() => {
        if (initialData?.dateTime && initialData.dateTime.includes('T')) {
          return initialData.dateTime.split('T')[0];
        }
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      });

      const [selectedTime, setSelectedTime] = useState(() => {
        if (initialData?.dateTime && initialData.dateTime.includes('T')) {
          return initialData.dateTime.split('T')[1].slice(0, 5);
        }
        const now = new Date();
        const roundedMins = Math.round(now.getMinutes() / 15) * 15;
        now.setMinutes(roundedMins);
        const hours = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        return `${hours}:${mins}`;
      });

      // Popup picker visibility toggles
      const [showDatePicker, setShowDatePicker] = useState(false);
      const [showTimePicker, setShowTimePicker] = useState(false);

      // Calendar navigation month/year state
      const [calNavDate, setCalNavDate] = useState(() => {
        if (initialData?.dateTime && initialData.dateTime.includes('T')) {
          const [y, m, d] = initialData.dateTime.split('T')[0].split('-').map(Number);
          return new Date(y, m - 1, d);
        }
        return new Date();
      });

      const [status, setStatus] = useState(initialData?.status || 'Completed');
      const [reason, setReason] = useState(initialData?.reason || '');
      const [doctorAdvice, setDoctorAdvice] = useState(initialData?.doctorAdvice || '');
      const [prescriptions, setPrescriptions] = useState(initialData?.prescriptions || '');
      const [followUpNeeded, setFollowUpNeeded] = useState(Boolean(initialData?.followUpNeeded));
      const [followUpDate, setFollowUpDate] = useState(initialData?.followUpDate || '');
      const [attachments, setAttachments] = useState(initialData?.attachments || []);

      const activeMember = members.find(m => m.id === memberId);
      useEffect(() => {
        if (!initialData && activeMember?.type === 'pet') {
          setProviderType('Vet');
        }
      }, [memberId]);

      const handleClinicSelect = (cId) => {
        setSelectedClinicId(cId);
        if (!cId) return;
        const c = clinics.find(item => item.id === cId);
        if (c) {
          setClinicName(c.name);
          setClinicPhone(c.phone || '');
          setProviderType(c.category);
          if (c.doctors && c.doctors.length > 0) {
            setProviderName(c.doctors[0]);
          }
        }
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => {
          const reader = new FileReader();
          reader.onloadend = () => {
            setAttachments(prev => [
              ...prev,
              {
                name: file.name,
                url: reader.result,
                type: file.type.includes('image') ? 'Screenshot' : 'Document'
              }
            ]);
          };
          reader.readAsDataURL(file);
        });
      };

      const formattedDisplayDate = useMemo(() => {
        if (!selectedDate) return 'Select Date';
        const [y, m, d] = selectedDate.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        return dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      }, [selectedDate]);

      const formattedDisplayTime = useMemo(() => {
        if (!selectedTime) return 'Select Time';
        const [h, m] = selectedTime.split(':').map(Number);
        const period = h >= 12 ? 'PM' : 'AM';
        const displayHour = h % 12 || 12;
        return `${displayHour}:${String(m).padStart(2, '0')} ${period}`;
      }, [selectedTime]);

      const daysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
      const firstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();

      const handlePrevMonth = () => {
        setCalNavDate(prev => new Date(prev.getFullYear(), prev.getMonth() - 1, 1));
      };

      const handleNextMonth = () => {
        setCalNavDate(prev => new Date(prev.getFullYear(), prev.getMonth() + 1, 1));
      };

      const selectCalDay = (day) => {
        const y = calNavDate.getFullYear();
        const m = String(calNavDate.getMonth() + 1).padStart(2, '0');
        const d = String(day).padStart(2, '0');
        setSelectedDate(`${y}-${m}-${d}`);
        setShowDatePicker(false);
      };

      const handleQuickDate = (offsetDays) => {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        setSelectedDate(`${y}-${m}-${day}`);
        setCalNavDate(d);
        setShowDatePicker(false);
      };

      const handleFollowUpPreset = (type, value) => {
        let baseDate = new Date();
        if (selectedDate) {
          const [y, m, d] = selectedDate.split('-').map(Number);
          baseDate = new Date(y, m - 1, d);
        }
        if (type === 'days') baseDate.setDate(baseDate.getDate() + value);
        else if (type === 'months') baseDate.setMonth(baseDate.getMonth() + value);
        else if (type === 'years') baseDate.setFullYear(baseDate.getFullYear() + value);

        const y = baseDate.getFullYear();
        const m = String(baseDate.getMonth() + 1).padStart(2, '0');
        const d = String(baseDate.getDate()).padStart(2, '0');
        setFollowUpDate(`${y}-${m}-${d}`);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!reason.trim()) return;

        const combinedDateTime = `${selectedDate}T${selectedTime || '09:00'}`;

        const savedAppt = {
          id: isEditing ? initialData.id : 'a_' + Date.now(),
          memberId,
          memberName: activeMember?.name || initialData?.memberName || 'Unknown',
          providerType,
          providerName: providerName.trim() || 'Attending Physician / Vet',
          clinicName,
          clinicPhone,
          dateTime: combinedDateTime,
          status,
          reason,
          doctorAdvice,
          prescriptions,
          followUpNeeded,
          followUpDate: followUpNeeded ? followUpDate : '',
          attachments,
          vitals: initialData?.vitals || {},
          createdBy: initialData?.createdBy || currentUser.id,
          familyGroupId: initialData?.familyGroupId !== undefined ? initialData.familyGroupId : (currentUser.familyGroupId || null)
        };

        let autoFollowUp = null;
        const shouldCreateFollowUp = followUpNeeded && followUpDate && (!isEditing || initialData.followUpDate !== followUpDate);
        if (shouldCreateFollowUp) {
          autoFollowUp = {
            id: 'a_' + (Date.now() + 1),
            memberId,
            memberName: activeMember?.name || 'Unknown',
            providerType,
            providerName: providerName.trim() || 'Attending Physician / Vet',
            clinicName,
            clinicPhone,
            dateTime: `${followUpDate}T09:00`,
            status: 'Upcoming',
            reason: `Follow-up / Review: ${reason}`,
            doctorAdvice: doctorAdvice ? `Previous visit instructions: ${doctorAdvice}` : 'Scheduled follow-up review consultation.',
            prescriptions: prescriptions ? `Ongoing medications to review: ${prescriptions}` : '',
            followUpNeeded: false,
            followUpDate: '',
            attachments: [],
            vitals: {},
            createdBy: currentUser.id,
            familyGroupId: currentUser.familyGroupId || null
          };
        }

        onSave(savedAppt, autoFollowUp);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm">
          <div className={`w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 border shadow-2xl ${
            isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
          }`}>
            <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
              <h2 className="font-bold text-base">{isEditing ? 'Edit Visit Log' : 'Log Doctor or Vet Visit'}</h2>
              <button onClick={onClose} className={`p-1.5 rounded-full ${isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-100 text-slate-500'}`}>
                <Icon name="x" size={17} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 pt-3 text-xs">
              {/* Patient / Pet Selector */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Who had this appointment?</label>
                {members.length === 0 ? (
                  <p className="text-[11px] text-amber-400">No family members or pets registered yet. Add one in the 'Family & Pets' tab.</p>
                ) : (
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    {members.map(m => (
                      <button
                        type="button"
                        key={m.id}
                        onClick={() => setMemberId(m.id)}
                        className={`p-2 rounded-xl border flex items-center space-x-2 text-left transition-all ${
                          memberId === m.id
                            ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                            : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-300' : 'bg-slate-50 border-slate-200 text-slate-700'
                        }`}
                      >
                        <span className="text-lg">{m.avatar}</span>
                        <div className="truncate">
                          <span className="block font-bold text-xs truncate">{m.name}</span>
                          <span className="text-[10px] opacity-75">{m.type === 'pet' ? 'Pet' : m.role}</span>
                        </div>
                      </button>
                    ))}
                  </div>
                )}
              </div>

              {/* Auto-fill from Saved Clinics */}
              {clinics.length > 0 && (
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Quick-Fill from Saved Clinic</label>
                  <select
                    value={selectedClinicId}
                    onChange={(e) => handleClinicSelect(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  >
                    <option value="">-- Choose a clinic to auto-fill --</option>
                    {clinics.map(c => (
                      <option key={c.id} value={c.id}>
                        {c.preferred ? '⭐ ' : ''}{c.name} ({c.category})
                      </option>
                    ))}
                  </select>
                </div>
              )}

              {/* Specialty & Status */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Specialty</label>
                  <select
                    value={providerType}
                    onChange={(e) => setProviderType(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  >
                    <option value="GP">🩺 GP / Family Doctor</option>
                    <option value="Vet">🐾 Veterinarian (Vet)</option>
                    <option value="Dentist">🦷 Dentist</option>
                    <option value="Optometrist">👓 Optometrist</option>
                    <option value="Physio">🏃 Physiotherapist</option>
                    <option value="Specialist">🔬 Medical Specialist</option>
                  </select>
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Status</label>
                  <select
                    value={status}
                    onChange={(e) => setStatus(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  >
                    <option value="Completed">Completed (Past)</option>
                    <option value="Upcoming">Upcoming</option>
                  </select>
                </div>
              </div>

              {/* Split Date & Time with Interactive Popups */}
              <div className="grid grid-cols-2 gap-3 relative">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Appointment Date</label>
                  <button
                    type="button"
                    onClick={() => { setShowDatePicker(!showDatePicker); setShowTimePicker(false); }}
                    className={`w-full p-2.5 rounded-xl border text-left flex items-center justify-between font-semibold transition-all ${
                      showDatePicker
                        ? 'border-blue-500 ring-2 ring-blue-500/20'
                        : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  >
                    <span className="truncate">{formattedDisplayDate}</span>
                    <Icon name="calendar" size={15} className="text-blue-500 shrink-0 ml-1" />
                  </button>

                  {showDatePicker && (
                    <div className={`absolute left-0 top-[102%] z-50 w-72 p-3 rounded-2xl border shadow-2xl ${
                      isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-300 text-slate-900'
                    }`}>
                      <div className="flex items-center justify-between mb-2 pb-2 border-b border-zinc-800">
                        <span className="font-bold text-xs">
                          {calNavDate.toLocaleString('default', { month: 'long', year: 'numeric' })}
                        </span>
                        <div className="flex items-center space-x-1">
                          <button type="button" onClick={handlePrevMonth} className={`p-1 rounded-lg ${isDark ? 'hover:bg-zinc-800' : 'hover:bg-slate-100'}`}>
                            <Icon name="chevronLeft" size={15} />
                          </button>
                          <button type="button" onClick={handleNextMonth} className={`p-1 rounded-lg ${isDark ? 'hover:bg-zinc-800' : 'hover:bg-slate-100'}`}>
                            <Icon name="chevronRight" size={15} />
                          </button>
                        </div>
                      </div>

                      <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-zinc-400 mb-1">
                        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                      </div>

                      <div className="grid grid-cols-7 gap-1 text-center">
                        {Array.from({ length: firstDayOfMonth(calNavDate.getFullYear(), calNavDate.getMonth()) }).map((_, i) => (
                          <span key={`empty-${i}`} />
                        ))}
                        {Array.from({ length: daysInMonth(calNavDate.getFullYear(), calNavDate.getMonth()) }).map((_, i) => {
                          const day = i + 1;
                          const checkDateStr = `${calNavDate.getFullYear()}-${String(calNavDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                          const isSelected = selectedDate === checkDateStr;
                          return (
                            <button
                              key={day}
                              type="button"
                              onClick={() => selectCalDay(day)}
                              className={`p-1.5 rounded-lg text-xs font-semibold transition-all ${
                                isSelected ? 'bg-blue-600 text-white font-bold' : isDark ? 'hover:bg-zinc-800 text-zinc-200' : 'hover:bg-slate-100 text-slate-800'
                              }`}
                            >
                              {day}
                            </button>
                          );
                        })}
                      </div>

                      <div className="flex items-center justify-between pt-2.5 mt-2 border-t border-zinc-800 text-[10px]">
                        <button type="button" onClick={() => handleQuickDate(0)} className="px-2 py-1 rounded-md bg-blue-500/15 text-blue-400 font-bold">
                          Today
                        </button>
                        <button type="button" onClick={() => handleQuickDate(1)} className={`px-2 py-1 rounded-md font-semibold ${isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-100 text-slate-700'}`}>
                          Tomorrow
                        </button>
                        <button type="button" onClick={() => handleQuickDate(7)} className={`px-2 py-1 rounded-md font-semibold ${isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-100 text-slate-700'}`}>
                          +1 Week
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Appointment Time</label>
                  <button
                    type="button"
                    onClick={() => { setShowTimePicker(!showTimePicker); setShowDatePicker(false); }}
                    className={`w-full p-2.5 rounded-xl border text-left flex items-center justify-between font-semibold transition-all ${
                      showTimePicker
                        ? 'border-blue-500 ring-2 ring-blue-500/20'
                        : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  >
                    <span className="truncate">{formattedDisplayTime}</span>
                    <Icon name="clock" size={15} className="text-blue-500 shrink-0 ml-1" />
                  </button>

                  {showTimePicker && (
                    <div className={`absolute right-0 top-[102%] z-50 w-64 p-3 rounded-2xl border shadow-2xl ${
                      isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-300 text-slate-900'
                    }`}>
                      <span className={`block text-[10px] font-bold uppercase tracking-wider mb-2 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                        Select Consultation Slot
                      </span>

                      <div className="grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto pr-1">
                        {[
                          '08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30',
                          '12:00', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30',
                          '16:00', '16:30', '17:00', '17:30', '18:00'
                        ].map(t => {
                          const [h, m] = t.split(':').map(Number);
                          const period = h >= 12 ? 'PM' : 'AM';
                          const displayH = h % 12 || 12;
                          const label = `${displayH}:${String(m).padStart(2, '0')} ${period}`;
                          const isSelected = selectedTime === t;
                          return (
                            <button
                              key={t}
                              type="button"
                              onClick={() => {
                                setSelectedTime(t);
                                setShowTimePicker(false);
                              }}
                              className={`p-1.5 rounded-lg text-xs font-semibold text-center transition-all ${
                                isSelected ? 'bg-blue-600 text-white font-bold' : isDark ? 'bg-zinc-950 border border-zinc-800 hover:bg-zinc-800 text-zinc-200' : 'bg-slate-50 border border-slate-200 text-slate-800'
                              }`}
                            >
                              {label}
                            </button>
                          );
                        })}
                      </div>

                      <div className="pt-2 mt-2 border-t border-zinc-800 flex justify-end">
                        <button type="button" onClick={() => setShowTimePicker(false)} className="text-[11px] font-bold text-blue-400 hover:underline">
                          Done
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* Doctor & Clinic Name */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Doctor / Vet Name</label>
