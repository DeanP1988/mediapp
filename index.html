                </div>

                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className={`block font-bold ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                      Email Address <span className="text-rose-400">*</span>
                    </label>
                    <span className="text-[10px] text-blue-400 font-semibold">Required for login</span>
                  </div>
                  <input
                    type="email"
                    placeholder="you@example.com"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  />
                </div>

                {/* 4-digit PIN Setup */}
                <div className="grid grid-cols-2 gap-2 p-3 rounded-2xl border border-blue-500/30 bg-blue-500/5">
                  <div>
                    <label className="block font-bold mb-1 text-blue-400">4-Digit Security PIN *</label>
                    <input
                      type="password"
                      maxLength={4}
                      placeholder="••••"
                      value={pin}
                      onChange={(e) => setPin(e.target.value.replace(/\D/g, ''))}
                      className={`w-full p-2 rounded-xl border text-center font-mono text-base tracking-widest outline-none font-bold ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
                      }`}
                    />
                  </div>
                  <div>
                    <label className="block font-bold mb-1 text-blue-400">Confirm PIN *</label>
                    <input
                      type="password"
                      maxLength={4}
                      placeholder="••••"
                      value={confirmPin}
                      onChange={(e) => setConfirmPin(e.target.value.replace(/\D/g, ''))}
                      className={`w-full p-2 rounded-xl border text-center font-mono text-base tracking-widest outline-none font-bold ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
                      }`}
                    />
                  </div>
                  <p className={`col-span-2 text-[10px] mt-0.5 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                    You will use this PIN together with your email to sign into any new shortcut or device.
                  </p>
                </div>

                <div>
                  <label className={`block font-bold mb-1.5 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                    Sharing & Family Group Setup
                  </label>
                  <div className="grid grid-cols-3 gap-2">
                    <button
                      type="button"
                      onClick={() => setGroupChoice('solo')}
                      className={`p-2 rounded-xl border font-bold text-center transition-all ${
                        groupChoice === 'solo'
                          ? 'bg-blue-600 text-white border-blue-600'
                          : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-50 border-slate-200 text-slate-700'
                      }`}
                    >
                      <Icon name="lock" size={14} className="mx-auto mb-1" />
                      <span>Solo / Private</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setGroupChoice('join')}
                      className={`p-2 rounded-xl border font-bold text-center transition-all ${
                        groupChoice === 'join'
                          ? 'bg-blue-600 text-white border-blue-600'
                          : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-50 border-slate-200 text-slate-700'
                      }`}
                    >
                      <Icon name="keyRound" size={14} className="mx-auto mb-1" />
                      <span>Join Group</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setGroupChoice('create')}
                      className={`p-2 rounded-xl border font-bold text-center transition-all ${
                        groupChoice === 'create'
                          ? 'bg-blue-600 text-white border-blue-600'
                          : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-50 border-slate-200 text-slate-700'
                      }`}
                    >
                      <Icon name="users" size={14} className="mx-auto mb-1" />
                      <span>New Group</span>
                    </button>
                  </div>
                </div>

                {groupChoice === 'join' && (
                  <div className="p-3 rounded-2xl border bg-blue-500/10 border-blue-500/30">
                    <label className="block font-bold text-blue-400 mb-1">Enter Family Invite Code</label>
                    <input
                      type="text"
                      placeholder="e.g. MILLER77"
                      value={inviteCode}
                      onChange={(e) => setInviteCode(e.target.value.toUpperCase())}
                      className={`w-full p-2.5 rounded-xl border outline-none font-mono uppercase tracking-widest font-bold ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-white' : 'bg-white border-slate-200 text-slate-900'
                      }`}
                    />
                  </div>
                )}

                {groupChoice === 'create' && (
                  <div className="p-3 rounded-2xl border bg-emerald-500/10 border-emerald-500/30">
                    <label className="block font-bold text-emerald-400 mb-1">Family Group Name</label>
                    <input
                      type="text"
                      placeholder="e.g. The Taylor Family"
                      value={newGroupName}
                      onChange={(e) => setNewGroupName(e.target.value)}
                      className={`w-full p-2.5 rounded-xl border outline-none font-bold ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-white' : 'bg-white border-slate-200 text-slate-900'
                      }`}
                    />
                    <p className={`text-[10px] mt-1 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                      An invite code will be created so family members can join.
                    </p>
                  </div>
                )}

                <div className="pt-2 flex items-center justify-between">
                  <button
                    type="button"
                    onClick={() => { setAuthMode('signin'); setErrorMsg(''); }}
                    className={`px-3 py-2 rounded-xl font-bold ${isDark ? 'text-zinc-400' : 'text-slate-600'}`}
                  >
                    Already have an account? Sign In
                  </button>

                  <button
                    type="submit"
                    className="ml-auto px-5 py-2 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-500 shadow-md"
                  >
                    Complete Registration
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // CREATE APPOINTMENT MODAL
    // ==========================================
    function CreateAppointmentModal({ isDark, members, clinics, currentUser, onClose, onSave }) {
      const [memberId, setMemberId] = useState(members[0]?.id || '');
      const [providerType, setProviderType] = useState('GP');
      const [selectedClinicId, setSelectedClinicId] = useState('');
      const [providerName, setProviderName] = useState('');
      const [clinicName, setClinicName] = useState('');
      const [clinicPhone, setClinicPhone] = useState('');
      
      // Split Date and Time state, defaulting to today's date & rounded current time
      const [selectedDate, setSelectedDate] = useState(() => {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      });

      const [selectedTime, setSelectedTime] = useState(() => {
        const now = new Date();
        const roundedMins = Math.round(now.getMinutes() / 15) * 15;
        now.setMinutes(roundedMins);
        const hours = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        return `${hours}:${mins}`;
      });

      // Popup picker visibility toggles
      const [showDatePicker, setShowDatePicker] = useState(false);
      const [showTimePicker, setShowTimePicker] = useState(false);

      // Calendar navigation month/year state
      const [calNavDate, setCalNavDate] = useState(() => new Date());

      const [status, setStatus] = useState('Completed');
      const [reason, setReason] = useState('');
      const [doctorAdvice, setDoctorAdvice] = useState('');
      const [prescriptions, setPrescriptions] = useState('');
      const [followUpNeeded, setFollowUpNeeded] = useState(false);
      const [followUpDate, setFollowUpDate] = useState('');
      const [attachments, setAttachments] = useState([]);

      const activeMember = members.find(m => m.id === memberId);
      useEffect(() => {
        if (activeMember?.type === 'pet') {
          setProviderType('Vet');
        }
      }, [memberId]);

      const handleClinicSelect = (cId) => {
        setSelectedClinicId(cId);
        if (!cId) return;
        const c = clinics.find(item => item.id === cId);
        if (c) {
          setClinicName(c.name);
          setClinicPhone(c.phone || '');
          if (c.category) setProviderType(c.category);
          if (c.doctors && c.doctors.length > 0) {
            setProviderName(c.doctors[0]);
          }
        }
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => {
          const reader = new FileReader();
          reader.onloadend = () => {
            setAttachments(prev => [
              ...prev,
              {
                name: file.name,
                url: reader.result,
                type: file.type.includes('image') ? 'Screenshot' : 'Document'
              }
            ]);
          };
          reader.readAsDataURL(file);
        });
      };

      // Helper formatting for labels
      const formattedDisplayDate = useMemo(() => {
        if (!selectedDate) return 'Select Date';
        const [y, m, d] = selectedDate.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        return dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      }, [selectedDate]);

      const formattedDisplayTime = useMemo(() => {
        if (!selectedTime) return 'Select Time';
        const [h, m] = selectedTime.split(':').map(Number);
        const period = h >= 12 ? 'PM' : 'AM';
        const displayHour = h % 12 || 12;
        return `${displayHour}:${String(m).padStart(2, '0')} ${period}`;
      }, [selectedTime]);

      const handleFollowUpPreset = (type, value) => {
        let baseDate = new Date();
        if (selectedDate) {
          const [y, m, d] = selectedDate.split('-').map(Number);
          baseDate = new Date(y, m - 1, d);
        }
        
        if (type === 'days') {
          baseDate.setDate(baseDate.getDate() + value);
        } else if (type === 'months') {
          baseDate.setMonth(baseDate.getMonth() + value);
        } else if (type === 'years') {
          baseDate.setFullYear(baseDate.getFullYear() + value);
        }

        const y = baseDate.getFullYear();
        const m = String(baseDate.getMonth() + 1).padStart(2, '0');
        const d = String(baseDate.getDate()).padStart(2, '0');
        setFollowUpDate(`${y}-${m}-${d}`);
      };

      // Calendar calculation functions
      const daysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
      const firstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();

      const handlePrevMonth = () => {
        setCalNavDate(prev => new Date(prev.getFullYear(), prev.getMonth() - 1, 1));
      };

      const handleNextMonth = () => {
        setCalNavDate(prev => new Date(prev.getFullYear(), prev.getMonth() + 1, 1));
      };

      const selectCalDay = (day) => {
        const y = calNavDate.getFullYear();
        const m = String(calNavDate.getMonth() + 1).padStart(2, '0');
        const d = String(day).padStart(2, '0');
        setSelectedDate(`${y}-${m}-${d}`);
        setShowDatePicker(false);
      };

      const handleQuickDate = (offsetDays) => {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        setSelectedDate(`${y}-${m}-${day}`);
        setCalNavDate(d);
        setShowDatePicker(false);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!reason.trim()) return;

        const combinedDateTime = `${selectedDate}T${selectedTime || '09:00'}`;

        const newAppt = {
          id: 'a_' + Date.now(),
          memberId,
          memberName: activeMember?.name || 'Unknown',
          providerType,
          providerName: providerName.trim() || 'Attending Physician / Vet',
          clinicName,
          clinicPhone,
          dateTime: combinedDateTime,
          status,
          reason,
          doctorAdvice,
          prescriptions,
          followUpNeeded,
          followUpDate: followUpNeeded ? followUpDate : '',
          attachments,
          vitals: {},
          createdBy: currentUser.id,
          familyGroupId: currentUser.familyGroupId || null
        };

        let autoFollowUp = null;
        if (followUpNeeded && followUpDate) {
          autoFollowUp = {
            id: 'a_' + (Date.now() + 1),
            memberId,
            memberName: activeMember?.name || 'Unknown',
            providerType,
            providerName: providerName.trim() || 'Attending Physician / Vet',
            clinicName,
            clinicPhone,
            dateTime: `${followUpDate}T09:00`,
            status: 'Upcoming',
            reason: `Follow-up / Review: ${reason}`,
            doctorAdvice: doctorAdvice ? `Previous visit instructions: ${doctorAdvice}` : 'Scheduled follow-up review consultation.',
            prescriptions: prescriptions ? `Ongoing medications to review: ${prescriptions}` : '',
            followUpNeeded: false,
            followUpDate: '',
            attachments: [],
            vitals: {},
            createdBy: currentUser.id,
            familyGroupId: currentUser.familyGroupId || null
          };
        }

        onSave(newAppt, autoFollowUp);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm animate-in fade-in">
          <div className={`w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 border shadow-2xl ${
            isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
          }`}>
            <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
              <h2 className="font-bold text-base">Log Doctor or Vet Visit</h2>
              <button onClick={onClose} className={`p-1.5 rounded-full ${isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-100 text-slate-500'}`}>
                <Icon name="x" size={17} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 pt-3 text-xs">
              {/* Who is this visit for? */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Who had this appointment?</label>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                  {members.map(m => (
                    <button
                      type="button"
                      key={m.id}
                      onClick={() => setMemberId(m.id)}
                      className={`p-2 rounded-xl border flex items-center space-x-2 text-left transition-all ${
                        memberId === m.id
                          ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                          : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-300' : 'bg-slate-50 border-slate-200 text-slate-700'
                      }`}
                    >
                      <span className="text-lg">{m.avatar}</span>
                      <div className="truncate">
                        <span className="block font-bold text-xs truncate">{m.name}</span>
                        <span className="text-[10px] opacity-75">{m.type === 'pet' ? 'Pet' : m.role}</span>
                      </div>
                    </button>
                  ))}
                </div>
              </div>

              {/* Quick-Select Saved Clinic */}
              {clinics.length > 0 && (
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Quick-Fill from Saved Clinic</label>
                  <select
                    value={selectedClinicId}
                    onChange={(e) => handleClinicSelect(e.target.value)}
                    className={`w-full p-2 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  >
                    <option value="">-- Choose a clinic to auto-fill --</option>
                    {clinics.map(c => (
                      <option key={c.id} value={c.id}>
                        {c.preferred ? '⭐ ' : ''}{c.name} ({c.category})
                      </option>
                    ))}
                  </select>
                </div>
              )}

              {/* Provider Type & Status */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Specialty</label>
                  <select
                    value={providerType}
                    onChange={(e) => setProviderType(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  >
                    <option value="GP">🩺 GP / Family Doctor</option>
                    <option value="Vet">🐾 Veterinarian (Vet)</option>
                    <option value="Dentist">🦷 Dentist</option>
                    <option value="Optometrist">👓 Optometrist</option>
                    <option value="Physio">🏃 Physiotherapist</option>
                    <option value="Specialist">🔬 Medical Specialist</option>
                  </select>
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Status</label>
                  <select
                    value={status}
                    onChange={(e) => setStatus(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  >
                    <option value="Completed">Completed (Past)</option>
                    <option value="Upcoming">Upcoming</option>
                  </select>
                </div>
              </div>

              {/* Split Date & Time with Interactive Popups */}
              <div className="grid grid-cols-2 gap-3 relative">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Appointment Date</label>
                  <button
                    type="button"
                    onClick={() => { setShowDatePicker(!showDatePicker); setShowTimePicker(false); }}
                    className={`w-full p-2.5 rounded-xl border text-left flex items-center justify-between font-semibold transition-all ${
                      showDatePicker
                        ? 'border-blue-500 ring-2 ring-blue-500/20'
                        : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  >
                    <span className="truncate">{formattedDisplayDate}</span>
                    <span className="text-blue-500 shrink-0 ml-1"><Icon name="calendar" size={15} /></span>
                  </button>

                  {/* Interactive Calendar Popup */}
                  {showDatePicker && (
                    <div className={`absolute left-0 top-[102%] z-50 w-72 p-3 rounded-2xl border shadow-2xl ${
                      isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-300 text-slate-900'
                    }`}>
                      <div className="flex items-center justify-between mb-2 pb-2 border-b border-zinc-800">
                        <span className="font-bold text-xs">
                          {calNavDate.toLocaleString('default', { month: 'long', year: 'numeric' })}
                        </span>
                        <div className="flex items-center space-x-1">
                          <button
                            type="button"
                            onClick={handlePrevMonth}
                            className={`p-1 rounded-lg ${isDark ? 'hover:bg-zinc-800' : 'hover:bg-slate-100'}`}
                          >
                            <Icon name="chevronLeft" size={15} />
                          </button>
                          <button
                            type="button"
                            onClick={handleNextMonth}
                            className={`p-1 rounded-lg ${isDark ? 'hover:bg-zinc-800' : 'hover:bg-slate-100'}`}
                          >
                            <Icon name="chevronRight" size={15} />
                          </button>
                        </div>
                      </div>

                      <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-zinc-400 mb-1">
                        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                      </div>

                      <div className="grid grid-cols-7 gap-1 text-center">
                        {Array.from({ length: firstDayOfMonth(calNavDate.getFullYear(), calNavDate.getMonth()) }).map((_, i) => (
                          <span key={`empty-${i}`} />
                        ))}
                        {Array.from({ length: daysInMonth(calNavDate.getFullYear(), calNavDate.getMonth()) }).map((_, i) => {
                          const day = i + 1;
                          const checkDateStr = `${calNavDate.getFullYear()}-${String(calNavDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                          const isSelected = selectedDate === checkDateStr;
                          return (
                            <button
                              key={day}
                              type="button"
                              onClick={() => selectCalDay(day)}
                              className={`p-1.5 rounded-lg text-xs font-semibold transition-all ${
                                isSelected
                                  ? 'bg-blue-600 text-white font-bold'
                                  : isDark ? 'hover:bg-zinc-800 text-zinc-200' : 'hover:bg-slate-100 text-slate-800'
                              }`}
                            >
                              {day}
                            </button>
                          );
                        })}
                      </div>

                      <div className="flex items-center justify-between pt-2.5 mt-2 border-t border-zinc-800 text-[10px]">
                        <button
                          type="button"
                          onClick={() => handleQuickDate(0)}
                          className="px-2 py-1 rounded-md bg-blue-500/15 text-blue-400 font-bold hover:bg-blue-500/25"
                        >
                          Today
                        </button>
                        <button
                          type="button"
                          onClick={() => handleQuickDate(1)}
                          className={`px-2 py-1 rounded-md font-semibold ${isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-100 text-slate-700'}`}
                        >
                          Tomorrow
                        </button>
                        <button
                          type="button"
                          onClick={() => handleQuickDate(7)}
                          className={`px-2 py-1 rounded-md font-semibold ${isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-100 text-slate-700'}`}
                        >
                          +1 Week
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Appointment Time</label>
                  <button
                    type="button"
                    onClick={() => { setShowTimePicker(!showTimePicker); setShowDatePicker(false); }}
                    className={`w-full p-2.5 rounded-xl border text-left flex items-center justify-between font-semibold transition-all ${
                      showTimePicker
                        ? 'border-blue-500 ring-2 ring-blue-500/20'
                        : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  >
                    <span className="truncate">{formattedDisplayTime}</span>
                    <span className="text-blue-500 shrink-0 ml-1"><Icon name="clock" size={15} /></span>
                  </button>

                  {/* Interactive Time Picker Popup */}
                  {showTimePicker && (
                    <div className={`absolute right-0 top-[102%] z-50 w-64 p-3 rounded-2xl border shadow-2xl ${
                      isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-300 text-slate-900'
                    }`}>
                      <span className={`block text-[10px] font-bold uppercase tracking-wider mb-2 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                        Select Consultation Slot
                      </span>

                      <div className="grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto pr-1">
                        {[
                          '08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30',
                          '12:00', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30',
                          '16:00', '16:30', '17:00', '17:30', '18:00'
                        ].map(t => {
                          const [h, m] = t.split(':').map(Number);
                          const period = h >= 12 ? 'PM' : 'AM';
                          const displayH = h % 12 || 12;
                          const label = `${displayH}:${String(m).padStart(2, '0')} ${period}`;
                          const isSelected = selectedTime === t;
                          return (
                            <button
                              key={t}
                              type="button"
                              onClick={() => {
                                setSelectedTime(t);
                                setShowTimePicker(false);
                              }}
                              className={`p-1.5 rounded-lg text-xs font-semibold text-center transition-all ${
                                isSelected
                                  ? 'bg-blue-600 text-white font-bold'
                                  : isDark ? 'bg-zinc-950 border border-zinc-800 hover:bg-zinc-800 text-zinc-200' : 'bg-slate-50 border border-slate-200 hover:bg-slate-100 text-slate-800'
                              }`}
                            >
                              {label}
                            </button>
                          );
                        })}
                      </div>

                      <div className="pt-2 mt-2 border-t border-zinc-800 flex justify-end">
                        <button
                          type="button"
                          onClick={() => setShowTimePicker(false)}
                          className="text-[11px] font-bold text-blue-400 hover:underline"
                        >
                          Done
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* Doctor Name & Clinic Name */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Doctor / Vet Name</label>
                  <input
                    type="text"
                    placeholder="e.g. Dr. Arthur Miller"
                    value={providerName}
                    onChange={(e) => setProviderName(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  />
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Clinic Name</label>
                  <input
                    type="text"
                    placeholder="e.g. Bayside Medical"
                    value={clinicName}
                    onChange={(e) => setClinicName(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  />
                </div>
              </div>

              {/* Reason for Visit */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                  Reason for Visit <span className="text-rose-400">*</span>
                </label>
                <textarea
                  rows={2}
                  placeholder="e.g. Cough for 2 weeks, routine 6-month cleaning, limping on front leg..."
                  value={reason}
                  onChange={(e) => setReason(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${
                    isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                  }`}
                />
              </div>

              {/* What the Doctor / Vet Said */}
              <div>
                <label className="block font-bold text-blue-400 mb-1">
                  What the Doctor / Vet Said (Advice & Findings)
                </label>
                <textarea
                  rows={3}
                  placeholder="Record diagnosis, dietary suggestions, instructions, home care tips..."
                  value={doctorAdvice}
                  onChange={(e) => setDoctorAdvice(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${
                    isDark ? 'bg-blue-950/20 border-blue-900/50 text-blue-100 placeholder-zinc-500' : 'bg-blue-50/50 border-blue-200 text-blue-900'
                  }`}
                />
              </div>

              {/* Prescriptions / Meds */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                  Prescriptions & Medications Given
                </label>
                <input
                  type="text"
                  placeholder="e.g. Amoxicillin 250mg 3x daily for 7 days, Heartgard chewable"
                  value={prescriptions}
                  onChange={(e) => setPrescriptions(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                    isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                  }`}
                />
              </div>

              {/* Follow Up */}
              <div className="flex items-center space-x-3 pt-1">
                <input
                  type="checkbox"
                  id="followUpCheck"
                  checked={followUpNeeded}
                  onChange={(e) => setFollowUpNeeded(e.target.checked)}
                  className="rounded text-blue-600 focus:ring-0 cursor-pointer"
                />
                <label htmlFor="followUpCheck" className="font-bold text-xs cursor-pointer">
                  Follow-up visit required?
                </label>
              </div>

              {followUpNeeded && (
                <div className={`p-3 rounded-2xl border space-y-2 ${isDark ? 'bg-amber-950/20 border-amber-800/40' : 'bg-amber-50 border-amber-200'}`}>
                  <div className="flex items-center justify-between">
                    <label className={`block font-bold ${isDark ? 'text-amber-300' : 'text-amber-900'}`}>
                      Follow-up Review Date <span className="text-rose-400">*</span>
                    </label>
                    <span className="text-[10px] font-semibold text-amber-500">Auto-schedules Upcoming Visit</span>
                  </div>

                  {/* Preset buttons relative to the consultation date */}
                  <div className="flex flex-wrap items-center gap-1.5">
                    <span className={`text-[10px] font-bold ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>Presets from visit:</span>
                    {[
                      { label: '1 Week', type: 'days', val: 7 },
                      { label: '1 Month', type: 'months', val: 1 },
                      { label: '6 Months', type: 'months', val: 6 },
                      { label: '1 Year', type: 'years', val: 1 }
                    ].map(preset => (
                      <button
                        key={preset.label}
                        type="button"
                        onClick={() => handleFollowUpPreset(preset.type, preset.val)}
                        className={`px-2.5 py-1 rounded-lg text-[10px] font-bold border transition-all active:scale-95 ${
                          isDark 
                            ? 'bg-zinc-900 hover:bg-zinc-800 border-zinc-700 text-amber-300 hover:border-amber-400' 
                            : 'bg-white hover:bg-amber-100 border-amber-300 text-amber-900 shadow-xs'
                        }`}
                      >
                        +{preset.label}
                      </button>
                    ))}
                  </div>

                  <input
                    type="date"
                    value={followUpDate}
                    onChange={(e) => setFollowUpDate(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  />
                  <p className={`text-[10px] leading-tight ${isDark ? 'text-zinc-400' : 'text-slate-600'}`}>
                    An "Upcoming" consultation will automatically be added to your calendar copying the doctor/vet, clinic details, and medications to review.
                  </p>
                </div>
              )}

              {/* Attachment Upload */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                  Attach Screenshot / Referral / Receipt
                </label>
                <input
                  type="file"
                  accept="image/*"
                  multiple
                  onChange={handleFileUpload}
                  className={`w-full text-xs p-2 rounded-xl border file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 ${
                    isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-300' : 'bg-slate-50 border-slate-200 text-slate-700'
                  }`}
                />
                {attachments.length > 0 && (
                  <div className="flex flex-wrap gap-2 mt-2">
                    {attachments.map((att, i) => (
                      <div key={i} className="relative group w-16 h-16 rounded-lg overflow-hidden border border-zinc-700">
                        <img src={att.url} alt="upload" className="w-full h-full object-cover" />
                        <button
                          type="button"
                          onClick={() => setAttachments(prev => prev.filter((_, idx) => idx !== i))}
                          className="absolute top-0.5 right-0.5 bg-black/70 text-white rounded-full p-0.5"
                        >
                          <Icon name="x" size={12} />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Submit */}
              <div className="pt-3 border-t border-zinc-800 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-4 py-2 rounded-xl font-bold ${isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-200 text-slate-700'}`}
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-500 shadow-md transition-all active:scale-98"
                >
                  Save Visit Log
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // CREATE CLINIC MODAL
    // ==========================================
    function CreateClinicModal({ isDark, currentUser, onClose, onSave }) {
      const [name, setName] = useState('');
      const [category, setCategory] = useState('GP');
      const [phone, setPhone] = useState('');
      const [emergencyPhone, setEmergencyPhone] = useState('');
      const [address, setAddress] = useState('');
      const [website, setWebsite] = useState('');
      const [hours, setHours] = useState('');
      const [doctorsInput, setDoctorsInput] = useState('');
      const [preferred, setPreferred] = useState(true);
      const [notes, setNotes] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;

        const doctorsArray = doctorsInput
          .split(',')
          .map(d => d.trim())
          .filter(Boolean);

        onSave({
          id: 'c_' + Date.now(),
          name: name.trim(),
          category,
          phone: phone.trim(),
          emergencyPhone: emergencyPhone.trim(),
          address: address.trim(),
          website: website.trim(),
          hours: hours.trim(),
          doctors: doctorsArray,
          notes: notes.trim(),
          preferred,
          createdBy: currentUser.id,
          familyGroupId: currentUser.familyGroupId || null
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm">
          <div className={`w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 border shadow-2xl ${
            isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
          }`}>
            <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
              <h2 className="font-bold text-base">Add Clinic or Practice</h2>
              <button onClick={onClose} className={`p-1.5 rounded-full ${isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-100 text-slate-500'}`}>
                <Icon name="x" size={17} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 pt-3 text-xs">
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                  Clinic / Hospital Name <span className="text-rose-400">*</span>
                </label>
                <input
                  type="text"
                  placeholder="e.g. City Central Veterinary Clinic"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                    isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                  }`}
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Specialty Type</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  >
                    <option value="GP">🩺 GP / Family Medical</option>
                    <option value="Vet">🐾 Veterinarian (Vet)</option>
                    <option value="Dentist">🦷 Dentist</option>
                    <option value="Optometrist">👓 Optometrist</option>
                    <option value="Physio">🏃 Physiotherapist</option>
                    <option value="Specialist">🔬 Specialist Clinic</option>
                  </select>
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Main Phone</label>
                  <input
                    type="tel"
                    placeholder="(555) 000-0000"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Emergency / After Hours</label>
                  <input
                    type="tel"
                    placeholder="Optional ER line"
                    value={emergencyPhone}
                    onChange={(e) => setEmergencyPhone(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  />
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Website / Booking URL</label>
                  <input
                    type="url"
                    placeholder="https://..."
                    value={website}
                    onChange={(e) => setWebsite(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  />
                </div>
              </div>

              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Full Street Address</label>
                <input
                  type="text"
                  placeholder="123 Health Ave, Suite 4B (for Maps navigation)"
                  value={address}
                  onChange={(e) => setAddress(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                    isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                  }`}
                />
              </div>

              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Known Doctors / Vets (comma separated)</label>
                <input
                  type="text"
                  placeholder="e.g. Dr. Arthur Miller, Dr. Chloe Adams"
                  value={doctorsInput}
                  onChange={(e) => setDoctorsInput(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                    isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                  }`}
                />
              </div>

              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Operating Hours</label>
                <input
                  type="text"
                  placeholder="e.g. Mon-Fri 8:00 AM - 6:00 PM, Sat 9:00 AM - 1:00 PM"
                  value={hours}
                  onChange={(e) => setHours(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                    isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                  }`}
                />
              </div>

              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Helpful Notes</label>
                <textarea
                  rows={2}
                  placeholder="Parking tips, bulk billing available, direct pet insurance claims, etc."
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${
                    isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                  }`}
                />
              </div>

              <div className="flex items-center space-x-2 pt-1">
                <input
                  type="checkbox"
                  id="prefCheck"
                  checked={preferred}
                  onChange={(e) => setPreferred(e.target.checked)}
                  className="rounded text-amber-500 focus:ring-0 cursor-pointer"
                />
                <label htmlFor="prefCheck" className="font-bold text-xs cursor-pointer flex items-center space-x-1">
                  <span>⭐ Mark as Preferred / Family Favorite Clinic</span>
                </label>
              </div>

              <div className="pt-3 border-t border-zinc-800 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-4 py-2 rounded-xl font-bold ${isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-200 text-slate-700'}`}
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-500 shadow-md transition-all active:scale-98"
                >
                  Save Clinic
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // CREATE MEMBER MODAL
    // ==========================================
    function CreateMemberModal({ isDark, currentUser, onClose, onSave }) {
      const [type, setType] = useState('human');
      const [name, setName] = useState('');
      const [avatar, setAvatar] = useState('👩');
      
      // Common fields
      const [dob, setDob] = useState('');
      const [allergiesInput, setAllergiesInput] = useState('');
      const [conditions, setConditions] = useState('');
      const [insurancePolicy, setInsurancePolicy] = useState('');

      // Human-specific fields
      const [role, setRole] = useState('Mother');
      const [bloodType, setBloodType] = useState('O+');
      const [emergencyContact, setEmergencyContact] = useState('');
      const [emergencyPhone, setEmergencyPhone] = useState('');

      // Pet-specific fields
      const [species, setSpecies] = useState('Dog');
      const [breed, setBreed] = useState('');
      const [gender, setGender] = useState('Male');
      const [isDesexed, setIsDesexed] = useState(true);
      const [microchip, setMicrochip] = useState('');
      const [weight, setWeight] = useState('');

      const humanAvatars = ['👩', '👨', '👧', '👦', '👶', '👵', '👴', '🧑'];
      const petAvatars = ['🐶', '🐱', '🐰', '🦜', '🐹', '🐴', '🐾', '🐠'];

      const handleTypeToggle = (newType) => {
        setType(newType);
        if (newType === 'pet') {
          setAvatar('🐶');
        } else {
          setAvatar('👩');
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;

        const allergies = allergiesInput
          .split(',')
          .map(a => a.trim())
          .filter(Boolean);

        const newMember = {
          id: 'm_' + Date.now(),
          name: name.trim(),
          type,
          avatar,
          dob,
          allergies,
          conditions: conditions.trim(),
          insurancePolicy: insurancePolicy.trim(),
          // Human properties
          role: type === 'human' ? role.trim() : '',
          bloodType: type === 'human' ? bloodType : '',
          emergencyContact: type === 'human' ? emergencyContact.trim() : '',
          emergencyPhone: type === 'human' ? emergencyPhone.trim() : '',
          // Pet properties
          species: type === 'pet' ? species.trim() : '',
          breed: type === 'pet' ? breed.trim() : '',
          gender: type === 'pet' ? gender : '',
          isDesexed: type === 'pet' ? isDesexed : false,
          microchip: type === 'pet' ? microchip.trim() : '',
          weight: type === 'pet' ? weight.trim() : '',
          createdBy: currentUser.id,
          familyGroupId: currentUser.familyGroupId || null
        };

        onSave(newMember);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm animate-in fade-in">
          <div className={`w-full max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 border shadow-2xl ${
            isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
          }`}>
            <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
              <h2 className="font-bold text-base">Add Family Member or Pet</h2>
              <button onClick={onClose} className={`p-1.5 rounded-full ${isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-100 text-slate-500'}`}>
                <Icon name="x" size={17} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 pt-3 text-xs">
              {/* Type Switcher */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Member Classification</label>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => handleTypeToggle('human')}
                    className={`py-2 rounded-xl font-bold border flex items-center justify-center space-x-1.5 transition-all ${
                      type === 'human'
                        ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                        : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-50 border-slate-200 text-slate-700'
                    }`}
                  >
                    <span>👤 Human Family Member</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => handleTypeToggle('pet')}
                    className={`py-2 rounded-xl font-bold border flex items-center justify-center space-x-1.5 transition-all ${
                      type === 'pet'
                        ? 'bg-amber-500 text-black border-amber-500 shadow-sm'
                        : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-50 border-slate-200 text-slate-700'
                    }`}
                  >
                    <span>🐾 Family Pet</span>
                  </button>
                </div>
              </div>

              {/* Avatar Selector Grid */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Choose Avatar</label>
                <div className="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1">
                  {(type === 'human' ? humanAvatars : petAvatars).map(a => (
                    <button
                      key={a}
                      type="button"
                      onClick={() => setAvatar(a)}
                      className={`w-10 h-10 rounded-xl text-xl flex items-center justify-center shrink-0 border transition-all ${
                        avatar === a
                          ? 'border-blue-500 bg-blue-500/20 scale-105 shadow-sm'
                          : isDark ? 'border-zinc-800 bg-zinc-950 text-zinc-300' : 'border-slate-200 bg-slate-50 text-slate-700'
                      }`}
                    >
                      {a}
                    </button>
                  ))}
                  <input
                    type="text"
                    value={avatar}
                    onChange={(e) => setAvatar(e.target.value)}
                    placeholder="Custom"
                    maxLength={2}
                    className={`w-12 h-10 rounded-xl border text-center text-lg outline-none shrink-0 ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
                    }`}
                    title="Or type custom emoji"
                  />
                </div>
              </div>

              {/* Name & Relation / Species */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                    Name <span className="text-rose-400">*</span>
                  </label>
                  <input
                    type="text"
                    placeholder={type === 'pet' ? "e.g. Milo, Luna" : "e.g. Sarah, David"}
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                    }`}
                  />
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                    {type === 'human' ? 'Relationship / Role' : 'Species'}
                  </label>
                  {type === 'human' ? (
                    <input
                      type="text"
                      placeholder="e.g. Mother, Father, Daughter, Self"
                      value={role}
                      onChange={(e) => setRole(e.target.value)}
                      className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                      }`}
                    />
                  ) : (
                    <input
                      type="text"
                      placeholder="e.g. Dog, Cat, Rabbit, Bird"
                      value={species}
                      onChange={(e) => setSpecies(e.target.value)}
                      className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                      }`}
                    />
                  )}
                </div>
              </div>

              {/* HUMAN-SPECIFIC FIELDS */}
              {type === 'human' && (
                <>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Date of Birth</label>
                      <input
                        type="date"
                        value={dob}
                        onChange={(e) => setDob(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                          isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                        }`}
                      />
                    </div>

                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Blood Type</label>
                      <select
                        value={bloodType}
                        onChange={(e) => setBloodType(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                          isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                        }`}
                      >
                        <option value="Unknown">Unknown</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Emergency Contact Name</label>
                      <input
                        type="text"
                        placeholder="e.g. David Miller (Spouse)"
                        value={emergencyContact}
                        onChange={(e) => setEmergencyContact(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                          isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                        }`}
                      />
                    </div>

                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Emergency Phone</label>
                      <input
                        type="tel"
                        placeholder="e.g. (555) 234-5678"
                        value={emergencyPhone}
                        onChange={(e) => setEmergencyPhone(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                          isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                        }`}
                      />
                    </div>
                  </div>

                  <div>
                    <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                      Medicare / Insurance Policy Number
                    </label>
                    <input
                      type="text"
                      placeholder="e.g. Medicare 2491 82910 1 / Bupa #829182"
                      value={insurancePolicy}
                      onChange={(e) => setInsurancePolicy(e.target.value)}
                      className={`w-full p-2.5 rounded-xl border outline-none font-mono ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                      }`}
                    />
                  </div>
                </>
              )}

              {/* PET-SPECIFIC FIELDS */}
              {type === 'pet' && (
                <>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Breed</label>
                      <input
                        type="text"
                        placeholder="e.g. Golden Retriever, Ragdoll"
                        value={breed}
                        onChange={(e) => setBreed(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                          isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                        }`}
                      />
                    </div>

                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Pet Gender</label>
                      <select
                        value={gender}
                        onChange={(e) => setGender(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                          isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                        }`}
                      >
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Date of Birth / Adoption</label>
                      <input
                        type="date"
                        value={dob}
                        onChange={(e) => setDob(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                          isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                        }`}
                      />
                    </div>

                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Approx. Weight</label>
                      <input
                        type="text"
                        placeholder="e.g. 31.5 kg or 12 lbs"
                        value={weight}
                        onChange={(e) => setWeight(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                          isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                        }`}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>15-digit Microchip Number</label>
                      <input
                        type="text"
                        placeholder="985141002341902"
                        value={microchip}
                        onChange={(e) => setMicrochip(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-mono ${
                          isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                        }`}
                      />
                    </div>

                    <div>
                      <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Pet Insurance Policy</label>
                      <input
                        type="text"
                        placeholder="e.g. Trupanion #PET-8492"
                        value={insurancePolicy}
                        onChange={(e) => setInsurancePolicy(e.target.value)}
                        className={`w-full p-2.5 rounded-xl border outline-none font-mono ${
                          isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                        }`}
                      />
                    </div>
                  </div>

                  <div className="flex items-center space-x-2 pt-0.5">
                    <input
                      type="checkbox"
                      id="desexCheck"
                      checked={isDesexed}
                      onChange={(e) => setIsDesexed(e.target.checked)}
                      className="rounded text-amber-500 focus:ring-0 cursor-pointer"
                    />
                    <label htmlFor="desexCheck" className="font-bold text-xs cursor-pointer">
                      Desexed / Neutered / Spayed
                    </label>
                  </div>
                </>
              )}

              {/* Medical Alerts & Allergies */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                  Known Allergies & Medical Warnings (comma separated)
                </label>
                <input
                  type="text"
                  placeholder={type === 'pet' ? "e.g. Chicken protein, Bee stings, Flea medication" : "e.g. Penicillin, Peanuts, Latex, Sulfa drugs"}
                  value={allergiesInput}
                  onChange={(e) => setAllergiesInput(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                    isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                  }`}
                />
              </div>

              {/* Pre-existing Conditions / Notes */}
              <div>
                <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                  Pre-existing Conditions & Special Care Notes
                </label>
                <textarea
                  rows={2}
                  placeholder={type === 'pet' ? "e.g. Sensitive stomach, hip dysplasia risk, regular flea treatment" : "e.g. Mild asthma (uses inhaler), seasonal hay fever, eczema"}
                  value={conditions}
                  onChange={(e) => setConditions(e.target.value)}
                  className={`w-full p-2.5 rounded-xl border outline-none ${
                    isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                  }`}
                />
              </div>

              {/* Submit Buttons */}
              <div className="pt-3 border-t border-zinc-800 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-4 py-2 rounded-xl font-bold ${isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-200 text-slate-700'}`}
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-500 shadow-md transition-all active:scale-98"
                >
                  {type === 'pet' ? 'Save Pet Profile' : 'Save Member'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // FAMILY GROUP MODAL
    // ==========================================
    function FamilyGroupModal({
      isDark,
      theme,
      onToggleTheme,
      onLockApp,
      currentUser,
      currentGroup,
      familyGroups,
      allUsers,
      onClose,
      onSwitchUser,
      onSignOut,
      onUpdatePin,
      onUpdateGroupName,
      onCreateGroup,
      onJoinGroup,
      onLeaveGroup
    }) {
      const [activeSubTab, setActiveSubTab] = useState('group'); // 'group' | 'security' | 'switch'
      const [inputCode, setInputCode] = useState('');
      const [newGroupName, setNewGroupName] = useState('');
      const [isEditingGroupName, setIsEditingGroupName] = useState(false);
      const [editGroupNameValue, setEditGroupNameValue] = useState(currentGroup?.name || '');
      const [statusMessage, setStatusMessage] = useState(null);
      const [copiedCode, setCopiedCode] = useState(false);

      // Keep edit input in sync when group changes
      useEffect(() => {
        if (currentGroup) {
          setEditGroupNameValue(currentGroup.name);
        }
      }, [currentGroup]);

      // Security PIN update state
      const [currentPinInput, setCurrentPinInput] = useState('');
      const [newPinInput, setNewPinInput] = useState('');
      const [confirmNewPinInput, setConfirmNewPinInput] = useState('');

      const groupMembers = useMemo(() => {
        if (!currentGroup) return [];
        return allUsers.filter(u => u.familyGroupId === currentGroup.id);
      }, [allUsers, currentGroup]);

      const handlePinChangeSubmit = (e) => {
        e.preventDefault();
        setStatusMessage(null);

        const actualPin = currentUser.pin;
        if (currentPinInput !== actualPin) {
          setStatusMessage({ type: 'error', text: 'Current PIN is incorrect.' });
          return;
        }

        if (!newPinInput || newPinInput.length !== 4 || !/^\d{4}$/.test(newPinInput)) {
          setStatusMessage({ type: 'error', text: 'New PIN must be exactly 4 digits.' });
          return;
        }

        if (newPinInput !== confirmNewPinInput) {
          setStatusMessage({ type: 'error', text: 'New PINs do not match.' });
          return;
        }

        onUpdatePin(newPinInput);
        setStatusMessage({ type: 'success', text: 'Security PIN successfully updated!' });
        setCurrentPinInput('');
        setNewPinInput('');
        setConfirmNewPinInput('');
      };

      const handleJoin = (e) => {
        e.preventDefault();
        if (!inputCode.trim()) return;
        const res = onJoinGroup(inputCode);
        if (!res.success) {
          setStatusMessage({ type: 'error', text: res.message });
        } else {
          setStatusMessage({ type: 'success', text: `Successfully joined ${res.groupName}!` });
          setInputCode('');
        }
      };

      const handleCreate = (e) => {
        e.preventDefault();
        if (!newGroupName.trim()) return;
        const code = (currentUser.name.slice(0, 3) + Math.floor(1000 + Math.random() * 9000)).toUpperCase();
        onCreateGroup(newGroupName, code);
        setStatusMessage({ type: 'success', text: `Created ${newGroupName} with invite code: ${code}` });
        setNewGroupName('');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm">
          <div className={`w-full max-w-md max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 border shadow-2xl ${
            isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
          }`}>
            <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
              <div className="flex items-center space-x-2">
                <span className="text-2xl">{currentUser.avatar}</span>
                <div>
                  <h2 className="font-bold text-base">{currentUser.name}</h2>
                  <p className={`text-[11px] ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>{currentUser.email}</p>
                </div>
              </div>
              <button onClick={onClose} className={`p-1.5 rounded-full ${isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-100 text-slate-500'}`}>
                <Icon name="x" size={17} />
              </button>
            </div>

            {/* Quick Actions Bar: Lock App & Theme Toggle */}
            <div className={`my-3 p-2.5 rounded-2xl border flex items-center justify-between ${
              isDark ? 'bg-zinc-950/70 border-zinc-800' : 'bg-slate-50 border-slate-200'
            }`}>
              <button
                type="button"
                onClick={onLockApp}
                className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all ${
                  isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-200 hover:text-white hover:bg-zinc-800' : 'bg-white border-slate-300 text-slate-800 hover:bg-slate-100 shadow-xs'
                }`}
              >
                <Icon name="lock" size={14} className="text-blue-500" />
                <span>Lock App Now</span>
              </button>

              <button
                type="button"
                onClick={onToggleTheme}
                className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all ${
                  isDark ? 'bg-zinc-900 border-zinc-700 text-yellow-400 hover:bg-zinc-800' : 'bg-white border-slate-300 text-slate-800 hover:bg-slate-100 shadow-xs'
                }`}
              >
                <Icon name={isDark ? "sun" : "moon"} size={14} />
                <span>{isDark ? 'Light Mode' : 'Dark Mode'}</span>
              </button>
            </div>

            {/* Sub-tabs: Group Settings vs PIN Security vs Switch User */}
            <div className="flex items-center space-x-1.5 my-3">
              <button
                onClick={() => { setActiveSubTab('group'); setStatusMessage(null); }}
                className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all ${
                  activeSubTab === 'group'
                    ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                    : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-100 border-slate-200 text-slate-700'
                }`}
              >
                Family Group
              </button>
              <button
                onClick={() => { setActiveSubTab('security'); setStatusMessage(null); }}
                className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1 ${
                  activeSubTab === 'security'
                    ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                    : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-100 border-slate-200 text-slate-700'
                }`}
              >
                <Icon name="lock" size={12} />
                <span>PIN Code</span>
              </button>
              <button
                onClick={() => { setActiveSubTab('switch'); setStatusMessage(null); }}
                className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all ${
                  activeSubTab === 'switch'
                    ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
