<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CareTracker - Family & Pet Health</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background: white !important;
        color: black !important;
      }
    }
  </style>
</head>
<body class="bg-black text-zinc-100 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INLINE SVG ICONS (Zero External Dependency) ---
    const Icon = ({ name, size = 16, className = '' }) => {
      const icons = {
        calendar: (
          <>
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </>
        ),
        clock: (
          <>
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </>
        ),
        user: (
          <>
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </>
        ),
        plus: (
          <>
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </>
        ),
        search: (
          <>
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </>
        ),
        image: (
          <>
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </>
        ),
        chevronRight: <polyline points="9 18 15 12 9 6" />,
        chevronLeft: <polyline points="15 18 9 12 15 6" />,
        x: (
          <>
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </>
        ),
        phone: (
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
        ),
        alertCircle: (
          <>
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </>
        ),
        stethoscope: (
          <>
            <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3" />
            <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4" />
            <circle cx="20" cy="10" r="2" />
          </>
        ),
        trash2: (
          <>
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            <line x1="10" y1="11" x2="10" y2="17" />
            <line x1="14" y1="11" x2="14" y2="17" />
          </>
        ),
        edit: (
          <>
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
          </>
        ),
        zoomIn: (
          <>
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
            <line x1="11" y1="8" x2="11" y2="14" />
            <line x1="8" y1="11" x2="14" y2="11" />
          </>
        ),
        moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />,
        sun: (
          <>
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </>
        ),
        building: (
          <>
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2" />
            <path d="M9 22v-4h6v4" />
            <path d="M8 6h.01" />
            <path d="M16 6h.01" />
            <path d="M12 6h.01" />
            <path d="M12 10h.01" />
            <path d="M12 14h.01" />
            <path d="M16 10h.01" />
            <path d="M16 14h.01" />
            <path d="M8 10h.01" />
            <path d="M8 14h.01" />
          </>
        ),
        mapPin: (
          <>
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
            <circle cx="12" cy="10" r="3" />
          </>
        ),
        globe: (
          <>
            <circle cx="12" cy="12" r="10" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
          </>
        ),
        star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />,
        shieldAlert: (
          <>
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </>
        ),
        users: (
          <>
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </>
        ),
        fileText: (
          <>
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
          </>
        ),
        printer: (
          <>
            <polyline points="6 9 6 2 18 2 18 9" />
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
            <rect x="6" y="14" width="12" height="8" />
          </>
        ),
        copy: (
          <>
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </>
        ),
        check: <polyline points="20 6 9 17 4 12" />,
        lock: (
          <>
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </>
        ),
        logOut: (
          <>
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </>
        ),
        keyRound: (
          <>
            <path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z" />
            <circle cx="16.5" cy="7.5" r=".5" />
          </>
        ),
        delete: (
          <>
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" />
            <line x1="18" y1="9" x2="12" y2="15" />
            <line x1="12" y1="9" x2="18" y2="15" />
          </>
        ),
        refreshCw: (
          <>
            <polyline points="23 4 23 10 17 10" />
            <polyline points="1 20 1 14 7 14" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </>
        ),
        cloud: <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
      };

      return (
        <svg
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          {icons[name] || null}
        </svg>
      );
    };

    const SPECIALTY_CONFIG = {
      Vet: { label: 'Veterinarian', badge: 'bg-amber-500/15 text-amber-400 border-amber-500/30', icon: '🐾' },
      GP: { label: 'General Practitioner', badge: 'bg-blue-500/15 text-blue-400 border-blue-500/30', icon: '🩺' },
      Dentist: { label: 'Dentist', badge: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30', icon: '🦷' },
      Optometrist: { label: 'Optometrist', badge: 'bg-indigo-500/15 text-indigo-400 border-indigo-500/30', icon: '👓' },
      Physio: { label: 'Physiotherapist', badge: 'bg-purple-500/15 text-purple-400 border-purple-500/30', icon: '🏃' },
      Specialist: { label: 'Specialist', badge: 'bg-rose-500/15 text-rose-400 border-rose-500/30', icon: '🔬' }
    };

    // Helper to safely read/write localStorage
    const loadStorage = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    };

    const saveStorage = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.warn('Storage write warning:', e);
      }
    };

    // Copy helper compatible with iFrames
    const copyTextToClipboard = (text) => {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
      } catch (err) {
        console.warn('Copy failed:', err);
      }
      document.body.removeChild(textarea);
    };

    // =====================================================
    // MAIN APPLICATION COMPONENT
    // =====================================================
    function App() {
      const [theme, setTheme] = useState(() => loadStorage('care_theme', 'dark'));
      const [autoUpdatingToast, setAutoUpdatingToast] = useState(false);

      // Clean user, group, member, clinic, and appointment stores (no demo accounts)
      const [users, setUsers] = useState(() => loadStorage('care_users', []));
      const [familyGroups, setFamilyGroups] = useState(() => loadStorage('care_groups', []));
      const [currentUserId, setCurrentUserId] = useState(() => loadStorage('care_current_user_id', null));
      const [members, setMembers] = useState(() => loadStorage('care_members', []));
      const [clinics, setClinics] = useState(() => loadStorage('care_clinics', []));
      const [appointments, setAppointments] = useState(() => loadStorage('care_appointments', []));

      // Initialize a clean default session immediately if none exists so dashboard renders right away
      useEffect(() => {
        if (!currentUserId) {
          if (users.length > 0) {
            setCurrentUserId(users[0].id);
          } else {
            const defaultUser = {
              id: 'u_primary',
              name: 'My Family Account',
              email: 'family@caretracker.app',
              avatar: '👤',
              pin: '1234',
              familyGroupId: null
            };
            setUsers([defaultUser]);
            setCurrentUserId(defaultUser.id);
          }
        }
      }, []);

      const currentUser = useMemo(() => users.find(u => u.id === currentUserId) || null, [users, currentUserId]);

      // Persist changes to storage
      useEffect(() => saveStorage('care_theme', theme), [theme]);
      useEffect(() => saveStorage('care_users', users), [users]);
      useEffect(() => saveStorage('care_groups', familyGroups), [familyGroups]);
      useEffect(() => saveStorage('care_current_user_id', currentUserId), [currentUserId]);
      useEffect(() => saveStorage('care_members', members), [members]);
      useEffect(() => saveStorage('care_clinics', clinics), [clinics]);
      useEffect(() => saveStorage('care_appointments', appointments), [appointments]);

      // Navigation & filters
      const [activeTab, setActiveTab] = useState('appointments'); // 'appointments' | 'clinics' | 'summary' | 'members'
      const [selectedMemberId, setSelectedMemberId] = useState('all');
      const [statusFilter, setStatusFilter] = useState('All');
      const [specialtyFilter, setSpecialtyFilter] = useState('All');
      const [clinicCategoryFilter, setClinicCategoryFilter] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [preferredOnly, setPreferredOnly] = useState(false);
      const [copiedSummary, setCopiedSummary] = useState(false);

      // Modals & Editing states
      const [isApptModalOpen, setIsApptModalOpen] = useState(false);
      const [isClinicModalOpen, setIsClinicModalOpen] = useState(false);
      const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);
      const [isGroupModalOpen, setIsGroupModalOpen] = useState(false);

      const [editingAppt, setEditingAppt] = useState(null);
      const [editingClinic, setEditingClinic] = useState(null);
      const [editingMember, setEditingMember] = useState(null);

      const [lightboxImage, setLightboxImage] = useState(null);
      const [selectedApptDetail, setSelectedApptDetail] = useState(null);

      // Lock state
      const [isAppLocked, setIsAppLocked] = useState(false);

      // --- AUTO-UPDATE CHECK AFTER PIN UNLOCK ---
      const checkAndApplyAutoUpdate = async () => {
        try {
          const response = await fetch(`/?_build_check=${Date.now()}`, {
            method: 'HEAD',
            cache: 'no-store'
          });
          const signature = response.headers.get('etag') || response.headers.get('last-modified') || response.headers.get('x-nf-request-id');
          const savedSig = localStorage.getItem('care_deploy_signature');

          if (signature) {
            if (!savedSig) {
              localStorage.setItem('care_deploy_signature', signature);
            } else if (savedSig !== signature) {
              localStorage.setItem('care_deploy_signature', signature);
              setAutoUpdatingToast(true);
              if ('caches' in window) {
                const names = await window.caches.keys();
                await Promise.all(names.map(n => window.caches.delete(n)));
              }
              setTimeout(() => {
                window.location.reload(true);
              }, 950);
            }
          }
        } catch (err) {
          // Offline or standalone file environment
        }
      };

      // --- DYNAMIC SAFARI HOME SCREEN ICON (STETHOSCOPE ONLY) ---
      useEffect(() => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');
          if (ctx) {
            const gradient = ctx.createLinearGradient(0, 0, 512, 512);
            gradient.addColorStop(0, '#0f172a');
            gradient.addColorStop(1, '#020617');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);

            ctx.save();
            ctx.beginPath();
            ctx.arc(256, 256, 190, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(59, 130, 246, 0.18)';
            ctx.fill();
            ctx.lineWidth = 14;
            ctx.strokeStyle = '#3b82f6';
            ctx.stroke();
            ctx.restore();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '230px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
            ctx.fillText('🩺', 256, 260);

            const iconDataUrl = canvas.toDataURL('image/png');
            ['180x180', '192x192', '512x512'].forEach(size => {
              let link = document.querySelector(`link[rel="apple-touch-icon"][sizes="${size}"]`);
              if (!link) {
                link = document.createElement('link');
                link.rel = 'apple-touch-icon';
                link.setAttribute('sizes', size);
                document.head.appendChild(link);
              }
              link.href = iconDataUrl;
            });

            const metaTags = [
              { name: 'apple-mobile-web-app-capable', content: 'yes' },
              { name: 'apple-mobile-web-app-status-bar-style', content: 'black-translucent' },
              { name: 'apple-mobile-web-app-title', content: 'CareTracker' }
            ];
            metaTags.forEach(m => {
              let meta = document.querySelector(`meta[name="${m.name}"]`);
              if (!meta) {
                meta = document.createElement('meta');
                meta.name = m.name;
                document.head.appendChild(meta);
              }
              meta.content = m.content;
            });
          }
        } catch (err) {}
      }, []);

      const isDark = theme === 'dark';

      // Family Group & Data Isolation Logic
      const currentFamilyGroup = useMemo(() => {
        if (!currentUser || !currentUser.familyGroupId) return null;
        return familyGroups.find(g => g.id === currentUser.familyGroupId) || null;
      }, [currentUser, familyGroups]);

      const isAccessibleByCurrentUser = (item) => {
        if (!currentUser) return false;
        if (currentUser.familyGroupId) {
          return item.familyGroupId === currentUser.familyGroupId || item.createdBy === currentUser.id;
        }
        return item.createdBy === currentUser.id;
      };

      const userVisibleMembers = useMemo(() => members.filter(isAccessibleByCurrentUser), [members, currentUser]);
      const userVisibleClinics = useMemo(() => clinics.filter(isAccessibleByCurrentUser), [clinics, currentUser]);
      const userVisibleAppointments = useMemo(() => appointments.filter(isAccessibleByCurrentUser), [appointments, currentUser]);

      useEffect(() => {
        if (selectedMemberId !== 'all' && !userVisibleMembers.some(m => m.id === selectedMemberId)) {
          setSelectedMemberId('all');
        }
      }, [userVisibleMembers, selectedMemberId]);

      const filteredAppointments = useMemo(() => {
        return userVisibleAppointments.filter(appt => {
          if (selectedMemberId !== 'all' && String(appt.memberId) !== String(selectedMemberId)) return false;
          if (specialtyFilter !== 'All' && appt.providerType !== specialtyFilter) return false;
          if (statusFilter === 'Upcoming' && appt.status !== 'Upcoming') return false;
          if (statusFilter === 'Past' && appt.status !== 'Completed') return false;

          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            const match =
              appt.memberName?.toLowerCase().includes(q) ||
              appt.providerName?.toLowerCase().includes(q) ||
              appt.clinicName?.toLowerCase().includes(q) ||
              appt.reason?.toLowerCase().includes(q) ||
              appt.doctorAdvice?.toLowerCase().includes(q) ||
              appt.prescriptions?.toLowerCase().includes(q);
            if (!match) return false;
          }
          return true;
        }).sort((a, b) => new Date(b.dateTime).getTime() - new Date(a.dateTime).getTime());
      }, [userVisibleAppointments, selectedMemberId, specialtyFilter, statusFilter, searchQuery]);

      const filteredClinics = useMemo(() => {
        return userVisibleClinics.filter(c => {
          if (preferredOnly && !c.preferred) return false;
          if (clinicCategoryFilter !== 'All' && c.category !== clinicCategoryFilter) return false;
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            const match =
              c.name.toLowerCase().includes(q) ||
              c.address?.toLowerCase().includes(q) ||
              c.doctors?.some(d => d.toLowerCase().includes(q)) ||
              c.notes?.toLowerCase().includes(q);
            if (!match) return false;
          }
          return true;
        });
      }, [userVisibleClinics, preferredOnly, clinicCategoryFilter, searchQuery]);

      const togglePreferredClinic = (id) => {
        setClinics(prev => prev.map(c => c.id === id ? { ...c, preferred: !c.preferred } : c));
      };

      const deleteAppointment = (id) => {
        setAppointments(prev => prev.filter(a => a.id !== id));
        if (selectedApptDetail?.id === id) setSelectedApptDetail(null);
      };

      const deleteClinic = (id) => {
        setClinics(prev => prev.filter(c => c.id !== id));
      };

      const activeMemberObj = userVisibleMembers.find(m => m.id === selectedMemberId);

      // Auth Screen
      if (!currentUser) {
        return (
          <AuthScreen
            isDark={isDark}
            users={users}
            familyGroups={familyGroups}
            onLogin={(user) => {
              setCurrentUserId(user.id);
              setIsAppLocked(false);
            }}
            onCreateUser={(newUser, newGroup) => {
              setUsers(prev => [...prev, newUser]);
              if (newGroup) setFamilyGroups(prev => [...prev, newGroup]);
              setCurrentUserId(newUser.id);
              setIsAppLocked(false);
            }}
          />
        );
      }

      // 4-Digit PIN Lock Screen
      if (isAppLocked) {
        return (
          <PinLockScreen
            isDark={isDark}
            currentUser={currentUser}
            onUnlock={() => {
              setIsAppLocked(false);
              checkAndApplyAutoUpdate();
            }}
            onSwitchAccount={() => {
              setCurrentUserId(null);
              setIsAppLocked(false);
            }}
          />
        );
      }

      return (
        <div className={`min-h-screen transition-colors duration-200 select-none ${isDark ? 'bg-black text-zinc-100' : 'bg-slate-100 text-slate-900'}`}>
          
          {/* Auto-update banner notification */}
          {autoUpdatingToast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full bg-blue-600 text-white text-xs font-bold shadow-2xl flex items-center space-x-2">
              <Icon name="refreshCw" size={14} className="animate-spin" />
              <span>New deployment detected — updating app...</span>
            </div>
          )}

          {/* Top Glass Header */}
          <header className={`sticky top-0 z-30 backdrop-blur-xl border-b transition-colors no-print ${isDark ? 'bg-black/85 border-zinc-800/80' : 'bg-white/90 border-slate-200'}`}>
            <div className="max-w-xl mx-auto px-4 py-2.5 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <span className="p-2 rounded-2xl bg-blue-500/15 text-blue-500 font-bold text-lg">🩺</span>
                <div>
                  <div className="flex items-center gap-1.5">
                    <h1 className="text-base font-black tracking-tight leading-none">CareTracker</h1>
                    <Icon name="cloud" size={13} className="text-blue-400" />
                  </div>
                  <button
                    onClick={() => setIsGroupModalOpen(true)}
                    className={`text-[10px] mt-0.5 flex items-center gap-1 font-semibold hover:underline ${
                      currentFamilyGroup ? 'text-emerald-400' : 'text-amber-400'
                    }`}
                  >
                    {currentFamilyGroup ? (
                      <>
                        <Icon name="users" size={11} className="text-emerald-400" />
                        <span>{currentFamilyGroup.name}</span>
                      </>
                    ) : (
                      <>
                        <Icon name="lock" size={11} className="text-amber-400" />
                        <span>Private Mode (Tap to Share)</span>
                      </>
                    )}
                  </button>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                {/* User Profile & Settings Hub Button */}
                <button
                  onClick={() => setIsGroupModalOpen(true)}
                  className={`flex items-center space-x-1.5 px-2.5 py-1.5 rounded-full border text-xs font-semibold transition-all ${
                    isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-200 hover:border-zinc-600' : 'bg-slate-100 border-slate-300 text-slate-800'
                  }`}
                  title="Profile, PIN, Lock, Theme & Family Group"
                >
                  <span>{currentUser.avatar}</span>
                  <span className="max-w-[75px] truncate">{currentUser.name.split(' ')[0]}</span>
                </button>

                {/* Primary Contextual Action Button */}
                <button
                  onClick={() => {
                    if (activeTab === 'clinics') {
                      setEditingClinic(null);
                      setIsClinicModalOpen(true);
                    } else if (activeTab === 'members') {
                      setEditingMember(null);
                      setIsMemberModalOpen(true);
                    } else {
                      setEditingAppt(null);
                      setIsApptModalOpen(true);
                    }
                  }}
                  className="px-3.5 py-1.5 rounded-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold flex items-center space-x-1 shadow-sm active:scale-95 transition-transform"
                >
                  <Icon name="plus" size={14} />
                  <span>{activeTab === 'clinics' ? 'Add Clinic' : activeTab === 'members' ? 'Add Member' : 'Log Visit'}</span>
                </button>
              </div>
            </div>

            {/* Member Selector Bar (Hidden scrollbar, smooth touch swipe) */}
            {(activeTab === 'appointments' || activeTab === 'summary') && (
              <div className="max-w-xl mx-auto px-4 pb-3 overflow-x-auto no-scrollbar flex items-center space-x-2">
                <button
                  onClick={() => setSelectedMemberId('all')}
                  className={`px-3 py-1.5 rounded-full text-xs font-semibold shrink-0 border transition-all ${
                    selectedMemberId === 'all'
                      ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20'
                      : isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-300 hover:border-zinc-700' : 'bg-white border-slate-200 text-slate-700'
                  }`}
                >
                  👨‍👩‍👧‍👦 All ({userVisibleAppointments.length})
                </button>

                {userVisibleMembers.map(m => {
                  const count = userVisibleAppointments.filter(a => String(a.memberId) === String(m.id)).length;
                  const isSelected = selectedMemberId === m.id;
                  return (
                    <button
                      key={m.id}
                      onClick={() => setSelectedMemberId(m.id)}
                      className={`px-3 py-1.5 rounded-full text-xs font-semibold shrink-0 flex items-center space-x-1.5 border transition-all ${
                        isSelected
                          ? m.type === 'pet'
                            ? 'bg-amber-500 text-black border-amber-500 shadow-md shadow-amber-500/20'
                            : 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20'
                          : isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-300 hover:border-zinc-700' : 'bg-white border-slate-200 text-slate-700'
                      }`}
                    >
                      <span>{m.avatar}</span>
                      <span>{m.name}</span>
                      <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-bold ${
                        isSelected ? 'bg-black/20 text-white' : isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-200 text-slate-600'
                      }`}>
                        {count}
                      </span>
                    </button>
                  );
                })}
              </div>
            )}
          </header>

          {/* Main Container */}
          <main className="max-w-xl mx-auto px-4 pt-3 pb-28">
            {/* Selected Member Spotlight Banner */}
            {(activeTab === 'appointments' || activeTab === 'summary') && activeMemberObj && (
              <div className={`mb-3.5 p-3.5 rounded-2xl border transition-all ${
                activeMemberObj.type === 'pet'
                  ? isDark ? 'bg-amber-950/20 border-amber-900/40 text-amber-200' : 'bg-amber-50/80 border-amber-200 text-amber-950'
                  : isDark ? 'bg-zinc-900/90 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 shadow-sm text-slate-900'
              }`}>
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-3">
                    <div className="text-3xl p-1.5 rounded-xl bg-blue-500/10 shrink-0">{activeMemberObj.avatar}</div>
                    <div>
                      <div className="flex items-center space-x-2">
                        <h2 className="font-bold text-sm tracking-tight">{activeMemberObj.name}</h2>
                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                          activeMemberObj.type === 'pet'
                            ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40'
                            : 'bg-blue-500/20 text-blue-400 border border-blue-500/40'
                        }`}>
                          {activeMemberObj.type === 'pet' ? `🐾 ${activeMemberObj.species} • ${activeMemberObj.breed || 'Pet'}` : activeMemberObj.role}
                        </span>
                      </div>
                      <p className={`text-xs mt-0.5 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                        {activeMemberObj.type === 'pet'
                          ? `Microchip: ${activeMemberObj.microchip || 'N/A'}`
                          : `Blood Group: ${activeMemberObj.bloodType || 'Unknown'}`}
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center space-x-2">
                    {activeMemberObj.allergies?.length > 0 && (
                      <span className="text-[11px] px-2 py-1 rounded-lg bg-rose-500/15 text-rose-400 border border-rose-500/30 flex items-center space-x-1 font-semibold">
                        <Icon name="alertCircle" size={12} />
                        <span>{activeMemberObj.allergies.join(', ')}</span>
                      </span>
                    )}
                    <button
                      onClick={() => setSelectedMemberId('all')}
                      className={`text-[10px] px-2 py-1 rounded-lg border font-bold ${isDark ? 'bg-zinc-800 border-zinc-700 text-zinc-300' : 'bg-slate-200 border-slate-300 text-slate-700'}`}
                    >
                      All
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Search Input */}
            {(activeTab === 'appointments' || activeTab === 'clinics') && (
              <div className="relative mb-3 no-print">
                <span className={`absolute left-3.5 top-2.5 ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                  <Icon name="search" size={16} />
                </span>
                <input
                  type="text"
                  placeholder={activeTab === 'clinics' ? 'Search clinics, doctors, address, notes...' : 'Search doctor/vet, advice, prescriptions, reason...'}
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className={`w-full pl-9 pr-8 py-2.5 rounded-xl text-xs outline-none border transition-colors ${
                    isDark
                      ? 'bg-zinc-900 border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:border-blue-500'
                      : 'bg-white border-slate-200 text-slate-800 placeholder-slate-400 focus:border-blue-500 shadow-sm'
                  }`}
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="absolute right-3 top-2.5 text-zinc-500 hover:text-zinc-300">
                    <Icon name="x" size={14} />
                  </button>
                )}
              </div>
            )}

            {/* ===================================================== */}
            {/* TAB 1: VISITS FEED                                    */}
            {/* ===================================================== */}
            {activeTab === 'appointments' && (
              <div>
                <div className="flex items-center justify-between mb-3 overflow-x-auto no-scrollbar py-1 space-x-2">
                  <div className={`p-0.5 rounded-lg border flex items-center ${isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-slate-200 border-slate-300'}`}>
                    {['All', 'Upcoming', 'Past'].map(s => (
                      <button
                        key={s}
                        onClick={() => setStatusFilter(s)}
                        className={`px-2.5 py-1 text-[11px] font-semibold rounded-md transition-all ${
                          statusFilter === s
                            ? isDark ? 'bg-zinc-800 text-white' : 'bg-white text-slate-900 shadow-xs'
                            : isDark ? 'text-zinc-400 hover:text-zinc-200' : 'text-slate-600'
                        }`}
                      >
                        {s}
                      </button>
                    ))}
                  </div>

                  <div className="flex items-center space-x-1.5 shrink-0">
                    {['All', 'Vet', 'GP', 'Dentist', 'Optometrist'].map(sp => (
                      <button
                        key={sp}
                        onClick={() => setSpecialtyFilter(sp)}
                        className={`px-2 py-1 rounded-lg text-[10px] font-bold border transition-colors ${
                          specialtyFilter === sp
                            ? 'bg-blue-600 text-white border-blue-600'
                            : isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-400' : 'bg-white border-slate-200 text-slate-600'
                        }`}
                      >
                        {sp === 'Vet' ? '🐾 Vet' : sp}
                      </button>
                    ))}
                  </div>
                </div>

                {filteredAppointments.length === 0 ? (
                  <div className={`text-center py-14 rounded-2xl border ${isDark ? 'border-zinc-800/80 bg-zinc-900/30' : 'border-slate-200 bg-white'}`}>
                    <div className="flex justify-center mb-2 text-zinc-500">
                      <Icon name="calendar" size={36} />
                    </div>
                    <p className="text-sm font-bold">No visits recorded yet</p>
                    <p className={`text-xs mt-1 max-w-xs mx-auto ${isDark ? 'text-zinc-500' : 'text-slate-500'}`}>
                      {userVisibleMembers.length === 0
                        ? "Start by adding yourself, your family, or pets in the 'Family & Pets' tab, then tap 'Log Visit'."
                        : "Tap 'Log Visit' in the top right to record consult notes, diagnoses, and prescriptions."}
                    </p>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {filteredAppointments.map(appt => {
                      const member = userVisibleMembers.find(m => m.id === appt.memberId);
                      const isUpcoming = appt.status === 'Upcoming';
                      const dateObj = new Date(appt.dateTime);
                      const formattedDate = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                      const formattedTime = dateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

                      return (
                        <div
                          key={appt.id}
                          onClick={() => setSelectedApptDetail(appt)}
                          className={`p-4 rounded-2xl border transition-all cursor-pointer active:scale-[0.99] ${
                            isDark
                              ? 'bg-zinc-900/90 border-zinc-800 hover:border-zinc-700 hover:bg-zinc-900'
                              : 'bg-white border-slate-200 hover:border-slate-300 shadow-sm'
                          }`}
                        >
                          <div className="flex items-center justify-between mb-2">
                            <div className="flex items-center space-x-2">
                              <span className="text-base">{member?.avatar || '👤'}</span>
                              <span className="font-bold text-xs">{member?.name || appt.memberName}</span>
                              <span className={`text-[10px] px-2 py-0.5 rounded-full border font-semibold ${SPECIALTY_CONFIG[appt.providerType]?.badge || 'bg-zinc-800 text-zinc-300'}`}>
                                {SPECIALTY_CONFIG[appt.providerType]?.icon} {appt.providerType}
                              </span>
                            </div>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                              isUpcoming
                                ? 'bg-blue-500/15 text-blue-400 border border-blue-500/30'
                                : 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30'
                            }`}>
                              {appt.status}
                            </span>
                          </div>

                          <div className="flex items-baseline justify-between mb-1.5">
                            <h3 className="font-bold text-sm tracking-tight">{appt.providerName}</h3>
                            <div className={`text-[11px] flex items-center space-x-1 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                              <Icon name="clock" size={12} />
                              <span>{formattedDate} • {formattedTime}</span>
                            </div>
                          </div>

                          {appt.clinicName && (
                            <p className={`text-xs mb-2 flex items-center space-x-1 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                              <Icon name="building" size={13} className="shrink-0 text-blue-400" />
                              <span className="truncate">{appt.clinicName}</span>
                            </p>
                          )}

                          <div className={`mb-2 p-2 rounded-xl text-xs ${isDark ? 'bg-zinc-950/60 border border-zinc-800/60' : 'bg-slate-50 border border-slate-100'}`}>
                            <span className={`font-semibold block text-[10px] uppercase tracking-wider mb-0.5 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>Reason for Consult</span>
                            <p className={isDark ? 'text-zinc-200' : 'text-slate-800'}>{appt.reason}</p>
                          </div>

                          {appt.doctorAdvice && (
                            <div className="text-xs mb-2">
                              <span className="text-[10px] uppercase tracking-wider text-blue-400 font-bold block mb-0.5">What the Doctor / Vet Said</span>
                              <p className={`line-clamp-2 ${isDark ? 'text-zinc-300' : 'text-slate-600'}`}>{appt.doctorAdvice}</p>
                            </div>
                          )}

                          <div className="flex flex-wrap items-center gap-1.5 pt-2 border-t border-zinc-800/40 text-[10px]">
                            {appt.prescriptions && (
                              <span className={`px-2 py-0.5 rounded-md flex items-center space-x-1 font-medium ${isDark ? 'bg-purple-500/10 text-purple-400 border border-purple-500/20' : 'bg-purple-50 text-purple-700'}`}>
                                <span>💊</span>
                                <span className="truncate max-w-[140px]">{appt.prescriptions}</span>
                              </span>
                            )}
                            {appt.attachments?.length > 0 && (
                              <span className={`px-2 py-0.5 rounded-md flex items-center space-x-1 font-medium ${isDark ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-emerald-50 text-emerald-700'}`}>
                                <Icon name="image" size={11} />
                                <span>{appt.attachments.length} attachment{appt.attachments.length > 1 ? 's' : ''}</span>
                              </span>
                            )}
                            {appt.followUpNeeded && (
                              <span className={`px-2 py-0.5 rounded-md flex items-center space-x-1 font-medium ${isDark ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-amber-50 text-amber-700'}`}>
                                <Icon name="calendar" size={11} />
                                <span>Follow-up {appt.followUpDate ? `due ${appt.followUpDate}` : 'advised'}</span>
                              </span>
                            )}
                            <span className="ml-auto flex items-center text-blue-400 font-semibold pt-0.5">
                              Details <Icon name="chevronRight" size={13} />
                            </span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* ===================================================== */}
            {/* TAB 2: CLINICS & PRACTICES                            */}
            {/* ===================================================== */}
            {activeTab === 'clinics' && (
              <div>
                <div className="flex items-center justify-between mb-3 overflow-x-auto no-scrollbar py-1 space-x-2">
                  <button
                    onClick={() => setPreferredOnly(!preferredOnly)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold border flex items-center space-x-1 shrink-0 transition-all ${
                      preferredOnly
                        ? 'bg-amber-500 text-black border-amber-500'
                        : isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-300' : 'bg-white border-slate-200 text-slate-700'
                    }`}
                  >
                    <Icon name="star" size={13} className={preferredOnly ? 'fill-black' : ''} />
                    <span>Preferred Only</span>
                  </button>

                  <div className="flex items-center space-x-1.5 shrink-0">
                    {['All', 'Vet', 'GP', 'Dentist', 'Optometrist', 'Physio'].map(cat => (
                      <button
                        key={cat}
                        onClick={() => setClinicCategoryFilter(cat)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-bold border transition-colors ${
                          clinicCategoryFilter === cat
                            ? 'bg-blue-600 text-white border-blue-600'
                            : isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-400' : 'bg-white border-slate-200 text-slate-600'
                        }`}
                      >
                        {cat === 'Vet' ? '🐾 Vet' : cat}
                      </button>
                    ))}
                  </div>
                </div>

                {filteredClinics.length === 0 ? (
                  <div className={`text-center py-14 rounded-2xl border ${isDark ? 'border-zinc-800/80 bg-zinc-900/30' : 'border-slate-200 bg-white'}`}>
                    <div className="flex justify-center mb-2 text-zinc-500">
                      <Icon name="building" size={36} />
                    </div>
                    <p className="text-sm font-bold">No clinics saved yet</p>
                    <p className={`text-xs mt-1 ${isDark ? 'text-zinc-500' : 'text-slate-500'}`}>Tap 'Add Clinic' in the top right to save family doctors and vet practices.</p>
                  </div>
                ) : (
                  <div className="space-y-3.5">
                    {filteredClinics.map(clinic => (
                      <div key={clinic.id} className={`p-4 rounded-2xl border ${isDark ? 'bg-zinc-900/90 border-zinc-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                        <div className="flex items-start justify-between mb-2">
                          <div>
                            <div className="flex items-center space-x-2 mb-1">
                              <span className={`text-[10px] px-2 py-0.5 rounded-full border font-bold ${SPECIALTY_CONFIG[clinic.category]?.badge || 'bg-zinc-800 text-zinc-300'}`}>
                                {SPECIALTY_CONFIG[clinic.category]?.icon} {clinic.category}
                              </span>
                              {clinic.preferred && (
                                <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/30 flex items-center space-x-1 font-bold">
                                  <Icon name="star" size={10} className="fill-amber-400" />
                                  <span>Preferred</span>
                                </span>
                              )}
                            </div>
                            <h3 className="font-bold text-base tracking-tight">{clinic.name}</h3>
                          </div>

                          <div className="flex items-center space-x-1">
                            <button
                              onClick={() => togglePreferredClinic(clinic.id)}
                              className={`p-1.5 rounded-full ${clinic.preferred ? 'text-amber-400 bg-amber-500/10' : 'text-zinc-600'}`}
                              title="Toggle Preferred"
                            >
                              <Icon name="star" size={18} className={clinic.preferred ? 'fill-amber-400' : ''} />
                            </button>
                            <button
                              onClick={() => {
                                setEditingClinic(clinic);
                                setIsClinicModalOpen(true);
                              }}
                              className="p-1.5 rounded-full text-zinc-400 hover:text-blue-400 hover:bg-blue-500/10"
                              title="Edit Clinic"
                            >
                              <Icon name="edit" size={16} />
                            </button>
                            <button
                              onClick={() => deleteClinic(clinic.id)}
                              className="p-1.5 rounded-full text-zinc-600 hover:text-rose-400"
                              title="Delete Clinic"
                            >
                              <Icon name="trash2" size={16} />
                            </button>
                          </div>
                        </div>

                        <div className="space-y-1.5 mb-3 text-xs">
                          {clinic.address && (
                            <a
                              href={`https://maps.apple.com/?q=${encodeURIComponent(clinic.address)}`}
                              target="_blank"
                              rel="noreferrer"
                              className="flex items-start space-x-2 text-blue-400 hover:underline"
                            >
                              <Icon name="mapPin" size={14} className="shrink-0 mt-0.5" />
                              <span>{clinic.address}</span>
                            </a>
                          )}
                          {clinic.hours && (
                            <div className={`flex items-center space-x-2 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                              <Icon name="clock" size={14} className="shrink-0" />
                              <span>{clinic.hours}</span>
                            </div>
                          )}
                        </div>

                        {clinic.doctors?.length > 0 && (
                          <div className="mb-3">
                            <span className={`text-[10px] font-bold uppercase tracking-wider block mb-1 ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                              Known Doctors / Practitioners
                            </span>
                            <div className="flex flex-wrap gap-1.5">
                              {clinic.doctors.map((doc, idx) => (
                                <span
                                  key={idx}
                                  className={`text-[11px] px-2.5 py-0.5 rounded-lg border font-medium ${
                                    isDark ? 'bg-zinc-800/80 border-zinc-700/70 text-zinc-200' : 'bg-slate-100 border-slate-200 text-slate-700'
                                  }`}
                                >
                                  👨‍⚕️ {doc}
                                </span>
                              ))}
                            </div>
                          </div>
                        )}

                        {clinic.notes && (
                          <p className={`text-xs p-2.5 rounded-xl mb-3 ${isDark ? 'bg-zinc-950/70 border border-zinc-800 text-zinc-300' : 'bg-slate-50 text-slate-600'}`}>
                            ℹ️ {clinic.notes}
                          </p>
                        )}

                        <div className="pt-2 border-t border-zinc-800/50 flex flex-wrap gap-2">
                          {clinic.phone && (
                            <a
                              href={`tel:${clinic.phone}`}
                              className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center space-x-1.5"
                            >
                              <Icon name="phone" size={13} />
                              <span>Call {clinic.phone}</span>
                            </a>
                          )}

                          {clinic.emergencyPhone && (
                            <a
                              href={`tel:${clinic.emergencyPhone}`}
                              className="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold flex items-center space-x-1.5"
                            >
                              <Icon name="shieldAlert" size={13} />
                              <span>ER: {clinic.emergencyPhone}</span>
                            </a>
                          )}

                          {clinic.website && (
                            <a
                              href={clinic.website}
                              target="_blank"
                              rel="noreferrer"
                              className={`px-3 py-1.5 rounded-xl border text-xs font-medium flex items-center space-x-1 ${
                                isDark ? 'bg-zinc-800 border-zinc-700 text-zinc-200 hover:bg-zinc-700' : 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200'
                              }`}
                            >
                              <Icon name="globe" size={13} />
                              <span>Portal</span>
                            </a>
                          )}

                          <button
                            onClick={() => {
                              setEditingAppt({
                                clinicName: clinic.name,
                                clinicPhone: clinic.phone || '',
                                providerType: clinic.category || 'GP',
                                providerName: clinic.doctors?.[0] || ''
                              });
                              setIsApptModalOpen(true);
                            }}
                            className={`ml-auto px-3 py-1.5 rounded-xl text-xs font-bold border text-blue-400 ${
                              isDark ? 'bg-blue-500/10 border-blue-500/20' : 'bg-blue-50 border-blue-200'
                            }`}
                          >
                            + Log Visit Here
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ===================================================== */}
            {/* TAB 3: SUMMARY & MEDICAL DOSSIER                      */}
            {/* ===================================================== */}
            {activeTab === 'summary' && (
              <div className="space-y-4">
                <div className={`p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                  isDark ? 'bg-zinc-900/90 border-zinc-800' : 'bg-white border-slate-200 shadow-sm'
                }`}>
                  <div>
                    <h2 className="text-base font-bold flex items-center space-x-1.5">
                      <Icon name="fileText" size={16} className="text-blue-500" />
                      <span>Medical & Pet Health Summary</span>
                    </h2>
                    <p className={`text-xs mt-0.5 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                      {activeMemberObj ? `Clinical dossier for ${activeMemberObj.name}` : 'Comprehensive dossier for entire family & pets'}
                    </p>
                  </div>

                  <div className="flex items-center space-x-2 no-print">
                    <button
                      onClick={() => {
                        const targetName = activeMemberObj ? activeMemberObj.name : 'Entire Family';
                        const lines = [
                          `=== CARETRACKER HEALTH DOSSIER: ${targetName.toUpperCase()} ===`,
                          `Generated: ${new Date().toLocaleDateString()}`,
                          '',
                          `--- ACTIVE MEDICATIONS & PRESCRIPTIONS ---`,
                          ...filteredAppointments.filter(a => a.prescriptions).map(a => `• [${a.memberName}] ${a.prescriptions} (${a.providerName})`),
                          '',
                          `--- PENDING FOLLOW-UPS ---`,
                          ...filteredAppointments.filter(a => a.followUpNeeded).map(a => `• [${a.memberName}] Due ${a.followUpDate || 'TBD'} with ${a.providerName}`),
                          '',
                          `--- RECENT VISITS & ADVICE ---`,
                          ...filteredAppointments.map(a => `• ${new Date(a.dateTime).toLocaleDateString()} - ${a.memberName} @ ${a.providerName}: ${a.reason}. Advice: ${a.doctorAdvice || 'N/A'}`)
                        ];
                        copyTextToClipboard(lines.join('\n'));
                        setCopiedSummary(true);
                        setTimeout(() => setCopiedSummary(false), 2000);
                      }}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold border flex items-center space-x-1.5 transition-all ${
                        copiedSummary
                          ? 'bg-emerald-600 text-white border-emerald-600'
                          : isDark ? 'bg-zinc-800 border-zinc-700 text-zinc-200' : 'bg-slate-100 border-slate-300 text-slate-700'
                      }`}
                    >
                      <Icon name={copiedSummary ? 'check' : 'copy'} size={13} />
                      <span>{copiedSummary ? 'Copied!' : 'Copy Text'}</span>
                    </button>

                    <button
                      onClick={() => window.print()}
                      className="px-3.5 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold flex items-center space-x-1.5 shadow-sm"
                    >
                      <Icon name="printer" size={13} />
                      <span>Print / PDF</span>
                    </button>
                  </div>
                </div>

                {/* Metric Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                  <div className={`p-3 rounded-2xl border ${isDark ? 'bg-zinc-900/60 border-zinc-800' : 'bg-white border-slate-200'}`}>
                    <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>Total Visits</span>
                    <span className="text-xl font-black text-blue-500">{filteredAppointments.length}</span>
                  </div>
                  <div className={`p-3 rounded-2xl border ${isDark ? 'bg-zinc-900/60 border-zinc-800' : 'bg-white border-slate-200'}`}>
                    <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>Upcoming</span>
                    <span className="text-xl font-black text-amber-500">{filteredAppointments.filter(a => a.status === 'Upcoming').length}</span>
                  </div>
                  <div className={`p-3 rounded-2xl border ${isDark ? 'bg-zinc-900/60 border-zinc-800' : 'bg-white border-slate-200'}`}>
                    <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>Active Meds</span>
                    <span className="text-xl font-black text-purple-500">{filteredAppointments.filter(a => a.prescriptions).length}</span>
                  </div>
                  <div className={`p-3 rounded-2xl border ${isDark ? 'bg-zinc-900/60 border-zinc-800' : 'bg-white border-slate-200'}`}>
                    <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>Follow-ups</span>
                    <span className="text-xl font-black text-rose-500">{filteredAppointments.filter(a => a.followUpNeeded).length}</span>
                  </div>
                </div>

                {/* Active Prescriptions */}
                <div className={`p-4 rounded-2xl border ${isDark ? 'bg-zinc-900/90 border-zinc-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                  <h3 className="text-xs font-bold uppercase tracking-wider text-purple-400 mb-2">💊 Active Medications & Prescriptions</h3>
                  {filteredAppointments.filter(a => a.prescriptions).length === 0 ? (
                    <p className={`text-xs italic ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>No prescriptions logged yet.</p>
                  ) : (
                    <div className="space-y-2">
                      {filteredAppointments.filter(a => a.prescriptions).map((a, idx) => (
                        <div key={idx} className={`p-2.5 rounded-xl border text-xs flex justify-between items-center ${isDark ? 'bg-purple-950/20 border-purple-900/40 text-purple-200' : 'bg-purple-50 border-purple-200 text-purple-950'}`}>
                          <div>
                            <span className="font-bold block">{a.prescriptions}</span>
                            <span className="text-[10px] opacity-75">For {a.memberName} • {a.providerName}</span>
                          </div>
                          <span className="text-[10px] opacity-70">{new Date(a.dateTime).toLocaleDateString()}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Clinical Timeline */}
                <div className={`p-4 rounded-2xl border ${isDark ? 'bg-zinc-900/90 border-zinc-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                  <h3 className="text-xs font-bold uppercase tracking-wider text-blue-400 mb-2">🩺 Clinical Notes & Doctor Advice</h3>
                  {filteredAppointments.length === 0 ? (
                    <p className={`text-xs italic ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>No clinical records logged yet.</p>
                  ) : (
                    <div className="space-y-2.5">
                      {filteredAppointments.map(a => (
                        <div key={a.id} className={`p-3 rounded-xl border text-xs ${isDark ? 'bg-zinc-950/70 border-zinc-800 text-zinc-300' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                          <div className="flex justify-between items-center mb-1">
                            <span className="font-bold">{a.memberName} • {a.providerName} ({a.providerType})</span>
                            <span className="text-[10px] opacity-70">{new Date(a.dateTime).toLocaleDateString()}</span>
                          </div>
                          <p className="mb-1"><strong>Reason:</strong> {a.reason}</p>
                          {a.doctorAdvice && <p className="text-blue-400"><strong>Advice:</strong> {a.doctorAdvice}</p>}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ===================================================== */}
            {/* TAB 4: FAMILY & PETS DOSSIER                          */}
            {/* ===================================================== */}
            {activeTab === 'members' && (
              <div className="space-y-3">
                {userVisibleMembers.length === 0 ? (
                  <div className={`text-center py-14 rounded-2xl border ${isDark ? 'border-zinc-800/80 bg-zinc-900/30' : 'border-slate-200 bg-white'}`}>
                    <div className="flex justify-center mb-2 text-zinc-500">
                      <Icon name="users" size={36} />
                    </div>
                    <p className="text-sm font-bold">No members or pets added yet</p>
                    <p className={`text-xs mt-1 ${isDark ? 'text-zinc-500' : 'text-slate-500'}`}>Tap 'Add Member' in the top right to register family members and pets.</p>
                  </div>
                ) : (
                  userVisibleMembers.map(member => {
                    const memberAppts = userVisibleAppointments.filter(a => a.memberId === member.id);
                    const isPet = member.type === 'pet';

                    return (
                      <div key={member.id} className={`p-4 rounded-2xl border ${isDark ? 'bg-zinc-900/90 border-zinc-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                        <div className="flex items-start justify-between">
                          <div className="flex items-center space-x-3">
                            <div className="text-3xl p-2 rounded-2xl bg-blue-500/10 shrink-0">{member.avatar}</div>
                            <div>
                              <div className="flex items-center space-x-2">
                                <h3 className="font-bold text-base tracking-tight">{member.name}</h3>
                                <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                                  isPet ? 'bg-amber-500/15 text-amber-400 border border-amber-500/30' : 'bg-blue-500/15 text-blue-400 border border-blue-500/30'
                                }`}>
                                  {isPet ? '🐾 Pet' : 'Human'}
                                </span>
                              </div>
                              <p className={`text-xs mt-0.5 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                                {isPet
                                  ? `${member.species}${member.breed ? ` • ${member.breed}` : ''}${member.gender ? ` • ${member.gender}${member.isDesexed ? ' (Desexed)' : ''}` : ''}`
                                  : `${member.role}${member.dob ? ` • Born ${member.dob}` : ''}`}
                              </p>
                            </div>
                          </div>

                          <div className="flex items-center space-x-2">
                            <span className={`text-xs px-2.5 py-1 rounded-full font-bold ${isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-100 text-slate-700'}`}>
                              {memberAppts.length} visits
                            </span>
                            <button
                              onClick={() => {
                                setEditingMember(member);
                                setIsMemberModalOpen(true);
                              }}
                              className={`p-1.5 rounded-xl border transition-colors ${
                                isDark ? 'bg-zinc-800/80 border-zinc-700 text-zinc-300 hover:text-blue-400' : 'bg-slate-100 border-slate-200 text-slate-600 hover:text-blue-600'
                              }`}
                              title="Edit Member Profile"
                            >
                              <Icon name="edit" size={14} />
                            </button>
                          </div>
                        </div>

                        {/* Detailed Medical / Pet Attributes Grid */}
                        <div className={`mt-3 pt-3 border-t text-xs grid grid-cols-2 gap-2.5 ${isDark ? 'border-zinc-800 text-zinc-300' : 'border-slate-100 text-slate-600'}`}>
                          <div>
                            <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                              {isPet ? 'Microchip & Weight' : 'Blood Type'}
                            </span>
                            <p className="font-mono mt-0.5">
                              {isPet
                                ? `${member.microchip || 'No microchip'}${member.weight ? ` • ${member.weight}` : ''}`
                                : (member.bloodType || 'Unknown')}
                            </p>
                          </div>

                          <div>
                            <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                              Allergies & Warnings
                            </span>
                            <p className="mt-0.5 text-rose-400 font-bold">
                              {member.allergies?.length > 0 ? member.allergies.join(', ') : 'None registered'}
                            </p>
                          </div>

                          {member.insurancePolicy && (
                            <div>
                              <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                                {isPet ? 'Pet Insurance' : 'Medicare / Health ID'}
                              </span>
                              <p className="mt-0.5 font-medium truncate">{member.insurancePolicy}</p>
                            </div>
                          )}

                          {!isPet && member.emergencyContact && (
                            <div>
                              <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                                Emergency Contact
                              </span>
                              <p className="mt-0.5 font-medium truncate">
                                {member.emergencyContact}{member.emergencyPhone ? ` (${member.emergencyPhone})` : ''}
                              </p>
                            </div>
                          )}

                          {member.conditions && (
                            <div className="col-span-2">
                              <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                                Pre-Existing Conditions & Care Notes
                              </span>
                              <p className="mt-0.5">{member.conditions}</p>
                            </div>
                          )}
                        </div>

                        <div className="mt-3 pt-2 flex items-center justify-between">
                          <button
                            onClick={() => {
                              setSelectedMemberId(member.id);
                              setActiveTab('appointments');
                            }}
                            className="text-xs text-blue-400 hover:underline flex items-center space-x-1 font-semibold"
                          >
                            <span>View {member.name}'s visits</span>
                            <Icon name="chevronRight" size={13} />
                          </button>

                          <button
                            onClick={() => setMembers(prev => prev.filter(m => m.id !== member.id))}
                            className="text-[11px] text-zinc-500 hover:text-rose-400 flex items-center space-x-1"
                          >
                            <Icon name="trash2" size={12} />
                            <span>Remove</span>
                          </button>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            )}
          </main>

          {/* ===================================================== */}
          {/* MODALS & SUB-SCREENS                                  */}
          {/* ===================================================== */}
          {selectedApptDetail && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm">
              <div className={`w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 border shadow-2xl ${
                isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
              }`}>
                <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
                  <div className="flex items-center space-x-2.5">
                    <span className="text-2xl">{userVisibleMembers.find(m => m.id === selectedApptDetail.memberId)?.avatar || '👤'}</span>
                    <div>
                      <div className="flex items-center space-x-2">
                        <h2 className="text-base font-bold">{selectedApptDetail.memberName}'s Visit</h2>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                          selectedApptDetail.status === 'Upcoming'
                            ? 'bg-blue-500/15 text-blue-400 border border-blue-500/30'
                            : 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30'
                        }`}>
                          {selectedApptDetail.status}
                        </span>
                      </div>
                      <p className={`text-[11px] ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                        {new Date(selectedApptDetail.dateTime).toLocaleString('en-US', { dateStyle: 'full', timeStyle: 'short' })}
                      </p>
                    </div>
                  </div>
                  <button onClick={() => setSelectedApptDetail(null)} className={`p-1.5 rounded-full ${isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-100 text-slate-500'}`}>
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="space-y-3.5 py-4 text-xs">
                  {/* Provider & Clinic Block */}
                  <div className={`p-3 rounded-2xl border flex items-center justify-between ${isDark ? 'bg-zinc-950/70 border-zinc-800' : 'bg-slate-50 border-slate-200'}`}>
                    <div>
                      <span className={`inline-block text-[10px] px-2 py-0.5 rounded-full border font-bold mb-1 ${SPECIALTY_CONFIG[selectedApptDetail.providerType]?.badge || 'bg-zinc-800 text-zinc-300'}`}>
                        {SPECIALTY_CONFIG[selectedApptDetail.providerType]?.icon} {selectedApptDetail.providerType}
                      </span>
                      <h3 className="font-bold text-sm">{selectedApptDetail.providerName}</h3>
                      {selectedApptDetail.clinicName && (
                        <p className={`mt-0.5 flex items-center space-x-1 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                          <Icon name="building" size={12} className="text-blue-400 shrink-0" />
                          <span>{selectedApptDetail.clinicName}</span>
                        </p>
                      )}
                    </div>
                    {selectedApptDetail.clinicPhone && (
                      <a
                        href={`tel:${selectedApptDetail.clinicPhone}`}
                        className="px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold flex items-center space-x-1.5 shrink-0"
                      >
                        <Icon name="phone" size={14} />
                        <span>Call</span>
                      </a>
                    )}
                  </div>

                  {/* Reason for Consultation */}
                  <div>
                    <span className={`block text-[10px] uppercase font-bold tracking-wider mb-1 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                      Reason for Consultation
                    </span>
                    <div className={`p-3 rounded-xl border ${isDark ? 'bg-zinc-950/50 border-zinc-800' : 'bg-slate-50 border-slate-200'}`}>
                      <p className="leading-relaxed">{selectedApptDetail.reason}</p>
                    </div>
                  </div>

                  {/* Doctor / Vet Advice */}
                  <div>
                    <span className="block text-[10px] uppercase font-bold tracking-wider text-blue-400 mb-1">
                      What the Doctor / Vet Said (Advice & Findings)
                    </span>
                    <div className={`p-3 rounded-xl border ${isDark ? 'bg-blue-950/20 border-blue-800/30 text-blue-100' : 'bg-blue-50 border-blue-200 text-blue-900'}`}>
                      <p className="whitespace-pre-line leading-relaxed">{selectedApptDetail.doctorAdvice || 'No advice notes recorded.'}</p>
                    </div>
                  </div>

                  {/* Prescriptions & Medications */}
                  {selectedApptDetail.prescriptions && (
                    <div>
                      <span className="block text-[10px] uppercase font-bold tracking-wider text-purple-400 mb-1">
                        Prescriptions & Medications Given
                      </span>
                      <div className={`p-3 rounded-xl border ${isDark ? 'bg-purple-950/20 border-purple-800/30 text-purple-200' : 'bg-purple-50 border-purple-200 text-purple-900'}`}>
                        <p className="font-semibold">💊 {selectedApptDetail.prescriptions}</p>
                      </div>
                    </div>
                  )}

                  {/* Follow-up Reminder */}
                  {selectedApptDetail.followUpNeeded && (
                    <div>
                      <span className="block text-[10px] uppercase font-bold tracking-wider text-amber-400 mb-1">
                        Follow-up / Review Scheduled
                      </span>
                      <div className={`p-3 rounded-xl border flex items-center justify-between ${isDark ? 'bg-amber-950/20 border-amber-800/40 text-amber-200' : 'bg-amber-50 border-amber-200 text-amber-900'}`}>
                        <span className="font-semibold">Follow-up Review Required</span>
                        <span className="font-bold px-2.5 py-0.5 rounded-lg bg-amber-500/20 border border-amber-500/30">
                          {selectedApptDetail.followUpDate || 'Date TBD'}
                        </span>
                      </div>
                    </div>
                  )}

                  {/* Attachments */}
                  {selectedApptDetail.attachments?.length > 0 && (
                    <div>
                      <span className={`block text-[10px] uppercase font-bold tracking-wider mb-1.5 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                        Attached Documents & Screenshots ({selectedApptDetail.attachments.length})
                      </span>
                      <div className="grid grid-cols-2 gap-2.5">
                        {selectedApptDetail.attachments.map((att, idx) => (
                          <div
                            key={idx}
                            onClick={() => setLightboxImage(att.url)}
                            className={`group relative rounded-xl overflow-hidden border cursor-pointer ${isDark ? 'border-zinc-700' : 'border-slate-300'}`}
                          >
