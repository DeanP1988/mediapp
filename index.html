                <label className="block font-bold mb-1">For who?</label>
                <div className="grid grid-cols-2 gap-2">
                  {members.map(m => (
                    <button
                      type="button"
                      key={m.id}
                      onClick={() => setMemberId(m.id)}
                      className={`p-2 rounded-xl border flex items-center space-x-2 text-left ${
                        memberId === m.id ? 'bg-blue-600 text-white border-blue-600' : 'bg-zinc-950 border-zinc-800 text-zinc-300'
                      }`}
                    >
                      <span className="text-lg">{m.avatar}</span>
                      <span className="font-bold text-xs truncate">{m.name}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold mb-1">Specialty</label>
                  <select
                    value={providerType}
                    onChange={(e) => setProviderType(e.target.value)}
                    className="w-full p-2.5 rounded-xl border border-zinc-800 bg-zinc-950 text-zinc-200 outline-none"
                  >
                    <option value="GP">🩺 GP</option>
                    <option value="Vet">🐾 Vet</option>
                    <option value="Dentist">🦷 Dentist</option>
                    <option value="Optometrist">👓 Optometrist</option>
                    <option value="Physio">🏃 Physio</option>
                  </select>
                </div>
                <div>
                  <label className="block font-bold mb-1">Date</label>
                  <input
                    type="date"
                    value={selectedDate}
                    onChange={(e) => setSelectedDate(e.target.value)}
                    className="w-full p-2 rounded-xl border border-zinc-800 bg-zinc-950 text-zinc-200 outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="block font-bold mb-1">Doctor / Vet Name</label>
                <input
                  type="text"
                  placeholder="e.g. Dr. Arthur Miller"
                  value={providerName}
                  onChange={(e) => setProviderName(e.target.value)}
                  className="w-full p-2.5 rounded-xl border border-zinc-800 bg-zinc-950 text-zinc-200 outline-none"
                />
              </div>

              <div>
                <label className="block font-bold mb-1">Reason for Visit *</label>
                <textarea
                  rows={2}
                  value={reason}
                  onChange={(e) => setReason(e.target.value)}
                  className="w-full p-2.5 rounded-xl border border-zinc-800 bg-zinc-950 text-zinc-200 outline-none"
                />
              </div>

              <div>
                <label className="block font-bold text-blue-400 mb-1">What the Doctor / Vet Said</label>
                <textarea
                  rows={2}
                  value={doctorAdvice}
                  onChange={(e) => setDoctorAdvice(e.target.value)}
                  className="w-full p-2.5 rounded-xl border border-blue-900/50 bg-blue-950/20 text-blue-100 outline-none"
                />
              </div>

              <div className="flex items-center space-x-2 pt-1">
                <input
                  type="checkbox"
                  id="fu"
                  checked={followUpNeeded}
                  onChange={(e) => setFollowUpNeeded(e.target.checked)}
                />
                <label htmlFor="fu" className="font-bold">Follow-up needed?</label>
              </div>

              {followUpNeeded && (
                <div className="p-3 rounded-2xl border border-amber-800/40 bg-amber-950/20 space-y-2">
                  <div className="flex gap-1">
                    {[
                      { l: '+1W', d: 7 },
                      { l: '+1M', d: 30 },
                      { l: '+6M', d: 180 },
                      { l: '+1Y', d: 365 }
                    ].map(p => (
                      <button
                        type="button"
                        key={p.l}
                        onClick={() => handlePreset(p.d)}
                        className="px-2 py-1 rounded bg-zinc-900 border border-zinc-700 text-amber-300 font-bold"
                      >
                        {p.l}
                      </button>
                    ))}
                  </div>
                  <input
                    type="date"
                    value={followUpDate}
                    onChange={(e) => setFollowUpDate(e.target.value)}
                    className="w-full p-2 rounded-xl border border-zinc-800 bg-zinc-950 text-zinc-200"
                  />
                </div>
              )}

              <div className="pt-3 border-t border-zinc-800 flex justify-end space-x-2">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl font-bold bg-zinc-800 text-zinc-300">
                  Cancel
                </button>
                <button type="submit" className="px-5 py-2 rounded-xl font-bold bg-blue-600 text-white">
                  Save Visit
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // CREATE CLINIC MODAL
    // ==========================================
    function CreateClinicModal({ isDark, currentUser, onClose, onSave }) {
      const [name, setName] = useState('');
      const [category, setCategory] = useState('GP');
      const [phone, setPhone] = useState('');
      const [address, setAddress] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSave({
          id: 'c_' + Date.now(),
          name,
          category,
          phone,
          address,
          preferred: true,
          createdBy: currentUser.id,
          familyGroupId: currentUser.familyGroupId || null
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm">
          <div className="w-full max-w-lg p-5 rounded-3xl border border-zinc-700 bg-zinc-900 text-zinc-100">
            <h2 className="font-bold text-base mb-3">Add Clinic</h2>
            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <input
                type="text"
                placeholder="Clinic Name"
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="w-full p-2.5 rounded-xl border border-zinc-800 bg-zinc-950 text-zinc-200"
              />
              <input
                type="tel"
                placeholder="Phone Number"
                value={phone}
                onChange={(e) => setPhone(e.target.value)}
                className="w-full p-2.5 rounded-xl border border-zinc-800 bg-zinc-950 text-zinc-200"
              />
              <input
                type="text"
                placeholder="Street Address"
                value={address}
                onChange={(e) => setAddress(e.target.value)}
                className="w-full p-2.5 rounded-xl border border-zinc-800 bg-zinc-950 text-zinc-200"
              />
              <div className="flex justify-end space-x-2 pt-2">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-zinc-800">Cancel</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-blue-600 text-white font-bold">Save Clinic</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // CREATE MEMBER MODAL
    // ==========================================
    function CreateMemberModal({ isDark, currentUser, onClose, onSave }) {
      const [type, setType] = useState('human');
      const [name, setName] = useState('');
      const [avatar, setAvatar] = useState('🧒');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSave({
          id: 'm_' + Date.now(),
          name,
          type,
          role: type === 'human' ? 'Family' : 'Pet',
          avatar,
          createdBy: currentUser.id,
          familyGroupId: currentUser.familyGroupId || null
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm">
          <div className="w-full max-w-md p-5 rounded-3xl border border-zinc-700 bg-zinc-900 text-zinc-100">
            <h2 className="font-bold text-base mb-3">Add Family Member or Pet</h2>
            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div className="grid grid-cols-2 gap-2">
                <button
                  type="button"
                  onClick={() => { setType('human'); setAvatar('🧒'); }}
                  className={`p-2 rounded-xl border ${type === 'human' ? 'bg-blue-600 text-white border-blue-600' : 'bg-zinc-950 border-zinc-800'}`}
                >
                  👤 Human
                </button>
                <button
                  type="button"
                  onClick={() => { setType('pet'); setAvatar('🐶'); }}
                  className={`p-2 rounded-xl border ${type === 'pet' ? 'bg-amber-500 text-black border-amber-500' : 'bg-zinc-950 border-zinc-800'}`}
                >
                  🐾 Pet
                </button>
              </div>
              <input
                type="text"
                placeholder="Name"
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="w-full p-2.5 rounded-xl border border-zinc-800 bg-zinc-950 text-zinc-200"
              />
              <div className="flex justify-end space-x-2 pt-2">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-zinc-800">Cancel</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-blue-600 text-white font-bold">Add</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // FAMILY GROUP MODAL
    // ==========================================
    function FamilyGroupModal({
      isDark,
      theme,
      onToggleTheme,
      onLockApp,
      currentUser,
      currentGroup,
      familyGroups,
      allUsers,
      onClose,
      onSwitchUser,
      onSignOut,
      onUpdatePin,
      onUpdateGroupName,
      onCreateGroup,
      onJoinGroup,
      onLeaveGroup
    }) {
      const [activeSubTab, setActiveSubTab] = useState('group'); // 'group' | 'security' | 'switch'
      const [inputCode, setInputCode] = useState('');
      const [newGroupName, setNewGroupName] = useState('');
      const [isEditingGroupName, setIsEditingGroupName] = useState(false);
      const [editGroupNameValue, setEditGroupNameValue] = useState(currentGroup?.name || '');
      const [statusMessage, setStatusMessage] = useState(null);
      const [copiedCode, setCopiedCode] = useState(false);

      // Keep edit input in sync when group changes
      useEffect(() => {
        if (currentGroup) {
          setEditGroupNameValue(currentGroup.name);
        }
      }, [currentGroup]);

      // Security PIN update state
      const [currentPinInput, setCurrentPinInput] = useState('');
      const [newPinInput, setNewPinInput] = useState('');
      const [confirmNewPinInput, setConfirmNewPinInput] = useState('');

      const groupMembers = useMemo(() => {
        if (!currentGroup) return [];
        return allUsers.filter(u => u.familyGroupId === currentGroup.id);
      }, [allUsers, currentGroup]);

      const handlePinChangeSubmit = (e) => {
        e.preventDefault();
        setStatusMessage(null);

        const actualPin = currentUser.pin;
        if (currentPinInput !== actualPin) {
          setStatusMessage({ type: 'error', text: 'Current PIN is incorrect.' });
          return;
        }

        if (!newPinInput || newPinInput.length !== 4 || !/^\d{4}$/.test(newPinInput)) {
          setStatusMessage({ type: 'error', text: 'New PIN must be exactly 4 digits.' });
          return;
        }

        if (newPinInput !== confirmNewPinInput) {
          setStatusMessage({ type: 'error', text: 'New PINs do not match.' });
          return;
        }

        onUpdatePin(newPinInput);
        setStatusMessage({ type: 'success', text: 'Security PIN successfully updated!' });
        setCurrentPinInput('');
        setNewPinInput('');
        setConfirmNewPinInput('');
      };

      const handleJoin = (e) => {
        e.preventDefault();
        if (!inputCode.trim()) return;
        const res = onJoinGroup(inputCode);
        if (!res.success) {
          setStatusMessage({ type: 'error', text: res.message });
        } else {
          setStatusMessage({ type: 'success', text: `Successfully joined ${res.groupName}!` });
          setInputCode('');
        }
      };

      const handleCreate = (e) => {
        e.preventDefault();
        if (!newGroupName.trim()) return;
        const code = (currentUser.name.slice(0, 3) + Math.floor(1000 + Math.random() * 9000)).toUpperCase();
        onCreateGroup(newGroupName, code);
        setStatusMessage({ type: 'success', text: `Created ${newGroupName} with invite code: ${code}` });
        setNewGroupName('');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm">
          <div className={`w-full max-w-md max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 border shadow-2xl ${
            isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
          }`}>
            <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
              <div className="flex items-center space-x-2">
                <span className="text-2xl">{currentUser.avatar}</span>
                <div>
                  <h2 className="font-bold text-base">{currentUser.name}</h2>
                  <p className={`text-[11px] ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>{currentUser.email}</p>
                </div>
              </div>
              <button onClick={onClose} className={`p-1.5 rounded-full ${isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-100 text-slate-500'}`}>
                <Icon name="x" size={17} />
              </button>
            </div>

            {/* Quick Actions Bar: Lock App & Theme Toggle */}
            <div className={`my-3 p-2.5 rounded-2xl border flex items-center justify-between ${
              isDark ? 'bg-zinc-950/70 border-zinc-800' : 'bg-slate-50 border-slate-200'
            }`}>
              <button
                type="button"
                onClick={onLockApp}
                className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all ${
                  isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-200 hover:text-white hover:bg-zinc-800' : 'bg-white border-slate-300 text-slate-800 hover:bg-slate-100 shadow-xs'
                }`}
              >
                <Icon name="lock" size={14} className="text-blue-500" />
                <span>Lock App Now</span>
              </button>

              <button
                type="button"
                onClick={onToggleTheme}
                className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all ${
                  isDark ? 'bg-zinc-900 border-zinc-700 text-yellow-400 hover:bg-zinc-800' : 'bg-white border-slate-300 text-slate-800 hover:bg-slate-100 shadow-xs'
                }`}
              >
                <Icon name={isDark ? "sun" : "moon"} size={14} />
                <span>{isDark ? 'Light Mode' : 'Dark Mode'}</span>
              </button>
            </div>

            {/* Sub-tabs: Group Settings vs PIN Security vs Switch User */}
            <div className="flex items-center space-x-1.5 my-3">
              <button
                onClick={() => { setActiveSubTab('group'); setStatusMessage(null); }}
                className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all ${
                  activeSubTab === 'group'
                    ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                    : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-100 border-slate-200 text-slate-700'
                }`}
              >
                Family Group
              </button>
              <button
                onClick={() => { setActiveSubTab('security'); setStatusMessage(null); }}
                className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1 ${
                  activeSubTab === 'security'
                    ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                    : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-100 border-slate-200 text-slate-700'
                }`}
              >
                <Icon name="lock" size={12} />
                <span>PIN Code</span>
              </button>
              <button
                onClick={() => { setActiveSubTab('switch'); setStatusMessage(null); }}
                className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition-all ${
                  activeSubTab === 'switch'
                    ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                    : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-slate-100 border-slate-200 text-slate-700'
                }`}
              >
                Accounts ({allUsers.length})
              </button>
            </div>

            {statusMessage && (
              <div className={`p-2.5 rounded-xl text-xs mb-3 flex items-center space-x-1.5 ${
                statusMessage.type === 'error' ? 'bg-rose-500/15 text-rose-400 border border-rose-500/30' : 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30'
              }`}>
                <Icon name="alertCircle" size={13} className="shrink-0" />
                <span>{statusMessage.text}</span>
              </div>
            )}

            {/* TAB A: FAMILY GROUP */}
            {activeSubTab === 'group' && (
              <div className="space-y-4 text-xs">
                {currentGroup ? (
                  <div className={`p-4 rounded-2xl border ${isDark ? 'bg-zinc-950/70 border-zinc-800' : 'bg-slate-50 border-slate-200'}`}>
                    <div className="flex items-start justify-between">
                      <div className="flex-1 mr-2">
                        <span className="text-[10px] uppercase font-bold text-emerald-400 tracking-wider">Active Group</span>
                        {isEditingGroupName ? (
                          <div className="mt-1.5 flex items-center space-x-1.5">
                            <input
                              type="text"
                              value={editGroupNameValue}
                              onChange={(e) => setEditGroupNameValue(e.target.value)}
                              placeholder="Family Group Name"
                              className={`flex-1 p-1.5 rounded-lg border text-xs font-bold outline-none ${
                                isDark ? 'bg-zinc-900 border-zinc-700 text-white' : 'bg-white border-slate-300 text-slate-800'
                              }`}
                            />
                            <button
                              type="button"
                              onClick={() => {
                                if (!editGroupNameValue.trim()) return;
                                onUpdateGroupName(currentGroup.id, editGroupNameValue.trim());
                                setIsEditingGroupName(false);
                                setStatusMessage({ type: 'success', text: 'Family group name updated!' });
                              }}
                              className="px-2.5 py-1.5 rounded-lg bg-blue-600 text-white font-bold text-[11px]"
                            >
                              Save
                            </button>
                            <button
                              type="button"
                              onClick={() => {
                                setEditGroupNameValue(currentGroup.name);
                                setIsEditingGroupName(false);
                              }}
                              className={`px-2 py-1.5 rounded-lg font-bold text-[11px] ${
                                isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-200 text-slate-700'
                              }`}
                            >
                              Cancel
                            </button>
                          </div>
                        ) : (
                          <div className="flex items-center space-x-2 mt-0.5">
                            <h3 className="font-bold text-sm tracking-tight">{currentGroup.name}</h3>
                            <button
                              type="button"
                              onClick={() => {
                                setEditGroupNameValue(currentGroup.name);
                                setIsEditingGroupName(true);
                              }}
                              className={`p-1 rounded-md transition-colors ${
                                isDark ? 'text-zinc-400 hover:text-white hover:bg-zinc-800' : 'text-slate-500 hover:text-slate-900 hover:bg-slate-200'
                              }`}
                              title="Edit Family Group Name"
                            >
                              <Icon name="edit" size={12} />
                            </button>
                          </div>
                        )}
                      </div>
                      <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 font-bold shrink-0">
                        Connected
                      </span>
                    </div>

                    {/* Invite Code Box */}
                    <div className={`mt-3 p-3 rounded-xl border flex items-center justify-between ${
                      isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-slate-200'
                    }`}>
                      <div>
                        <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                          Shareable Invite Code
                        </span>
                        <span className="font-mono text-base font-black tracking-widest text-blue-400">
                          {currentGroup.inviteCode}
                        </span>
                      </div>
                      <button
                        onClick={() => {
                          const textArea = document.createElement("textarea");
                          textArea.value = currentGroup.inviteCode;
                          document.body.appendChild(textArea);
                          textArea.select();
                          document.execCommand("copy");
                          document.body.removeChild(textArea);
                          setCopiedCode(true);
                          setTimeout(() => setCopiedCode(false), 2000);
                        }}
                        className={`px-3 py-1.5 rounded-xl font-bold flex items-center space-x-1 text-xs border ${
                          copiedCode
                            ? 'bg-emerald-600 text-white border-emerald-600'
                            : isDark ? 'bg-zinc-800 border-zinc-700 text-zinc-200' : 'bg-slate-100 border-slate-200 text-slate-700'
                        }`}
                      >
                        <Icon name={copiedCode ? "check" : "copy"} size={13} />
                        <span>{copiedCode ? 'Copied' : 'Copy'}</span>
                      </button>
                    </div>

                    {/* Users in Group */}
                    <div className="mt-3">
                      <span className={`block text-[10px] font-bold uppercase tracking-wider mb-1.5 ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                        Active Members in this Group ({groupMembers.length})
                      </span>
                      <div className="space-y-1.5">
                        {groupMembers.map(u => (
                          <div key={u.id} className="flex items-center justify-between py-1">
                            <div className="flex items-center space-x-2">
                              <span>{u.avatar}</span>
                              <span className="font-semibold">{u.name}</span>
                              {u.id === currentUser.id && (
                                <span className="text-[10px] text-blue-400 font-bold">(You)</span>
                              )}
                            </div>
                            <span className={`text-[10px] ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>{u.email}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="mt-4 pt-3 border-t border-zinc-800 flex justify-end">
                      <button
                        type="button"
                        onClick={() => {
                          onLeaveGroup();
                        }}
                        className="text-xs font-bold text-rose-400 hover:underline"
                      >
                        Leave Family Group
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className={`p-3 rounded-2xl border ${isDark ? 'bg-zinc-950/70 border-zinc-800' : 'bg-slate-50 border-slate-200'}`}>
                      <h3 className="font-bold text-xs mb-1">You are in Private Solo Mode</h3>
                      <p className={`text-[11px] leading-relaxed ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                        You only see records you personally entered. To sync and share with your partner, children, or caregivers, join their group or create one below.
                      </p>
                    </div>

                    {/* Join Existing Group */}
                    <form onSubmit={handleJoin} className={`p-3 rounded-2xl border space-y-2 ${isDark ? 'bg-zinc-950/70 border-zinc-800' : 'bg-slate-50 border-slate-200'}`}>
                      <label className="block font-bold text-xs text-blue-400">Join with Family Invite Code</label>
                      <div className="flex items-center space-x-2">
                        <input
                          type="text"
                          placeholder="e.g. MILLER77"
                          value={inputCode}
                          onChange={(e) => setInputCode(e.target.value.toUpperCase())}
                          className={`flex-1 p-2 rounded-xl border outline-none font-mono uppercase font-bold text-xs ${
                            isDark ? 'bg-zinc-900 border-zinc-700 text-white' : 'bg-white border-slate-200 text-slate-800'
                          }`}
                        />
                        <button
                          type="submit"
                          className="px-4 py-2 rounded-xl font-bold bg-blue-600 text-white text-xs hover:bg-blue-500"
                        >
                          Join
                        </button>
                      </div>
                    </form>

                    {/* Create New Group */}
                    <form onSubmit={handleCreate} className={`p-3 rounded-2xl border space-y-2 ${isDark ? 'bg-zinc-950/70 border-zinc-800' : 'bg-slate-50 border-slate-200'}`}>
                      <label className="block font-bold text-xs text-emerald-400">Create a New Family Group</label>
                      <div className="flex items-center space-x-2">
                        <input
                          type="text"
                          placeholder="e.g. The Smith Family"
                          value={newGroupName}
                          onChange={(e) => setNewGroupName(e.target.value)}
                          className={`flex-1 p-2 rounded-xl border outline-none font-bold text-xs ${
                            isDark ? 'bg-zinc-900 border-zinc-700 text-white' : 'bg-white border-slate-200 text-slate-800'
                          }`}
                        />
                        <button
                          type="submit"
                          className="px-4 py-2 rounded-xl font-bold bg-emerald-600 text-white text-xs hover:bg-emerald-500"
                        >
                          Create
                        </button>
                      </div>
                    </form>
                  </div>
                )}
              </div>
            )}

            {/* TAB B: SECURITY & PIN MANAGEMENT */}
            {activeSubTab === 'security' && (
              <form onSubmit={handlePinChangeSubmit} className="space-y-3.5 text-xs">
                <div className={`p-3 rounded-2xl border ${isDark ? 'bg-zinc-950/60 border-zinc-800 text-zinc-300' : 'bg-blue-50/70 border-blue-200 text-blue-900'}`}>
                  <div className="flex items-center space-x-2 mb-1">
                    <Icon name="lock" size={15} className="text-blue-500" />
                    <span className="font-bold">4-Digit Security Passcode</span>
                  </div>
                  <p className={`text-[11px] leading-relaxed ${isDark ? 'text-zinc-400' : 'text-slate-600'}`}>
                    This PIN protects your medical diary whenever the app is launched from your iPhone home screen.
                  </p>
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Current 4-Digit PIN</label>
                  <input
                    type="password"
                    maxLength={4}
                    placeholder="••••"
                    value={currentPinInput}
                    onChange={(e) => setCurrentPinInput(e.target.value.replace(/\D/g, ''))}
                    className={`w-full p-2.5 rounded-xl border font-mono text-center tracking-widest text-base font-bold outline-none ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
                    }`}
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>New PIN</label>
                    <input
                      type="password"
                      maxLength={4}
                      placeholder="••••"
                      value={newPinInput}
                      onChange={(e) => setNewPinInput(e.target.value.replace(/\D/g, ''))}
                      className={`w-full p-2.5 rounded-xl border font-mono text-center tracking-widest text-base font-bold outline-none ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
                      }`}
                    />
                  </div>

                  <div>
                    <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Confirm New PIN</label>
                    <input
                      type="password"
                      maxLength={4}
                      placeholder="••••"
                      value={confirmNewPinInput}
                      onChange={(e) => setConfirmNewPinInput(e.target.value.replace(/\D/g, ''))}
                      className={`w-full p-2.5 rounded-xl border font-mono text-center tracking-widest text-base font-bold outline-none ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
                      }`}
                    />
                  </div>
                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    type="submit"
                    className="px-5 py-2 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-500 shadow-md"
                  >
                    Update Passcode
                  </button>
                </div>
              </form>
            )}

            {/* TAB C: SWITCH USER */}
            {activeSubTab === 'switch' && (
              <div className="space-y-2 text-xs">
                <span className={`block text-[10px] font-bold uppercase tracking-wider mb-1 ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                  Select account on this device:
                </span>
                {allUsers.length === 0 ? (
                  <p className={`p-3 text-center ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>No other accounts found.</p>
                ) : (
                  allUsers.map(u => {
                    const grp = familyGroups.find(g => g.id === u.familyGroupId);
                    const isSelected = u.id === currentUser.id;
                    return (
                      <button
                        key={u.id}
                        onClick={() => onSwitchUser(u)}
                        className={`w-full p-2.5 rounded-xl border flex items-center justify-between text-left transition-all ${
                          isSelected
                            ? 'bg-blue-600 text-white border-blue-600'
                            : isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-300 hover:border-zinc-700' : 'bg-slate-50 border-slate-200 text-slate-700 hover:border-slate-300'
                        }`}
                      >
                        <div className="flex items-center space-x-2.5">
                          <span className="text-xl">{u.avatar}</span>
                          <div>
                            <span className="font-bold block">{u.name}</span>
                            <span className={`text-[10px] ${isSelected ? 'text-blue-100' : isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                              {grp ? grp.name : 'Solo (Private)'}
                            </span>
                          </div>
                        </div>
                        {isSelected && <Icon name="check" size={16} />}
                      </button>
                    );
                  })
                )}
              </div>
            )}

            <div className="mt-5 pt-3 border-t border-zinc-800 flex items-center justify-between">
              <button
                onClick={onSignOut}
                className="px-3 py-1.5 rounded-xl font-bold text-xs text-rose-400 hover:bg-rose-500/10 flex items-center space-x-1"
              >
                <span>Sign Out</span>
              </button>

              <button
                onClick={onClose}
                className="px-5 py-2 rounded-xl font-bold bg-blue-600 text-white text-xs hover:bg-blue-500"
              >
                Done
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
