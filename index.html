<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CareTracker - Family & Pet Health</title>
  
  <!-- Apple iOS Web App & Touch Setup -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CareTracker">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (Compiles JSX directly in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- iOS Dynamic App Icon & PWA Manifest Generator -->
  <script>
    (function generateAppleTouchIcon() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        if (ctx) {
          // Dark sleek iOS background surface
          const bgGrad = ctx.createLinearGradient(0, 0, 512, 512);
          bgGrad.addColorStop(0, '#0f172a');
          bgGrad.addColorStop(1, '#020617');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, 512, 512);

          // Blue glowing squircle badge matching header logo
          const x = 56, y = 56, w = 400, h = 400, r = 100;
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();

          ctx.fillStyle = 'rgba(59, 130, 246, 0.22)';
          ctx.fill();
          ctx.lineWidth = 14;
          ctx.strokeStyle = '#3b82f6';
          ctx.stroke();

          // Render centered 🩺 Stethoscope emoji
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = '240px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
          ctx.fillText('🩺', 256, 256);

          const iconUrl = canvas.toDataURL('image/png');

          // Inject into apple-touch-icon links for iOS
          ['180x180', '192x192', '512x512'].forEach(sz => {
            let link = document.querySelector(`link[rel="apple-touch-icon"][sizes="${sz}"]`);
            if (!link) {
              link = document.createElement('link');
              link.rel = 'apple-touch-icon';
              link.setAttribute('sizes', sz);
              document.head.appendChild(link);
            }
            link.href = iconUrl;
          });

          let defLink = document.querySelector('link[rel="apple-touch-icon"]:not([sizes])');
          if (!defLink) {
            defLink = document.createElement('link');
            defLink.rel = 'apple-touch-icon';
            document.head.appendChild(defLink);
          }
          defLink.href = iconUrl;

          // Standard Favicon
          let fav = document.querySelector('link[rel="icon"]');
          if (!fav) {
            fav = document.createElement('link');
            fav.rel = 'icon';
            fav.type = 'image/png';
            document.head.appendChild(fav);
          }
          fav.href = iconUrl;

          // Standalone Web Manifest
          const manifestBlob = new Blob([JSON.stringify({
            name: 'CareTracker - Family & Pet Health',
            short_name: 'CareTracker',
            start_url: '.',
            display: 'standalone',
            background_color: '#000000',
            theme_color: '#000000',
            icons: [{ src: iconUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
          })], { type: 'application/json' });

          let manLink = document.querySelector('link[rel="manifest"]');
          if (!manLink) {
            manLink = document.createElement('link');
            manLink.rel = 'manifest';
            document.head.appendChild(manLink);
          }
          manLink.href = URL.createObjectURL(manifestBlob);
        }
      } catch (err) {
        console.warn('Could not inject iOS Home Screen icon:', err);
      }
    })();
  </script>

  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-black text-zinc-100 antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INLINE SVG ICONS (Replaces external npm icon packages) ---
    const Icon = ({ name, size = 16, className = "" }) => {
      const icons = {
        calendar: <path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />,
        clock: <><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></>,
        user: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>,
        plus: <><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></>,
        search: <><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></>,
        image: <><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><circle cx="8.5" cy="8.5" r="1.5" /><polyline points="21 15 16 10 5 21" /></>,
        chevronRight: <polyline points="9 18 15 12 9 6" />,
        chevronLeft: <polyline points="15 18 9 12 15 6" />,
        x: <><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>,
        phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />,
        alertCircle: <><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></>,
        trash2: <><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></>,
        zoomIn: <><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="11" y1="8" x2="11" y2="14" /><line x1="8" y1="11" x2="14" y2="11" /></>,
        moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />,
        sun: <><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></>,
        building: <><rect x="4" y="2" width="16" height="20" rx="2" ry="2" /><path d="M9 22v-4h6v4" /><path d="M8 6h.01" /><path d="M16 6h.01" /><path d="M8 10h.01" /><path d="M16 10h.01" /><path d="M8 14h.01" /><path d="M16 14h.01" /></>,
        mapPin: <><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" /></>,
        globe: <><circle cx="12" cy="12" r="10" /><line x1="2" y1="12" x2="22" y2="12" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></>,
        star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />,
        users: <><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></>,
        edit: <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" /></>,
        fileText: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></>,
        printer: <><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></>,
        copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></>,
        check: <polyline points="20 6 9 17 4 12" />,
        lock: <><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></>,
        cloud: <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" />,
        downloadCloud: <><polyline points="8 17 12 21 16 17" /><line x1="12" y1="12" x2="12" y2="21" /><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29" /></>,
        refreshCw: <><polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></>,
        delete: <><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" /><line x1="18" y1="9" x2="12" y2="15" /><line x1="12" y1="9" x2="18" y2="15" /></>,
        shieldAlert: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></>,
        keyRound: <><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z" /><circle cx="16.5" cy="7.5" r=".5" /></>,
        sparkles: <><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></>
      };

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          {icons[name] || null}
        </svg>
      );
    };

    // --- INITIAL SEED DATA ---
    const INITIAL_USERS = [];
    const INITIAL_GROUPS = [];
    const INITIAL_MEMBERS = [];
    const INITIAL_CLINICS = [];
    const INITIAL_APPOINTMENTS = [];

    const SPECIALTY_CONFIG = {
      Vet: { label: 'Veterinarian', badge: 'bg-amber-500/15 text-amber-400 border-amber-500/30', icon: '🐾' },
      GP: { label: 'General Practitioner', badge: 'bg-blue-500/15 text-blue-400 border-blue-500/30', icon: '🩺' },
      Dentist: { label: 'Dentist', badge: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30', icon: '🦷' },
      Optometrist: { label: 'Optometrist', badge: 'bg-indigo-500/15 text-indigo-400 border-indigo-500/30', icon: '👓' },
      Physio: { label: 'Physiotherapist', badge: 'bg-purple-500/15 text-purple-400 border-purple-500/30', icon: '🏃' },
      Specialist: { label: 'Specialist', badge: 'bg-rose-500/15 text-rose-400 border-rose-500/30', icon: '🔬' }
    };

    function App() {
      const [theme, setTheme] = useState('dark');
      const [users, setUsers] = useState(() => {
        const saved = JSON.parse(localStorage.getItem('care_users'));
        if (saved && saved.length > 0) return saved;
        // Default initial profile to view dashboard directly
        const defaultUser = { id: 'u_primary', name: 'My Profile', email: 'user@example.com', avatar: '👤', pin: '1234', familyGroupId: null };
        localStorage.setItem('care_users', JSON.stringify([defaultUser]));
        return [defaultUser];
      });
      const [familyGroups, setFamilyGroups] = useState(() => JSON.parse(localStorage.getItem('care_groups')) || INITIAL_GROUPS);
      
      // Auto-load user profile so preview shows dashboard directly
      const [currentUser, setCurrentUser] = useState(() => {
        const savedUserId = localStorage.getItem('care_current_user_id');
        const allSavedUsers = JSON.parse(localStorage.getItem('care_users'));
        if (savedUserId && allSavedUsers) {
          const matched = allSavedUsers.find(u => u.id === savedUserId);
          if (matched) return matched;
        }
        return { id: 'u_primary', name: 'My Profile', email: 'user@example.com', avatar: '👤', pin: '1234', familyGroupId: null };
      });
      const [members, setMembers] = useState(() => JSON.parse(localStorage.getItem('care_members')) || INITIAL_MEMBERS);
      const [clinics, setClinics] = useState(() => JSON.parse(localStorage.getItem('care_clinics')) || INITIAL_CLINICS);
      const [appointments, setAppointments] = useState(() => JSON.parse(localStorage.getItem('care_appointments')) || INITIAL_APPOINTMENTS);

      const [activeTab, setActiveTab] = useState('appointments');
      const [selectedMemberId, setSelectedMemberId] = useState('all');
      const [statusFilter, setStatusFilter] = useState('All');
      const [specialtyFilter, setSpecialtyFilter] = useState('All');
      const [clinicCategoryFilter, setClinicCategoryFilter] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [preferredOnly, setPreferredOnly] = useState(false);
      const [copiedSummary, setCopiedSummary] = useState(false);

      const [isApptModalOpen, setIsApptModalOpen] = useState(false);
      const [isClinicModalOpen, setIsClinicModalOpen] = useState(false);
      const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);
      const [isGroupModalOpen, setIsGroupModalOpen] = useState(false);
      const [lightboxImage, setLightboxImage] = useState(null);
      const [selectedApptDetail, setSelectedApptDetail] = useState(null);
      const [isAppLocked, setIsAppLocked] = useState(false);
      const [isAutoUpdating, setIsAutoUpdating] = useState(false);

      // Persistence to LocalStorage
      useEffect(() => localStorage.setItem('care_users', JSON.stringify(users)), [users]);
      useEffect(() => localStorage.setItem('care_groups', JSON.stringify(familyGroups)), [familyGroups]);
      useEffect(() => localStorage.setItem('care_members', JSON.stringify(members)), [members]);
      useEffect(() => localStorage.setItem('care_clinics', JSON.stringify(clinics)), [clinics]);
      useEffect(() => localStorage.setItem('care_appointments', JSON.stringify(appointments)), [appointments]);
      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('care_current_user_id', currentUser.id);
        } else {
          localStorage.removeItem('care_current_user_id');
        }
      }, [currentUser]);

      const isDark = theme === 'dark';

      const currentFamilyGroup = useMemo(() => {
        if (!currentUser || !currentUser.familyGroupId) return null;
        return familyGroups.find(g => g.id === currentUser.familyGroupId) || null;
      }, [currentUser, familyGroups]);

      const isAccessibleByCurrentUser = (item) => {
        if (!currentUser) return false;
        if (currentUser.familyGroupId) {
          return item.familyGroupId === currentUser.familyGroupId || item.createdBy === currentUser.id;
        }
        return item.createdBy === currentUser.id;
      };

      const userVisibleMembers = useMemo(() => members.filter(isAccessibleByCurrentUser), [members, currentUser]);
      const userVisibleClinics = useMemo(() => clinics.filter(isAccessibleByCurrentUser), [clinics, currentUser]);
      const userVisibleAppointments = useMemo(() => appointments.filter(isAccessibleByCurrentUser), [appointments, currentUser]);

      useEffect(() => {
        if (selectedMemberId !== 'all') {
          const stillVisible = userVisibleMembers.some(m => m.id === selectedMemberId);
          if (!stillVisible) setSelectedMemberId('all');
        }
      }, [userVisibleMembers, selectedMemberId]);

      const filteredAppointments = useMemo(() => {
        return userVisibleAppointments.filter(appt => {
          if (selectedMemberId !== 'all' && String(appt.memberId) !== String(selectedMemberId)) return false;
          if (specialtyFilter !== 'All' && appt.providerType !== specialtyFilter) return false;
          if (statusFilter === 'Upcoming' && appt.status !== 'Upcoming') return false;
          if (statusFilter === 'Past' && appt.status !== 'Completed') return false;

          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            const match =
              appt.memberName?.toLowerCase().includes(q) ||
              appt.providerName?.toLowerCase().includes(q) ||
              appt.clinicName?.toLowerCase().includes(q) ||
              appt.reason?.toLowerCase().includes(q) ||
              appt.doctorAdvice?.toLowerCase().includes(q) ||
              appt.prescriptions?.toLowerCase().includes(q);
            if (!match) return false;
          }
          return true;
        }).sort((a, b) => new Date(b.dateTime).getTime() - new Date(a.dateTime).getTime());
      }, [userVisibleAppointments, selectedMemberId, specialtyFilter, statusFilter, searchQuery]);

      const filteredClinics = useMemo(() => {
        return userVisibleClinics.filter(c => {
          if (preferredOnly && !c.preferred) return false;
          if (clinicCategoryFilter !== 'All' && c.category !== clinicCategoryFilter) return false;
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            const match =
              c.name.toLowerCase().includes(q) ||
              c.address.toLowerCase().includes(q) ||
              c.doctors?.some(d => d.toLowerCase().includes(q)) ||
              c.notes?.toLowerCase().includes(q);
            if (!match) return false;
          }
          return true;
        });
      }, [userVisibleClinics, preferredOnly, clinicCategoryFilter, searchQuery]);

      const togglePreferredClinic = (id) => {
        setClinics(prev => prev.map(c => c.id === id ? { ...c, preferred: !c.preferred } : c));
      };

      const deleteAppointment = (id) => {
        setAppointments(prev => prev.filter(a => a.id !== id));
        if (selectedApptDetail?.id === id) setSelectedApptDetail(null);
      };

      const deleteClinic = (id) => {
        setClinics(prev => prev.filter(c => c.id !== id));
      };

      // Auto-update checker triggered after PIN unlock
      const checkAndApplyAutoUpdate = async () => {
        try {
          const res = await fetch(`/?_build_check=${Date.now()}`, {
            method: 'HEAD',
            cache: 'no-store'
          });

          const currentSignature = res.headers.get('etag') || res.headers.get('last-modified') || res.headers.get('x-nf-request-id') || res.headers.get('cf-ray');
          const storedSignature = localStorage.getItem('care_app_build_sig');

          if (currentSignature) {
            if (!storedSignature) {
              // Store initial signature on first load
              localStorage.setItem('care_app_build_sig', currentSignature);
            } else if (storedSignature !== currentSignature) {
              // New GitHub deployment detected! Trigger seamless auto-refresh
              setIsAutoUpdating(true);
              localStorage.setItem('care_app_build_sig', currentSignature);

              // Clear service worker caches if present
              if ('caches' in window) {
                try {
                  const cacheNames = await window.caches.keys();
                  await Promise.all(cacheNames.map(k => window.caches.delete(k)));
                } catch (e) {
                  console.warn('Cache clearing error:', e);
                }
              }

              // Short delay to display update badge then reload
              setTimeout(() => {
                window.location.reload(true);
              }, 1200);
              return;
            }
          }
        } catch (err) {
          // If offline or request skipped, continue safely without interrupting user
          console.log('Update check completed or offline:', err);
        }
      };

      const handleSuccessfulUnlock = () => {
        setIsAppLocked(false);
        // Automatically check for new GitHub / repository deployment upon unlock
        checkAndApplyAutoUpdate();
      };

      const activeMemberObj = userVisibleMembers.find(m => m.id === selectedMemberId);

      if (!currentUser) {
        return (
          <AuthScreen
            isDark={isDark}
            users={users}
            familyGroups={familyGroups}
            onLogin={(user) => {
              setCurrentUser(user);
              setIsAppLocked(true);
            }}
            onCreateUser={(newUser, newGroup) => {
              setUsers(prev => [...prev, newUser]);
              if (newGroup) setFamilyGroups(prev => [...prev, newGroup]);
              setCurrentUser(newUser);
              setIsAppLocked(false);
            }}
          />
        );
      }

      if (isAppLocked) {
        return (
          <PinLockScreen
            isDark={isDark}
            currentUser={currentUser}
            onUnlock={handleSuccessfulUnlock}
            onSwitchAccount={() => {
              setCurrentUser(null);
              setIsAppLocked(true);
            }}
          />
        );
      }

      return (
        <div className={`min-h-screen font-sans transition-colors duration-200 select-none ${isDark ? 'bg-black text-zinc-100' : 'bg-slate-100 text-slate-900'}`}>
          {/* Auto-Updating Banner Toast */}
          {isAutoUpdating && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-blue-600 text-white shadow-2xl flex items-center space-x-2.5 text-xs font-bold border border-blue-400/40 animate-pulse">
              <Icon name="refreshCw" size={15} className="animate-spin" />
              <span>New deployment detected — updating app to latest version...</span>
            </div>
          )}

          {/* Header */}
          <header className={`sticky top-0 z-30 backdrop-blur-xl border-b transition-colors ${isDark ? 'bg-black/85 border-zinc-800/80' : 'bg-white/90 border-slate-200'}`}>
            <div className="max-w-xl mx-auto px-4 py-2.5 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <span className="p-2 rounded-2xl bg-blue-500/15 text-blue-500 font-bold text-lg">🩺</span>
                <div>
                  <div className="flex items-center gap-1.5">
                    <h1 className="text-base font-black tracking-tight leading-none flex items-center gap-1.5">
                      CareTracker
                    </h1>
                  </div>
                  <button
                    onClick={() => setIsGroupModalOpen(true)}
                    className={`text-[10px] mt-0.5 flex items-center gap-1 font-semibold hover:underline ${
                      currentFamilyGroup ? 'text-emerald-400' : 'text-zinc-400'
                    }`}
                  >
                    {currentFamilyGroup ? (
                      <>
                        <Icon name="users" size={11} className="text-emerald-400" />
                        <span>{currentFamilyGroup.name}</span>
                      </>
                    ) : (
                      <>
                        <Icon name="lock" size={11} className="text-amber-400" />
                        <span className="text-amber-400">Private Mode (Tap to Join)</span>
                      </>
                    )}
                  </button>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setIsGroupModalOpen(true)}
                  className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-full border text-xs font-semibold ${
                    isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-200 hover:border-zinc-500' : 'bg-slate-100 border-slate-300 text-slate-800 hover:border-slate-400'
                  }`}
                >
                  <span>{currentUser.avatar}</span>
                  <span className="max-w-[80px] truncate">{currentUser.name.split(' ')[0]}</span>
                </button>

                <button
                  onClick={() => {
                    if (activeTab === 'clinics') setIsClinicModalOpen(true);
                    else if (activeTab === 'members') setIsMemberModalOpen(true);
                    else setIsApptModalOpen(true);
                  }}
                  className="px-3.5 py-1.5 rounded-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold flex items-center space-x-1 shadow-sm active:scale-95 transition-transform"
                >
                  <Icon name="plus" size={14} />
                  <span>{activeTab === 'clinics' ? 'Add Clinic' : activeTab === 'members' ? 'Add Member' : 'Log Visit'}</span>
                </button>
              </div>
            </div>

            {/* Member Selector Bar */}
            {(activeTab === 'appointments' || activeTab === 'summary') && (
              <div className="max-w-xl mx-auto px-4 pb-3 overflow-x-auto no-scrollbar flex items-center space-x-2">
                <button
                  onClick={() => setSelectedMemberId('all')}
                  className={`px-3 py-1.5 rounded-full text-xs font-semibold shrink-0 border transition-all ${
                    selectedMemberId === 'all'
                      ? 'bg-blue-600 text-white border-blue-600 shadow-md'
                      : isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-300' : 'bg-white border-slate-200 text-slate-700'
                  }`}
                >
                  👨‍👩‍👧‍👦 All ({userVisibleAppointments.length})
                </button>

                {userVisibleMembers.map(m => {
                  const count = userVisibleAppointments.filter(a => String(a.memberId) === String(m.id)).length;
                  const isSelected = selectedMemberId === m.id;
                  return (
                    <button
                      key={m.id}
                      onClick={() => setSelectedMemberId(m.id)}
                      className={`px-3 py-1.5 rounded-full text-xs font-semibold shrink-0 flex items-center space-x-1.5 border transition-all ${
                        isSelected
                          ? m.type === 'pet'
                            ? 'bg-amber-500 text-black border-amber-500 shadow-md'
                            : 'bg-blue-600 text-white border-blue-600 shadow-md'
                          : isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-300' : 'bg-white border-slate-200 text-slate-700'
                      }`}
                    >
                      <span>{m.avatar}</span>
                      <span>{m.name}</span>
                      <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-bold ${
                        isSelected ? 'bg-black/20 text-white' : isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-slate-200 text-slate-600'
                      }`}>
                        {count}
                      </span>
                    </button>
                  );
                })}
              </div>
            )}
          </header>

          {/* Main Area */}
          <main className="max-w-xl mx-auto px-4 pt-3 pb-28">
            {/* Member Card Spotlight */}
            {(activeTab === 'appointments' || activeTab === 'summary') && activeMemberObj && (
              <div className={`mb-3.5 p-3.5 rounded-2xl border ${
                activeMemberObj.type === 'pet'
                  ? isDark ? 'bg-amber-950/20 border-amber-900/40 text-amber-200' : 'bg-amber-50 border-amber-200 text-amber-950'
                  : isDark ? 'bg-zinc-900/90 border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 shadow-sm text-slate-900'
              }`}>
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-3">
                    <div className="text-3xl p-1.5 rounded-xl bg-blue-500/10 shrink-0">{activeMemberObj.avatar}</div>
                    <div>
                      <div className="flex items-center space-x-2">
                        <h2 className="font-bold text-sm tracking-tight">{activeMemberObj.name}</h2>
                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                          activeMemberObj.type === 'pet' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40' : 'bg-blue-500/20 text-blue-400 border border-blue-500/40'
                        }`}>
                          {activeMemberObj.type === 'pet' ? `🐾 ${activeMemberObj.species} • ${activeMemberObj.breed}` : activeMemberObj.role}
                        </span>
                      </div>
                      <p className={`text-xs mt-0.5 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                        {activeMemberObj.type === 'pet' ? `Microchip: ${activeMemberObj.microchip || 'N/A'}` : `Blood: ${activeMemberObj.bloodType || 'Unknown'}`}
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setSelectedMemberId('all')}
                    className={`text-[10px] px-2 py-1 rounded-lg border font-bold ${isDark ? 'bg-zinc-800 border-zinc-700 text-zinc-300' : 'bg-slate-200 border-slate-300 text-slate-700'}`}
                  >
                    View All
                  </button>
                </div>
              </div>
            )}

            {/* Search Bar */}
            {(activeTab === 'appointments' || activeTab === 'clinics') && (
              <div className="relative mb-3">
                <span className={`absolute left-3.5 top-3 ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                  <Icon name="search" size={16} />
                </span>
                <input
                  type="text"
                  placeholder={activeTab === 'clinics' ? "Search clinics, doctors, address..." : "Search doctor, reason, advice, medicine..."}
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className={`w-full pl-9 pr-8 py-2.5 rounded-xl text-xs outline-none border transition-colors ${
                    isDark
                      ? 'bg-zinc-900 border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:border-blue-500'
                      : 'bg-white border-slate-200 text-slate-800 placeholder-slate-400 focus:border-blue-500 shadow-sm'
                  }`}
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="absolute right-3 top-3 text-zinc-500">
                    <Icon name="x" size={14} />
                  </button>
                )}
              </div>
            )}

            {/* Tab: Visits */}
            {activeTab === 'appointments' && (
              <div>
                <div className="flex items-center justify-between mb-3 overflow-x-auto no-scrollbar py-1 space-x-2">
                  <div className={`p-0.5 rounded-lg border flex items-center ${isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-slate-200 border-slate-300'}`}>
                    {['All', 'Upcoming', 'Past'].map(s => (
                      <button
                        key={s}
                        onClick={() => setStatusFilter(s)}
                        className={`px-2.5 py-1 text-[11px] font-semibold rounded-md transition-all ${
                          statusFilter === s
                            ? isDark ? 'bg-zinc-800 text-white shadow-xs' : 'bg-white text-slate-900 shadow-xs'
                            : isDark ? 'text-zinc-400' : 'text-slate-600'
                        }`}
                      >
                        {s}
                      </button>
                    ))}
                  </div>

                  <div className="flex items-center space-x-1.5 shrink-0">
                    {['All', 'Vet', 'GP', 'Dentist', 'Optometrist'].map(sp => (
                      <button
                        key={sp}
                        onClick={() => setSpecialtyFilter(sp)}
                        className={`px-2 py-1 rounded-lg text-[10px] font-bold border ${
                          specialtyFilter === sp
                            ? 'bg-blue-600 text-white border-blue-600'
                            : isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-400' : 'bg-white border-slate-200 text-slate-600'
                        }`}
                      >
                        {sp === 'Vet' ? '🐾 Vet' : sp}
                      </button>
                    ))}
                  </div>
                </div>

                {filteredAppointments.length === 0 ? (
                  <div className={`text-center py-14 rounded-2xl border ${isDark ? 'border-zinc-800 bg-zinc-900/30' : 'border-slate-200 bg-white'}`}>
                    <span className="mx-auto block text-zinc-600 mb-2"><Icon name="calendar" size={36} className="mx-auto" /></span>
                    <p className="text-sm font-bold">No appointments found</p>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {filteredAppointments.map(appt => {
                      const member = userVisibleMembers.find(m => m.id === appt.memberId);
                      const isUpcoming = appt.status === 'Upcoming';
                      const dateObj = new Date(appt.dateTime);
                      const formattedDate = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                      const formattedTime = dateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

                      return (
                        <div
                          key={appt.id}
                          onClick={() => setSelectedApptDetail(appt)}
                          className={`p-4 rounded-2xl border cursor-pointer active:scale-[0.99] transition-all ${
                            isDark ? 'bg-zinc-900/90 border-zinc-800 hover:border-zinc-700' : 'bg-white border-slate-200 shadow-sm'
                          }`}
                        >
                          <div className="flex items-center justify-between mb-2">
                            <div className="flex items-center space-x-2">
                              <span>{member?.avatar || '👤'}</span>
                              <span className="font-bold text-xs">{member?.name || appt.memberName}</span>
                              <span className={`text-[10px] px-2 py-0.5 rounded-full border font-semibold ${SPECIALTY_CONFIG[appt.providerType]?.badge || 'bg-zinc-800 text-zinc-300'}`}>
                                {SPECIALTY_CONFIG[appt.providerType]?.icon} {appt.providerType}
                              </span>
                            </div>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                              isUpcoming ? 'bg-blue-500/15 text-blue-400 border border-blue-500/30' : 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30'
                            }`}>
                              {appt.status}
                            </span>
                          </div>

                          <div className="flex items-baseline justify-between mb-1.5">
                            <h3 className="font-bold text-sm tracking-tight">{appt.providerName}</h3>
                            <div className={`text-[11px] flex items-center space-x-1 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                              <Icon name="clock" size={12} />
                              <span>{formattedDate} • {formattedTime}</span>
                            </div>
                          </div>

                          {appt.clinicName && (
                            <p className={`text-xs mb-2 flex items-center space-x-1 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                              <Icon name="building" size={13} className="text-blue-400 shrink-0" />
                              <span className="truncate">{appt.clinicName}</span>
                            </p>
                          )}

                          <div className={`mb-2 p-2 rounded-xl text-xs ${isDark ? 'bg-zinc-950/60 border border-zinc-800/60' : 'bg-slate-50 border border-slate-100'}`}>
                            <span className={`font-semibold block text-[10px] uppercase tracking-wider mb-0.5 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>Reason</span>
                            <p className={isDark ? 'text-zinc-200' : 'text-slate-800'}>{appt.reason}</p>
                          </div>

                          {appt.doctorAdvice && (
                            <div className="text-xs mb-2">
                              <span className="text-[10px] uppercase tracking-wider text-blue-400 font-bold block mb-0.5">Doctor's Advice</span>
                              <p className={`line-clamp-2 ${isDark ? 'text-zinc-300' : 'text-slate-600'}`}>{appt.doctorAdvice}</p>
                            </div>
                          )}

                          <div className="flex flex-wrap items-center gap-1.5 pt-2 border-t border-zinc-800/40 text-[10px]">
                            {appt.prescriptions && (
                              <span className={`px-2 py-0.5 rounded-md flex items-center space-x-1 ${isDark ? 'bg-purple-500/10 text-purple-400 border border-purple-500/20' : 'bg-purple-50 text-purple-700'}`}>
                                <span>💊</span>
                                <span className="truncate max-w-[140px]">{appt.prescriptions}</span>
                              </span>
                            )}
                            {appt.attachments?.length > 0 && (
                              <span className={`px-2 py-0.5 rounded-md flex items-center space-x-1 ${isDark ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-emerald-50 text-emerald-700'}`}>
                                <Icon name="image" size={11} />
                                <span>{appt.attachments.length} attachment{appt.attachments.length > 1 ? 's' : ''}</span>
                              </span>
                            )}
                            <span className="ml-auto flex items-center text-blue-400 font-semibold pt-0.5">
                              Details <Icon name="chevronRight" size={13} />
                            </span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* Tab: Clinics */}
            {activeTab === 'clinics' && (
              <div>
                <div className="flex items-center justify-between mb-3 overflow-x-auto no-scrollbar py-1 space-x-2">
                  <button
                    onClick={() => setPreferredOnly(!preferredOnly)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold border flex items-center space-x-1 shrink-0 ${
                      preferredOnly ? 'bg-amber-500 text-black border-amber-500' : isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-300' : 'bg-white border-slate-200 text-slate-700'
                    }`}
                  >
                    <Icon name="star" size={13} className={preferredOnly ? 'fill-black' : ''} />
                    <span>Preferred Only</span>
                  </button>

                  <div className="flex items-center space-x-1.5 shrink-0">
                    {['All', 'Vet', 'GP', 'Dentist', 'Physio'].map(cat => (
                      <button
                        key={cat}
                        onClick={() => setClinicCategoryFilter(cat)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-bold border ${
                          clinicCategoryFilter === cat ? 'bg-blue-600 text-white border-blue-600' : isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-400' : 'bg-white border-slate-200 text-slate-600'
                        }`}
                      >
                        {cat === 'Vet' ? '🐾 Vet' : cat}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-3.5">
                  {filteredClinics.map(clinic => (
                    <div
                      key={clinic.id}
                      className={`p-4 rounded-2xl border ${isDark ? 'bg-zinc-900/90 border-zinc-800' : 'bg-white border-slate-200 shadow-sm'}`}
                    >
                      <div className="flex items-start justify-between mb-2">
                        <div>
                          <div className="flex items-center space-x-2 mb-1">
                            <span className={`text-[10px] px-2 py-0.5 rounded-full border font-bold ${SPECIALTY_CONFIG[clinic.category]?.badge || 'bg-zinc-800 text-zinc-300'}`}>
                              {SPECIALTY_CONFIG[clinic.category]?.icon} {clinic.category}
                            </span>
                            {clinic.preferred && (
                              <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/30 flex items-center space-x-1 font-bold">
                                <Icon name="star" size={10} className="fill-amber-400" />
                                <span>Preferred</span>
                              </span>
                            )}
                          </div>
                          <h3 className="font-bold text-base tracking-tight">{clinic.name}</h3>
                        </div>

                        <div className="flex items-center space-x-1">
                          <button
                            onClick={() => togglePreferredClinic(clinic.id)}
                            className={`p-1.5 rounded-full ${clinic.preferred ? 'text-amber-400 bg-amber-500/10' : 'text-zinc-600'}`}
                          >
                            <Icon name="star" size={18} className={clinic.preferred ? 'fill-amber-400' : ''} />
                          </button>
                          <button
                            onClick={() => deleteClinic(clinic.id)}
                            className="p-1.5 rounded-full text-zinc-600 hover:text-rose-400"
                          >
                            <Icon name="trash2" size={16} />
                          </button>
                        </div>
                      </div>

                      <div className="space-y-1.5 mb-3 text-xs">
                        {clinic.address && (
                          <a
                            href={`https://maps.apple.com/?q=${encodeURIComponent(clinic.address)}`}
                            target="_blank"
                            rel="noreferrer"
                            className="flex items-start space-x-2 text-blue-400 hover:underline"
                          >
                            <Icon name="mapPin" size={14} className="shrink-0 mt-0.5" />
                            <span>{clinic.address}</span>
                          </a>
                        )}
                        {clinic.hours && (
                          <div className={`flex items-center space-x-2 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                            <Icon name="clock" size={14} className="shrink-0" />
                            <span>{clinic.hours}</span>
                          </div>
                        )}
                      </div>

                      <div className="pt-2 border-t border-zinc-800/50 flex flex-wrap gap-2">
                        {clinic.phone && (
                          <a
                            href={`tel:${clinic.phone}`}
                            className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center space-x-1.5"
                          >
                            <Icon name="phone" size={13} />
                            <span>Call {clinic.phone}</span>
                          </a>
                        )}
                        <button
                          onClick={() => setIsApptModalOpen(true)}
                          className={`ml-auto px-3 py-1.5 rounded-xl text-xs font-bold border text-blue-400 ${
                            isDark ? 'bg-blue-500/10 border-blue-500/20' : 'bg-blue-50 border-blue-200'
                          }`}
                        >
                          + Log Visit Here
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Tab: Summary */}
            {activeTab === 'summary' && (
              <div className="space-y-4">
                <div className={`p-4 rounded-2xl border flex flex-col sm:flex-row justify-between gap-3 ${isDark ? 'bg-zinc-900/90 border-zinc-800' : 'bg-white border-slate-200'}`}>
                  <div>
                    <h2 className="text-base font-bold flex items-center space-x-1.5">
                      <Icon name="fileText" size={16} className="text-blue-500" />
                      <span>Health Summary</span>
                    </h2>
                    <p className={`text-xs ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                      {activeMemberObj ? `Clinical dossier for ${activeMemberObj.name}` : 'Dossier for all records'}
                    </p>
                  </div>
                  <div className="flex space-x-2">
                    <button
                      onClick={() => window.print()}
                      className="px-3.5 py-1.5 rounded-xl bg-blue-600 text-white text-xs font-bold flex items-center space-x-1.5"
                    >
                      <Icon name="printer" size={13} />
                      <span>Print / PDF</span>
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2 text-center text-xs">
                  <div className={`p-3 rounded-2xl border ${isDark ? 'bg-zinc-900/60 border-zinc-800' : 'bg-white border-slate-200'}`}>
                    <span className="block text-[10px] uppercase font-bold text-zinc-500">Total Visits</span>
                    <span className="text-xl font-black text-blue-500">{filteredAppointments.length}</span>
                  </div>
                  <div className={`p-3 rounded-2xl border ${isDark ? 'bg-zinc-900/60 border-zinc-800' : 'bg-white border-slate-200'}`}>
                    <span className="block text-[10px] uppercase font-bold text-zinc-500">Upcoming</span>
                    <span className="text-xl font-black text-amber-500">
                      {filteredAppointments.filter(a => a.status === 'Upcoming').length}
                    </span>
                  </div>
                </div>
              </div>
            )}

            {/* Tab: Members */}
            {activeTab === 'members' && (
              <div className="space-y-3">
                {userVisibleMembers.length === 0 ? (
                  <div className={`text-center py-14 rounded-2xl border ${isDark ? 'border-zinc-800 bg-zinc-900/30' : 'border-slate-200 bg-white'}`}>
                    <span className="mx-auto block text-zinc-600 mb-2"><Icon name="users" size={36} className="mx-auto" /></span>
                    <p className="text-sm font-bold">No members or pets found</p>
                    <p className={`text-xs mt-1 ${isDark ? 'text-zinc-500' : 'text-slate-500'}`}>Tap '+ Add Member' to register family members or pets.</p>
                  </div>
                ) : (
                  userVisibleMembers.map(member => {
                    const memberAppts = userVisibleAppointments.filter(a => String(a.memberId) === String(member.id));
                    const isPet = member.type === 'pet';

                    return (
                      <div
                        key={member.id}
                        className={`p-4 rounded-2xl border transition-all ${
                          isDark ? 'bg-zinc-900/90 border-zinc-800' : 'bg-white border-slate-200 shadow-sm'
                        }`}
                      >
                        <div className="flex items-start justify-between">
                          <div className="flex items-center space-x-3">
                            <div className="text-3xl p-2 rounded-2xl bg-blue-500/10 shrink-0">{member.avatar}</div>
                            <div>
                              <div className="flex items-center space-x-2">
                                <h3 className="font-bold text-base tracking-tight">{member.name}</h3>
                                <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                                  isPet ? 'bg-amber-500/15 text-amber-400 border border-amber-500/30' : 'bg-blue-500/15 text-blue-400 border border-blue-500/30'
                                }`}>
                                  {isPet ? `🐾 ${member.species || 'Pet'} • ${member.breed || 'Unknown'}` : (member.role || 'Family')}
                                </span>
                              </div>
                              <p className={`text-xs mt-0.5 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                                {isPet ? (
                                  `${member.gender || 'Unknown'} ${member.isDesexed ? '• Desexed' : ''} ${member.dob ? `• Born ${member.dob}` : ''}`
                                ) : (
                                  `${member.dob ? `DOB: ${member.dob}` : 'Age: N/A'} ${member.bloodType ? `• Blood: ${member.bloodType}` : ''}`
                                )}
                              </p>
                            </div>
                          </div>

                          <span className={`text-xs px-2.5 py-1 rounded-full font-bold ${isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-slate-100 text-slate-700'}`}>
                            {memberAppts.length} visits
                          </span>
                        </div>

                        {/* Detailed Member Dossier Metrics */}
                        <div className={`mt-3 pt-3 border-t text-xs grid grid-cols-2 gap-2.5 ${isDark ? 'border-zinc-800/80 text-zinc-300' : 'border-slate-100 text-slate-600'}`}>
                          <div>
                            <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                              {isPet ? 'Microchip Number' : 'Insurance / Medicare'}
                            </span>
                            <p className="font-mono mt-0.5 truncate">{isPet ? (member.microchip || 'N/A') : (member.insurancePolicy || 'None registered')}</p>
                          </div>

                          <div>
                            <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                              Allergies & Alerts
                            </span>
                            <p className={`mt-0.5 font-bold truncate ${member.allergies?.length ? 'text-rose-400' : ''}`}>
                              {member.allergies?.length ? member.allergies.join(', ') : 'None registered'}
                            </p>
                          </div>

                          {member.conditions && (
                            <div className="col-span-2">
                              <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                                Ongoing Conditions / Special Care
                              </span>
                              <p className="mt-0.5 leading-tight">{member.conditions}</p>
                            </div>
                          )}

                          {member.emergencyContact && (
                            <div className="col-span-2">
                              <span className={`block text-[10px] uppercase font-bold ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>
                                Emergency Contact
                              </span>
                              <p className="mt-0.5">{member.emergencyContact} {member.emergencyPhone ? `• ${member.emergencyPhone}` : ''}</p>
                            </div>
                          )}
                        </div>

                        <div className="mt-3 pt-2 flex items-center justify-between border-t border-zinc-800/40">
                          <button
                            onClick={() => {
                              setSelectedMemberId(member.id);
                              setActiveTab('appointments');
                            }}
                            className="text-xs text-blue-400 hover:underline flex items-center space-x-1 font-semibold"
                          >
                            <span>Filter visits for {member.name}</span>
                            <Icon name="chevronRight" size={13} />
                          </button>

                          <button
                            onClick={() => setMembers(prev => prev.filter(m => m.id !== member.id))}
                            className="text-[11px] text-zinc-500 hover:text-rose-400 flex items-center space-x-1"
                          >
                            <Icon name="trash2" size={12} />
                            <span>Remove</span>
                          </button>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            )}
          </main>

          {/* Modals & Sub-screens */}
          {selectedApptDetail && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm">
              <div className={`w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 border shadow-2xl ${
                isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'
              }`}>
                <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
                  <h2 className="text-base font-bold">{selectedApptDetail.memberName}'s Visit</h2>
                  <button onClick={() => setSelectedApptDetail(null)} className="p-1.5 rounded-full bg-zinc-800 text-zinc-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>
                <div className="space-y-4 py-4 text-xs">
                  <div>
                    <h3 className="font-bold text-sm">{selectedApptDetail.providerName}</h3>
                    <p className="text-zinc-400">{selectedApptDetail.clinicName}</p>
                  </div>
                  <div className="p-3 rounded-xl bg-zinc-950/40 border border-zinc-800">
                    <span className="text-[10px] uppercase font-bold text-zinc-400">Reason</span>
                    <p className="mt-0.5">{selectedApptDetail.reason}</p>
                  </div>
                  <div className="p-3 rounded-xl bg-blue-950/20 border border-blue-800/30 text-blue-100">
                    <span className="text-[10px] uppercase font-bold text-blue-400">Doctor's Advice</span>
                    <p className="mt-0.5 whitespace-pre-line">{selectedApptDetail.doctorAdvice || 'None entered.'}</p>
                  </div>
                </div>
                <div className="pt-3 border-t border-zinc-800 flex justify-between">
                  <button
                    onClick={() => deleteAppointment(selectedApptDetail.id)}
                    className="text-xs font-bold text-rose-400 flex items-center space-x-1"
                  >
                    <Icon name="trash2" size={14} />
                    <span>Delete</span>
                  </button>
                  <button
                    onClick={() => setSelectedApptDetail(null)}
                    className="px-5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {isApptModalOpen && (
            <CreateAppointmentModal
              isDark={isDark}
              members={userVisibleMembers}
              clinics={userVisibleClinics}
              currentUser={currentUser}
              onClose={() => setIsApptModalOpen(false)}
              onSave={(newAppt, autoFollowUp) => {
                if (autoFollowUp) {
                  setAppointments(prev => [newAppt, autoFollowUp, ...prev]);
                } else {
                  setAppointments(prev => [newAppt, ...prev]);
                }
                setIsApptModalOpen(false);
              }}
            />
          )}

          {isClinicModalOpen && (
            <CreateClinicModal
              isDark={isDark}
              currentUser={currentUser}
              onClose={() => setIsClinicModalOpen(false)}
              onSave={(c) => {
                setClinics(prev => [c, ...prev]);
                setIsClinicModalOpen(false);
              }}
            />
          )}

          {isMemberModalOpen && (
            <CreateMemberModal
              isDark={isDark}
              currentUser={currentUser}
              onClose={() => setIsMemberModalOpen(false)}
              onSave={(m) => {
                setMembers(prev => [...prev, m]);
                setIsMemberModalOpen(false);
              }}
            />
          )}

          {isGroupModalOpen && (
            <FamilyGroupModal
              isDark={isDark}
              theme={theme}
              onToggleTheme={() => setTheme(isDark ? 'light' : 'dark')}
              onLockApp={() => {
                setIsGroupModalOpen(false);
                setIsAppLocked(true);
              }}
              currentUser={currentUser}
              currentGroup={currentFamilyGroup}
              familyGroups={familyGroups}
              allUsers={users}
              onClose={() => setIsGroupModalOpen(false)}
              onSwitchUser={(u) => {
                setCurrentUser(u);
                setIsGroupModalOpen(false);
                setIsAppLocked(true);
              }}
              onSignOut={() => {
                setCurrentUser(null);
                setIsGroupModalOpen(false);
              }}
              onUpdatePin={(newPin) => {
                const updated = { ...currentUser, pin: newPin };
                setCurrentUser(updated);
                setUsers(prev => prev.map(u => u.id === currentUser.id ? updated : u));
              }}
              onUpdateGroupName={(groupId, updatedName) => {
                setFamilyGroups(prev => prev.map(g => g.id === groupId ? { ...g, name: updatedName } : g));
              }}
              onCreateGroup={(groupName, inviteCode) => {
                const newGroupId = 'FAM_' + Date.now();
                const newGroup = {
                  id: newGroupId,
                  name: groupName,
                  inviteCode: inviteCode.toUpperCase(),
                  createdBy: currentUser.id
                };
                setFamilyGroups(prev => [...prev, newGroup]);
                const updatedUser = { ...currentUser, familyGroupId: newGroupId };
                setCurrentUser(updatedUser);
                setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
              }}
              onJoinGroup={(code) => {
                const matched = familyGroups.find(g => g.inviteCode.toUpperCase() === code.trim().toUpperCase());
                if (!matched) {
                  return { success: false, message: 'Invalid Invite Code. Please check with your family.' };
                }
                const updatedUser = { ...currentUser, familyGroupId: matched.id };
                setCurrentUser(updatedUser);
                setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
                return { success: true, groupName: matched.name };
              }}
              onLeaveGroup={() => {
                const updatedUser = { ...currentUser, familyGroupId: null };
                setCurrentUser(updatedUser);
                setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
              }}
            />
          )}

          {/* Navigation Bar */}
          <nav className={`fixed bottom-0 left-0 right-0 z-40 backdrop-blur-xl border-t ${isDark ? 'bg-black/85 border-zinc-800' : 'bg-white/90 border-slate-200'}`}>
            <div className="max-w-xl mx-auto px-6 py-2 flex items-center justify-around">
              <button
                onClick={() => setActiveTab('appointments')}
                className={`flex flex-col items-center space-y-1 ${activeTab === 'appointments' ? 'text-blue-500 font-bold' : 'text-zinc-500'}`}
              >
                <Icon name="calendar" size={19} />
                <span className="text-[10px]">Visits</span>
              </button>

              <button
                onClick={() => setActiveTab('clinics')}
                className={`flex flex-col items-center space-y-1 ${activeTab === 'clinics' ? 'text-blue-500 font-bold' : 'text-zinc-500'}`}
              >
                <Icon name="building" size={19} />
                <span className="text-[10px]">Clinics</span>
              </button>

              <button
                onClick={() => setActiveTab('summary')}
                className={`flex flex-col items-center space-y-1 ${activeTab === 'summary' ? 'text-blue-500 font-bold' : 'text-zinc-500'}`}
              >
                <Icon name="fileText" size={19} />
                <span className="text-[10px]">Summary</span>
              </button>

              <button
                onClick={() => setActiveTab('members')}
                className={`flex flex-col items-center space-y-1 ${activeTab === 'members' ? 'text-blue-500 font-bold' : 'text-zinc-500'}`}
              >
                <Icon name="users" size={19} />
                <span className="text-[10px]">Family & Pets</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    // ==========================================
    // PIN LOCK SCREEN
    // ==========================================
    function PinLockScreen({ isDark, currentUser, onUnlock, onSwitchAccount }) {
      const [enteredPin, setEnteredPin] = useState('');
      const [errorShake, setErrorShake] = useState(false);
      const correctPin = currentUser.pin;

      const handleDigit = (digit) => {
        if (enteredPin.length < 4) {
          const next = enteredPin + digit;
          setEnteredPin(next);

          if (next.length === 4) {
            if (next === correctPin) {
              setTimeout(onUnlock, 150);
            } else {
              setErrorShake(true);
              setTimeout(() => {
                setEnteredPin('');
                setErrorShake(false);
              }, 600);
            }
          }
        }
      };

      return (
        <div className={`min-h-screen flex flex-col items-center justify-between py-12 px-6 ${isDark ? 'bg-black text-zinc-100' : 'bg-slate-100 text-slate-900'}`}>
          <div className="flex flex-col items-center text-center mt-6">
            <div className="w-16 h-16 rounded-3xl bg-blue-500/10 text-blue-500 flex items-center justify-center text-3xl mb-3">
              <Icon name="lock" size={32} />
            </div>
            <div className="flex items-center space-x-2">
              <span className="text-xl">{currentUser.avatar}</span>
              <h2 className="text-lg font-black tracking-tight">{currentUser.name}</h2>
            </div>
            <p className="text-xs text-zinc-400 mt-1">Enter 4-digit Passcode</p>

            <div className={`flex items-center space-x-5 mt-6 ${errorShake ? 'animate-bounce' : ''}`}>
              {[0, 1, 2, 3].map(idx => (
                <div
                  key={idx}
                  className={`w-3.5 h-3.5 rounded-full transition-all ${
                    enteredPin.length > idx
                      ? errorShake ? 'bg-rose-500 scale-125' : 'bg-blue-500 scale-110'
                      : 'border-2 border-zinc-700 bg-zinc-900'
                  }`}
                />
              ))}
            </div>
          </div>

          <div className="w-full max-w-[280px] my-auto">
            <div className="grid grid-cols-3 gap-4 text-center">
              {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                <button
                  key={num}
                  type="button"
                  onClick={() => handleDigit(String(num))}
                  className="w-18 h-18 aspect-square rounded-full font-semibold text-2xl flex items-center justify-center border bg-zinc-900/90 border-zinc-800 text-zinc-100 active:scale-90 active:bg-blue-600 transition-all"
                >
                  {num}
                </button>
              ))}
              <button
                type="button"
                onClick={onSwitchAccount}
                className="w-18 h-18 aspect-square rounded-full text-[11px] font-bold flex items-center justify-center text-zinc-400"
              >
                Switch
              </button>
              <button
                type="button"
                onClick={() => handleDigit('0')}
                className="w-18 h-18 aspect-square rounded-full font-semibold text-2xl flex items-center justify-center border bg-zinc-900/90 border-zinc-800 text-zinc-100 active:scale-90 active:bg-blue-600 transition-all"
              >
                0
              </button>
              <button
                type="button"
                onClick={() => setEnteredPin(prev => prev.slice(0, -1))}
                className="w-18 h-18 aspect-square rounded-full flex items-center justify-center text-sm font-bold text-zinc-400"
              >
                <Icon name="delete" size={22} />
              </button>
            </div>
          </div>

          <div className="h-6" />
        </div>
      );
    }

    // ==========================================
    // AUTH SCREEN
    // ==========================================
    function AuthScreen({ isDark, users, familyGroups, onLogin, onCreateUser }) {
      // Allow switching between 'signin' and 'signup' modes
      const [authMode, setAuthMode] = useState(users.length === 0 ? 'signup' : 'signin');
      
      // Sign In Form States
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPin, setLoginPin] = useState('');

      // Sign Up Form States
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [avatar, setAvatar] = useState('👩');
      const [pin, setPin] = useState('');
      const [confirmPin, setConfirmPin] = useState('');
      const [inviteCode, setInviteCode] = useState('');
      const [newGroupName, setNewGroupName] = useState('');
      const [groupChoice, setGroupChoice] = useState('solo'); // 'solo' | 'join' | 'create'
      const [errorMsg, setErrorMsg] = useState('');

      // Handle Sign In with Email and 4-Digit PIN
      const handleSignInSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (!loginEmail.trim()) {
          setErrorMsg('Please enter your email address.');
          return;
        }

        if (!loginPin || loginPin.length !== 4) {
          setErrorMsg('Please enter your 4-digit security PIN.');
          return;
        }

        const normalizedEmail = loginEmail.trim().toLowerCase();
        const matchedUser = users.find(u => u.email && u.email.toLowerCase() === normalizedEmail);

        if (!matchedUser) {
          setErrorMsg('No account found with this email address. Please create an account or verify your email.');
          return;
        }

        if (matchedUser.pin !== loginPin) {
          setErrorMsg('Incorrect 4-digit PIN for this account.');
          return;
        }

        onLogin(matchedUser);
      };

      // Handle Account Creation
      const handleSignUpSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (!name.trim()) {
          setErrorMsg('Please enter your full name.');
          return;
        }

        // Email is strictly mandatory
        if (!email.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) {
          setErrorMsg('A valid email address is mandatory to sign in later or recover your account.');
          return;
        }

        const normalizedEmail = email.trim().toLowerCase();
        const emailExists = users.some(u => u.email && u.email.toLowerCase() === normalizedEmail);
        if (emailExists) {
          setErrorMsg('An account with this email already exists. Please switch to Sign In.');
          return;
        }

        if (!pin || pin.length !== 4 || !/^\d{4}$/.test(pin)) {
          setErrorMsg('Please set a 4-digit numeric PIN code.');
          return;
        }

        if (pin !== confirmPin) {
          setErrorMsg('PIN codes do not match.');
          return;
        }

        let assignedGroupId = null;
        let createdGroup = null;

        if (groupChoice === 'join') {
          const trimmedCode = inviteCode.trim().toUpperCase();
          const matched = familyGroups.find(g => g.inviteCode.toUpperCase() === trimmedCode);
          if (!matched) {
            setErrorMsg('Invalid Invite Code. Please verify with your family or choose Solo mode.');
            return;
          }
          assignedGroupId = matched.id;
        } else if (groupChoice === 'create') {
          if (!newGroupName.trim()) {
            setErrorMsg('Please give your family group a name.');
            return;
          }
          const newGId = 'FAM_' + Date.now();
          const code = (name.slice(0, 3) + Math.floor(1000 + Math.random() * 9000)).toUpperCase();
          createdGroup = {
            id: newGId,
            name: newGroupName.trim(),
            inviteCode: code,
            createdBy: 'u_' + Date.now()
          };
          assignedGroupId = newGId;
        }

        const newUser = {
          id: createdGroup ? createdGroup.createdBy : 'u_' + Date.now(),
          name: name.trim(),
          email: normalizedEmail,
          avatar,
          pin,
          familyGroupId: assignedGroupId
        };

        onCreateUser(newUser, createdGroup);
      };

      return (
        <div className={`min-h-screen flex items-center justify-center p-4 transition-colors ${
          isDark ? 'bg-black text-zinc-100' : 'bg-slate-100 text-slate-900'
        }`}>
          <div className={`w-full max-w-md p-6 rounded-3xl border shadow-2xl ${
            isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-slate-200'
          }`}>
            <div className="text-center mb-5">
              <div className="w-14 h-14 mx-auto mb-3 rounded-2xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-3xl">
                🩺
              </div>
              <h1 className="text-xl font-black tracking-tight flex items-center justify-center gap-1.5">
                CareTracker
              </h1>
              <p className={`text-xs mt-1 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                Family & Pet Medical Tracker
              </p>
            </div>

            {/* Mode Switcher Tabs */}
            <div className={`p-1 rounded-2xl border flex items-center mb-5 ${
              isDark ? 'bg-zinc-950 border-zinc-800' : 'bg-slate-100 border-slate-200'
            }`}>
              <button
                type="button"
                onClick={() => { setAuthMode('signin'); setErrorMsg(''); }}
                className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${
                  authMode === 'signin'
                    ? 'bg-blue-600 text-white shadow-md'
                    : isDark ? 'text-zinc-400 hover:text-zinc-200' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                Sign In
              </button>
              <button
                type="button"
                onClick={() => { setAuthMode('signup'); setErrorMsg(''); }}
                className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${
                  authMode === 'signup'
                    ? 'bg-blue-600 text-white shadow-md'
                    : isDark ? 'text-zinc-400 hover:text-zinc-200' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                Create Account
              </button>
            </div>

            {errorMsg && (
              <div className="mb-4 p-2.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
                <Icon name="alertCircle" size={14} className="shrink-0" />
                <span>{errorMsg}</span>
              </div>
            )}

            {/* SIGN IN FORM */}
            {authMode === 'signin' ? (
              <form onSubmit={handleSignInSubmit} className="space-y-4 text-xs">
                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                    Email Address
                  </label>
                  <input
                    type="email"
                    placeholder="you@example.com"
                    value={loginEmail}
                    onChange={(e) => setLoginEmail(e.target.value)}
                    className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200 focus:border-blue-500' : 'bg-white border-slate-200 text-slate-800 focus:border-blue-500'
                    }`}
                  />
                </div>

                <div>
                  <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                    4-Digit Security PIN
                  </label>
                  <input
                    type="password"
                    maxLength={4}
                    placeholder="••••"
                    value={loginPin}
                    onChange={(e) => setLoginPin(e.target.value.replace(/\D/g, ''))}
                    className={`w-full p-2.5 rounded-xl border text-center font-mono text-base tracking-widest outline-none font-bold ${
                      isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-100 focus:border-blue-500' : 'bg-white border-slate-200 text-slate-900 focus:border-blue-500'
                    }`}
                  />
                  <p className={`text-[10px] mt-1 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                    Enter the 4-digit PIN you created with your account.
                  </p>
                </div>

                <div className="pt-2">
                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-500 shadow-md transition-all active:scale-98"
                  >
                    Sign In
                  </button>
                </div>

                <div className="text-center pt-2 border-t border-zinc-800">
                  <button
                    type="button"
                    onClick={() => { setAuthMode('signup'); setErrorMsg(''); }}
                    className="text-xs font-semibold text-blue-400 hover:underline"
                  >
                    Don't have an account yet? Create one
                  </button>
                </div>
              </form>
            ) : (
              /* CREATE ACCOUNT FORM */
              <form onSubmit={handleSignUpSubmit} className="space-y-3.5 text-xs">
                <div className="grid grid-cols-4 gap-2">
                  <div className="col-span-3">
                    <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>
                      Full Name <span className="text-rose-400">*</span>
                    </label>
                    <input
                      type="text"
                      placeholder="e.g. John Doe"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      className={`w-full p-2.5 rounded-xl border outline-none font-semibold ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                      }`}
                    />
                  </div>
                  <div>
                    <label className={`block font-bold mb-1 ${isDark ? 'text-zinc-300' : 'text-slate-700'}`}>Avatar</label>
                    <input
                      type="text"
                      value={avatar}
                      onChange={(e) => setAvatar(e.target.value)}
                      className={`w-full p-2.5 rounded-xl border text-center text-lg outline-none ${
                        isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'
                      }`}
                    />
                  </div>
